<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 2 – Học từ vựng tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#F4F6F9;--paper:#FFFFFF;--ink:#1E2533;--muted:#5E6778;--line:#DCE2EA;
  --crimson:#A11D35;--crimson-soft:#F7E8EB;--pine:#2E6B57;--pine-soft:#E4F1EB;--amber:#8E5A06;--amber-soft:#FBF1DD;--formula:#EEF2F7;
  --vi:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --zh:"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --snow:#161A22;--paper:#1F2430;--ink:#E7EAF0;--muted:#A3AABA;--line:#343B4A;--crimson:#E0566E;--crimson-soft:#3A2129;--pine:#6CC3A2;--pine-soft:#1D3530;--amber:#E3AE52;--amber-soft:#3A2F1B;--formula:#283040}}
:root[data-theme="dark"]{--snow:#161A22;--paper:#1F2430;--ink:#E7EAF0;--muted:#A3AABA;--line:#343B4A;--crimson:#E0566E;--crimson-soft:#3A2129;--pine:#6CC3A2;--pine-soft:#1D3530;--amber:#E3AE52;--amber-soft:#3A2F1B;--formula:#283040}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--vi);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px;border-radius:4px}
a{color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px clamp(16px,4vw,40px);display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.seal{flex:none;width:38px;height:38px;background:var(--crimson);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--zh);font-weight:700;font-size:18px;box-shadow:inset 0 0 0 3px var(--crimson),inset 0 0 0 4px rgba(255,255,255,.55)}
.brand b{font-size:16px;line-height:1.2;display:block}.brand small{color:var(--muted);font-size:12px}
.tog{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.tog[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
main{max-width:880px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 100px}
h1{font-family:var(--zh);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.2;margin:4px 0 2px;letter-spacing:1px}
h2{font-size:20px;margin:0 0 10px}
.muted{color:var(--muted)}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0 26px}.sum div b{display:block;font-size:26px;line-height:1.1}.sum div span{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none}
.row:hover{background:var(--formula)}
.num{flex:none;width:34px;text-align:center;font-weight:600;color:var(--crimson)}
.rt{flex:1;min-width:0}.rt .z{font-family:var(--zh);font-weight:600;font-size:18px}.rt .v{font-size:14px;color:var(--muted)}
.chip{flex:none;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--formula);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--pine-soft);color:var(--pine)}.chip.part{background:var(--amber-soft);color:var(--amber)}
.crumb{font-size:14px;margin-bottom:6px}.crumb a{color:var(--crimson);text-decoration:none}
.head .py{margin:0;color:var(--muted)}.head .vt{margin:6px 0 0;font-size:17px}
.tabs{display:flex;gap:4px;margin:24px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--crimson);border-bottom-color:var(--crimson);font-weight:600}
.gp{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--crimson);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.gp h3{margin:0 0 8px;font-size:17px}
.formula{display:inline-block;background:var(--formula);border-radius:6px;padding:4px 10px;font-family:var(--zh);font-size:16px;margin-bottom:8px}
.gp p{margin:0 0 10px}
.gex{background:var(--snow);border-radius:6px;padding:10px 12px}
.z,.ans-zh{font-family:var(--zh);font-size:19px;font-weight:600}
.y,.ans-py,.mc-py{color:var(--muted);font-size:14px}.v{font-size:15px}
.speak{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:32px;height:32px;margin-left:8px;vertical-align:middle;font-size:14px;line-height:1}
.hide-py .y,.hide-py .bpy,.hide-py .ans-py,.hide-py .mc-py,.hide-py .pyw{display:none}
ol.items{list-style:none;margin:0;padding:0}
.item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.item.ok{border-color:var(--pine)}.item.near{border-color:var(--amber)}.item.no{border-color:var(--crimson)}
.vs{font-weight:500;margin-bottom:8px}.vs .n{color:var(--crimson);font-weight:600;margin-right:8px}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--snow);padding:10px 12px;font-family:var(--zh);font-size:18px;resize:vertical}
textarea:disabled{opacity:.8}
.res{margin-top:10px;font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:13px}
.badge.ok{background:var(--pine-soft);color:var(--pine)}.badge.near{background:var(--amber-soft);color:var(--amber)}.badge.no{background:var(--crimson-soft);color:var(--crimson)}
.cmp{margin:8px 0}.cmp .line{font-family:var(--zh);font-size:18px;margin:2px 0 8px}
.x{text-decoration:line-through;color:var(--crimson)}.m{font-weight:700;background:var(--pine-soft);color:var(--pine)}
.answer{margin-top:8px;padding:10px 12px;background:var(--snow);border-radius:6px}.ans-note{font-size:14px;margin-top:4px}
.dw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
@media (max-width:560px){.dw{grid-template-columns:1fr}}
.dw div{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--pine);border-radius:8px;padding:12px 14px}
.dw .w{font-family:var(--zh);font-size:22px;font-weight:700}
.mc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.mc-ctx{font-size:14px;color:var(--muted);margin-bottom:4px}
.mc-q{font-family:var(--zh);font-size:19px;font-weight:600;margin-bottom:10px}.mc-q .n{color:var(--crimson);margin-right:8px;font-family:var(--vi);font-size:16px}
.blank{display:inline-block;width:56px;border-bottom:2px solid var(--ink);margin:0 4px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--snow);border-radius:8px;padding:8px 18px;font-family:var(--zh);font-size:18px}
.opt[aria-pressed="true"]{border-color:var(--crimson);background:var(--crimson-soft)}
.opt.right{border-color:var(--pine);background:var(--pine-soft)}.opt.wrong{border-color:var(--crimson);background:var(--crimson-soft)}
.fb{margin-top:10px;font-size:14px;border-radius:6px;padding:10px 12px}.fb.ok{background:var(--pine-soft)}.fb.no{background:var(--crimson-soft)}
.fb .full{font-family:var(--zh);font-size:18px;font-weight:600;margin-top:6px}
.sbox{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.score{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0}.score b{display:block;font-size:26px;line-height:1.1}.score span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 18px;font-weight:600}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.warn{color:var(--crimson)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.pn a{text-decoration:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:500}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.sh{margin:34px 0 6px}.sh .zhs{font-family:var(--zh);color:var(--muted);font-weight:400;font-size:15px;margin-left:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.ok{border-color:var(--pine)}.card.bad{border-color:var(--crimson)}
.face{text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center;position:relative}
.face .n{position:absolute;left:0;top:0;font-size:13px;color:var(--muted)}
.hz{font-family:var(--zh);font-weight:700;font-size:38px;line-height:1.2}.hz.sm{font-size:28px}
.back .bpy{color:var(--muted)}.back .bvi{font-weight:600;color:var(--crimson)}.back .bex{font-family:var(--zh);font-size:16px;margin-top:6px}.back .bexv{font-size:13px;color:var(--muted)}
.copts{display:grid;gap:6px}
.topt{border:1px solid var(--line);background:var(--snow);border-radius:8px;padding:8px 12px;text-align:left}
.copts .topt{font-size:14px}.opts .topt{font-family:var(--zh);font-size:18px}
.topt[aria-pressed="true"]{border-color:var(--crimson);background:var(--crimson-soft)}
.topt.right{border-color:var(--pine);background:var(--pine-soft)}.topt.wrong{border-color:var(--crimson);background:var(--crimson-soft)}
.lt{font-family:var(--vi);font-size:12px;color:var(--muted);margin-right:6px}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 12px;padding:10px 12px;background:var(--amber-soft);border-radius:8px;font-family:var(--zh);font-size:18px}.bank b{font-family:var(--vi);font-size:12px;color:var(--amber);margin-right:4px}
.passage{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--pine);border-radius:8px;padding:14px 16px;margin:18px 0 10px}
.passage .pt{font-size:12px;font-weight:600;color:var(--pine);text-transform:uppercase;letter-spacing:.5px}.passage .pz{font-family:var(--zh);font-size:19px;line-height:1.9}
.pvi{margin-bottom:14px;padding:10px 12px;background:var(--pine-soft);border-radius:6px;font-size:14px}
.ansline{min-height:52px;border:1.5px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ansline.right{border-color:var(--pine);border-style:solid}.ansline.wrong{border-color:var(--crimson);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pc{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-family:var(--zh);font-size:18px}
.ansline .pc{background:var(--crimson-soft);border-color:var(--crimson)}
.zhf{font-family:var(--zh)}
ruby{ruby-position:over;ruby-align:center}
rt{font-family:var(--vi);font-weight:400;font-size:max(10px,.48em);color:var(--muted);letter-spacing:0;line-height:1.1;font-style:normal}
.hide-py rt{display:none}
.nwlist{display:grid;gap:12px}
.nw{display:grid;grid-template-columns:minmax(130px,180px) 1fr auto;gap:8px 18px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.nw.got{border-color:var(--pine);background:var(--pine-soft)}
.nwh{font-family:var(--zh);font-weight:700;font-size:30px;line-height:1.6}
.nwh .n{font-family:var(--vi);font-size:12px;color:var(--muted);font-weight:400;margin-right:6px;vertical-align:top}
.nw .bvi{font-weight:600;color:var(--crimson)}
.nw .bex{font-family:var(--zh);font-size:17px;margin-top:6px;line-height:1.9}
.nw .bhv{font-size:13px;color:var(--amber);font-weight:500}
.nw .bexv{font-size:13px;color:var(--muted)}
.nw .btn{padding:7px 12px;font-size:13px;white-space:nowrap}.nw .btn.on{background:var(--pine);border-color:var(--pine);color:#fff}
@media (max-width:640px){.nw{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.tab,.opt,.row{transition:background .15s,border-color .15s}}

.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.wc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.wc.got{border-color:var(--pine);background:var(--pine-soft)}
.wc .wn{position:absolute;left:10px;top:8px;font-size:12px;color:var(--muted)}
.wf{border:0;background:none;width:100%;padding:22px 0 14px;text-align:center}
.wf .hz{display:block}.wf small{color:var(--muted);font-size:12px}
.wc .sp{position:absolute;right:8px;top:6px}
.wb{text-align:center}.wb .hz{font-size:30px}
.wb .bpy{color:var(--muted)}.wb .bhv{font-size:13px;color:var(--amber);font-weight:500}.wb .bvi{font-weight:600;color:var(--crimson);margin:2px 0 6px}
.wb .bex{font-family:var(--zh);font-size:16px;text-align:left}.wb .bexv{font-size:13px;color:var(--muted);text-align:left}
.wact{display:flex;gap:8px;margin-top:6px}.wact .btn{flex:1;padding:7px 8px;font-size:13px}
.wact .btn.on{background:var(--pine);border-color:var(--pine);color:#fff}
.search{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:11px 14px;font-size:16px;margin:0 0 14px}
.sr{display:flex;gap:14px;align-items:baseline;padding:10px 14px;text-decoration:none;border-bottom:1px solid var(--line)}
.sr:hover{background:var(--formula)}.sr .z{font-family:var(--zh);font-size:20px;font-weight:600;min-width:90px}.sr .v{font-size:14px}.sr .y{font-size:13px}.sr .b{margin-left:auto;font-size:12px;color:var(--crimson);white-space:nowrap}
.sres{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;margin-bottom:18px}
.hint2{font-size:13px;color:var(--muted);margin-bottom:8px}.hint2 b{color:var(--ink);font-family:var(--zh);font-size:15px}
</style>
</head>

        const lb=g.blank?"Chưa làm":g.level==="ok"?"Khớp đáp án":g.level==="near"?"Gần đúng":"Chưa đúng";
        res=`<div class="res"><span class="badge ${g.level}">${lb}${g.blank?"":" "+g.pct+"%"}</span>
          ${(!g.blank&&g.level!=="ok")?`<div class="cmp">Bài của bạn (gạch ngang là chữ thừa hoặc sai):<div class="line">${g.ua}</div>Đáp án (tô đậm là chữ bạn còn thiếu):<div class="line">${g.ub}</div></div>`:""}
          <div class="answer"><div class="ans-zh">${rb(w[4])}${sp(w[4])}</div><div class="ans-py">${esc(w[5])}</div><div class="ans-note"><b>Từ mới:</b> ${rb(w[0])} (${esc(w[1])}): ${esc(w[3])}</div></div></div>`}
      return `<li class="item ${cls}"><div class="vs"><span class="n">${k+1}</span>${esc(w[6])}</div><div class="hint2">Từ mới cần dùng: <b>${rb(w[0])}</b></div>
        <textarea data-i="${k}" rows="2" ${sub?"disabled":""} placeholder="Viết câu tiếng Trung của bạn vào đây…" aria-label="Dịch câu ${k+1}">${esc(S.ans[k]||"")}</textarea>${res}</li>`}).join("");
    const left=SEL.tr.filter((_,k)=>!norm(S.ans[k]).length).length;
    const box=sub?`<div class="sbox"><h2>Kết quả dịch câu</h2><div class="score"><div><b>${ok}/${SEL.tr.length}</b><span>khớp đáp án</span></div><div><b>${near}</b><span>gần đúng</span></div></div>
      <p class="muted">Máy chấm bằng cách so từng chữ với câu ví dụ. Câu "gần đúng" hoặc "chưa đúng" có thể vẫn là một cách dịch hợp lệ.</p><button class="btn" id="redoS">Làm lại phần này</button></div>`
      :`<div class="sbox"><h2>Nộp bài dịch</h2><p class="${warned.s?"warn":"muted"}">${warned.s?`Còn ${left} câu chưa làm. Nộp rồi sẽ không sửa được.`:"Dịch câu tiếng Việt sang tiếng Trung, dùng từ mới được gợi ý. Đáp án hiện ra sau khi nộp."}</p><button class="btn primary" id="subS">${warned.s?"Vẫn nộp bài":"Nộp bài và xem đáp án"}</button></div>`;
    return `<ol class="items">${items}</ol>${box}`}

  // ---- kiểm tra ----
  const FC=SEL.fc.map((wi,i)=>{const c=W[wi],pool=[...new Set(W.filter((_,j)=>j!==wi).map(x=>x[3]).filter(m=>m!==c[3]))];
    const opts=shuf([c[3],...shuf(pool,no*100+i).slice(0,3)],no*7+i*13);return {w:c,opts,a:opts.indexOf(c[3])}});
  const FIG=[];for(let s=0;s<SEL.fi.length;s+=5){const ids=SEL.fi.slice(s,s+5);
    const dis=shuf(W.map((_,j)=>j).filter(j=>!ids.includes(j)&&!ids.some(i=>W[i][7]===W[j][0])),no*50+s)[0];
    const items=ids.map(i=>({t:W[i][7],w:W[i],ans:i,from:W[i][4].indexOf(W[i][7])}));
    if(dis!==undefined)items.push({t:W[dis][0],w:W[dis],ans:-1,from:-1});
    const bank=shuf(items,no*11+s);
    FIG.push({bank,q:ids.map(i=>{const w=W[i];return {w,a:bank.findIndex(b=>b.ans===i),idx:w[4].indexOf(w[7])}})})}
  const OD=SEL.od.map((wi,i)=>{const w=W[wi],ez=w[4];let ps=0;const items=w[8].map(t=>{const s=ez.indexOf(t,ps);ps=s+t.length;return {t,s}});
    const same=a=>a.map(x=>x.t).join("")===w[8].join("");let p=shuf(items,no*31+i*17),k=1;while(same(p)&&k<20){p=shuf(items,no*31+i*17+k);k++}
    return {w,chunks:w[8],pool:p.map((x,id)=>({t:x.t,s:x.s,id}))}});
  const nFI=FIG.reduce((a,g)=>a+g.q.length,0),TOTAL=FC.length+nFI+OD.length;
  const filledT=()=>Object.keys(S2.fc).length+Object.keys(S2.fi).length+Object.values(S2.od).filter(a=>a&&a.length).length;
  const odText=i=>(S2.od[i]||[]).map(id=>OD[i].pool[id].t).join("");
  const odOk=i=>{const u=norm(odText(i));return u.length>0&&norm(OD[i].chunks.join(""))===u};
  function test(){
    const sub=S2.sub,sc={fc:0,fi:0,od:0};
    const st=(p,i,a)=>sub?(i===a?"right":p===i?"wrong":""):"";
    const ob=(at,lab,p,i,a)=>`<button class="topt ${st(p,i,a)}" ${at} aria-pressed="${!sub&&p===i}" ${sub?"disabled":""}>${lab}</button>`;
    const vd=(ok,p)=>ok?"Chính xác.":p===undefined?"Chưa làm.":"Chưa đúng.";
    const cards=FC.map((f,i)=>{const p=S2.fc[i],ok=p===f.a;if(sub&&ok)sc.fc++;const fl=sub&&S2.flip[i],c=f.w;
      const face=fl?`<div class="face back"><div class="hz sm">${rb(c[0])}${sp(c[4])}</div><div class="bpy">${esc(c[1])}</div><div class="bvi">${esc(c[3])}</div><div class="bex">${rb(c[4])}</div><div class="bexv">${esc(c[6])}</div></div>`
        :`<div class="face"><span class="n">${i+1}</span><div class="hz">${rb(c[0])}${sp(c[0])}</div></div>`;
      const opts=fl?"":`<div class="copts">${f.opts.map((o,oi)=>ob(`data-t="fc" data-q="${i}" data-o="${oi}"`,esc(o),p,oi,f.a)).join("")}</div>`;
      return `<div class="card ${sub?(ok?"ok":"bad"):""}">${face}${opts}${sub?`<button class="btn flip" data-flip2="${i}">${fl?"Lật lại":"Lật thẻ"}</button>`:""}</div>`}).join("");
    let qn=0;
    const bk=b=>b.from>=0?rbCtx(b.t,b.w[4],b.from):rb(b.t);
    const fills=FIG.map((g,gi)=>{const bank=`<div class="bank">${g.bank.map((b,wi)=>`<span><b>${LT[wi]}</b>${bk(b)}</span>`).join("")}</div>`;
      const qs=g.q.map((q,qi)=>{const k=gi+"_"+qi,p=S2.fi[k],ok=p===q.a;if(sub&&ok)sc.fi++;qn++;const ez=q.w[4],fm=q.w[7];
        const fb=sub?`<div class="fb ${ok?"ok":"no"}"><b>${vd(ok,p)}</b> Đáp án: <b>${LT[q.a]} ${bk(g.bank[q.a])}</b><div class="full">${rb(ez)}${sp(ez)}</div><div class="y">${esc(q.w[5])}</div><div>${esc(q.w[6])}</div></div>`:"";
        return `<div class="mc"><div class="mc-q"><span class="n">${qn}.</span>${rbCtx(ez.slice(0,q.idx),ez,0)}<span class="blank"></span>${rbCtx(ez.slice(q.idx+fm.length),ez,q.idx+fm.length)}</div><div class="opts">${g.bank.map((b,wi)=>ob(`data-t="fi" data-q="${k}" data-o="${wi}"`,`<b class="lt">${LT[wi]}</b>${bk(b)}`,p,wi,q.a)).join("")}</div>${fb}</div>`}).join("");
      return bank+qs}).join("");
    const ords=OD.map((o,i)=>{const pk=S2.od[i]||[],ok=odOk(i),ez=o.w[4];if(sub&&ok)sc.od++;
      const pb=id=>`<button class="pc" data-od="${i}" data-id="${id}" ${sub?"disabled":""}>${rbCtx(o.pool[id].t,ez,o.pool[id].s)}</button>`;
      const fb=sub?`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Chính xác.":pk.length?"Chưa đúng.":"Chưa làm."}</b><div class="full">${rb(ez)}${sp(ez)}</div><div class="y">${esc(o.w[5])}</div><div>${esc(o.w[6])}</div></div>`:"";
      return `<div class="mc"><div class="mc-q"><span class="n">${i+1}.</span><span style="font-family:var(--vi);font-weight:500;font-size:16px">Sắp xếp thành câu hoàn chỉnh</span></div><div class="ansline ${sub?(ok?"right":"wrong"):""}">${pk.map(pb).join("")}</div><div class="pool">${o.pool.filter(c=>!pk.includes(c.id)).map(c=>pb(c.id)).join("")}</div>${fb}</div>`}).join("");
    const tot=sc.fc+sc.fi+sc.od,left=TOTAL-filledT();
    if(sub&&(S2.score!==tot||S2.total!==TOTAL)){S2.score=tot;S2.total=TOTAL;store(KT,S2)}
    const box=sub?`<div class="sbox" id="tres"><h2>Kết quả bài kiểm tra</h2><div class="score"><div><b>${tot}/${TOTAL}</b><span>tổng số câu đúng</span></div><div><b>${sc.fc}/${FC.length}</b><span>thẻ từ</span></div><div><b>${sc.fi}/${nFI}</b><span>điền từ</span></div><div><b>${sc.od}/${OD.length}</b><span>sắp xếp câu</span></div></div><p class="muted">Bấm "Lật thẻ" ở phần thẻ từ để xem lại phiên âm và câu ví dụ. Phần sắp xếp chấm theo đúng câu ví dụ, nên một số câu có thể còn cách sắp xếp khác vẫn đúng ngữ pháp.</p><button class="btn" id="redoT">Làm lại bài kiểm tra</button></div>`
      :`<div class="sbox" id="tres"><h2>Nộp bài kiểm tra</h2><p id="tinfo" class="${warned.t?"warn":"muted"}">${warned.t?`Còn ${left} câu chưa làm. Nộp rồi sẽ không sửa được.`:`Đã làm ${filledT()}/${TOTAL} câu.`}</p><button class="btn primary" id="subT">${warned.t?"Vẫn nộp bài":"Nộp bài kiểm tra"}</button></div>`;
    const sec=(n,t,z,h)=>`<h2 class="sh">Phần ${n} – ${t} <span class="zhs">${rb(z)}</span></h2><p class="hint">${h}</p>`;
    return `<p class="muted" style="margin-top:0">Gồm ${TOTAL} câu lấy từ các từ mới của bài này. Bài được lưu tự động, đáp án hiện ra sau khi nộp.</p>
      ${sec(1,`Thẻ từ (${FC.length} câu)`,"词语卡片","Nhìn chữ Hán, chọn nghĩa đúng.")}<div class="cards">${cards}</div>
      ${sec(2,`Điền từ (${nFI} câu)`,"选词填空","Chọn từ trong khung để điền vào chỗ trống. Mỗi nhóm có một từ không dùng đến.")}${fills}
      ${sec(3,`Sắp xếp câu (${OD.length} câu)`,"连词成句","Bấm các mảnh theo đúng thứ tự để ghép thành câu. Bấm vào mảnh ở dòng trả lời để gỡ ra.")}${ords}
      ${box}`}
  const updT=()=>{const p=$("#tinfo");if(p&&!S2.sub){warned.t=false;p.className="muted";p.textContent=`Đã làm ${filledT()}/${TOTAL} câu.`;const b=$("#subT");if(b)b.textContent="Nộp bài kiểm tra"}};

  function draw(keep){
    app.innerHTML=head+(tab==="n"?newWords():tab==="w"?words():tab==="s"?sent():test())+pn;
    app.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
    document.title=`HSK ${LV.lv} – Bài ${no} · ${rangeTxt(no)}`;
    if(!keep)window.scrollTo(0,0);
    const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
    app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
    app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
    app.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{const i=b.dataset.flip;OPEN[i]=!OPEN[i];if(openAll){openAll=false;W.forEach((_,j)=>OPEN[j]=j!=i)}draw(true)});
    app.querySelectorAll("[data-got]").forEach(b=>b.onclick=()=>{const g=b.dataset.got;if(LRN[g])delete LRN[g];else LRN[g]=1;store(P+"learned",LRN);draw(true)});
    on("#flipAll",()=>{openAll=!openAll;if(!openAll)W.forEach((_,j)=>OPEN[j]=false);draw(true)});
    app.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{S.ans[t.dataset.i]=t.value;store(KS,S)});
    on("#subS",()=>{const left=SEL.tr.filter((_,k)=>!norm(S.ans[k]).length).length;if(left&&!warned.s){warned.s=true;draw(true);return}S.subS=true;store(KS,S);draw()});
    on("#redoS",()=>{S.subS=false;S.ans={};store(KS,S);warned.s=false;draw()});
    app.querySelectorAll(".topt:not([disabled])").forEach(b=>b.onclick=()=>{const bag=S2[b.dataset.t],q=b.dataset.q,o=+b.dataset.o;if(bag[q]===o)delete bag[q];else bag[q]=o;store(KT,S2);
      b.parentNode.querySelectorAll(".topt").forEach(x=>x.setAttribute("aria-pressed",bag[q]===+x.dataset.o));updT()});
    app.querySelectorAll("[data-od]:not([disabled])").forEach(b=>b.onclick=()=>{const i=b.dataset.od,id=+b.dataset.id,a=(S2.od[i]=S2.od[i]||[]),k=a.indexOf(id);if(k>=0)a.splice(k,1);else a.push(id);store(KT,S2);warned.t=false;draw(true)});
    app.querySelectorAll("[data-flip2]").forEach(b=>b.onclick=()=>{const i=b.dataset.flip2;S2.flip[i]=!S2.flip[i];store(KT,S2);draw(true)});
    on("#subT",()=>{if(filledT()<TOTAL&&!warned.t){warned.t=true;draw(true);$("#tres").scrollIntoView({block:"center"});return}S2.sub=true;store(KT,S2);draw(true);$("#tres").scrollIntoView({block:"start"})});
    on("#redoT",()=>{S2.sub=false;S2.fc={};S2.fi={};S2.od={};S2.flip={};delete S2.score;delete S2.total;store(KT,S2);warned.t=false;draw()});
  }
  draw()}

function route(){const m=location.hash.match(/^#\/bai\/(\d+)/);m?lesson(+m[1]):home()}
addEventListener("hashchange",route);route();
})();
</script>
</body>
