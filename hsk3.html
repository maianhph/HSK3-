 có tân ngữ thì lặp lại động từ: 喜欢汉语喜欢得…", "ex": ["他高兴得跳了起来。", "Tā gāoxìng de tiào le qǐlai.", "Anh ấy vui đến nỗi nhảy cẫng lên."]}, {"t": "一……就……", "f": "一 + V1，就 + V2", "d": "Vừa… là…: V2 xảy ra ngay sau V1, hoặc hễ có V1 là có V2.", "ex": ["我一到家就给你打电话。", "Wǒ yí dào jiā jiù gěi nǐ dǎ diànhuà.", "Về đến nhà là tôi gọi cho bạn ngay."]}, {"t": "如果……(的话)，就……", "f": "如果 + điều kiện (+ 的话)，(主语) + 就 + kết quả", "d": "Nếu… thì… Dùng cả cho giả định trái với thực tế: 如果我还年轻.", "ex": ["如果明天下雨，我们就不去了。", "Rúguǒ míngtiān xià yǔ, wǒmen jiù bú qù le.", "Nếu mai mưa thì mình không đi nữa."]}, {"t": "Tính từ lặp lại để miêu tả", "f": "AA的 (大大的, 长长的, 黑黑的)", "d": "Làm miêu tả sinh động hơn. Tính từ lặp lại không đi với 很.", "ex": ["她的眼睛大大的。", "Tā de yǎnjing dàdà de.", "Mắt cô ấy to tròn."]}], "s": [["Anh ta không thích ăn mãi một món, ở mãi một nơi, hay yêu mãi một người.", "他不喜欢总是吃一样的菜，住一样的地方，爱同一个人。", "Tā bù xǐhuan zǒngshì chī yíyàng de cài, zhù yíyàng de dìfang, ài tóng yí ge rén.", "\"Mãi\" dịch là 总是. 一样的: giống nhau, cùng loại. 同一个: cùng một."], ["Nếu tôi còn trẻ, tôi sẽ đi du lịch khắp nơi trên thế giới.", "如果我还年轻的话，我一定去世界各地旅游。", "Rúguǒ wǒ hái niánqīng dehuà, wǒ yídìng qù shìjiè gè dì lǚyóu.", "如果…的话: nếu… (ở đây là giả định trái thực tế). 世界各地: khắp nơi trên thế giới."], ["Nếu tôi thi tốt, tôi sẽ mời bạn đi ăn ở nhà hàng Trung Quốc gần đây.", "如果我考得好，我就请你去附近的中国饭馆吃饭。", "Rúguǒ wǒ kǎo de hǎo, wǒ jiù qǐng nǐ qù fùjìn de Zhōngguó fànguǎn chī fàn.", "如果…就…. 考得好: thi tốt (bổ ngữ trạng thái). 请 + người + 去…吃饭: mời ai đi ăn."], ["Cô ấy cố gắng đến mức mỗi tối đều học bài tới 12 giờ mới ngủ.", "她努力得每天晚上都学习到十二点才睡觉。", "Tā nǔlì de měi tiān wǎnshang dōu xuéxí dào shí'èr diǎn cái shuìjiào.", "努力得 + câu: cố gắng đến mức… V + 到 + thời điểm: làm đến lúc nào. 才: mới (muộn)."], ["Bọn họ vui đến nỗi vừa cười vừa khóc.", "他们高兴得又笑又哭。", "Tāmen gāoxìng de yòu xiào yòu kū.", "高兴得 + kết quả. 又…又… ở đây nối hai động từ chỉ trạng thái cùng lúc."], ["Chân tôi đau đến nỗi không nói được gì luôn.", "我的脚疼得一句话也说不出来。", "Wǒ de jiǎo téng de yí jù huà yě shuō bu chūlai.", "疼得 + kết quả. 一句话也不/说不出来: một câu cũng không nói ra được. 说不出来 là bổ ngữ khả năng."], ["Tóc bạn gái tôi đen, chân dài, mắt to – xinh đẹp đến mức tôi không thể không yêu cô ấy.", "我女朋友头发黑黑的，腿长长的，眼睛大大的，漂亮得我不能不爱她。", "Wǒ nǚpéngyou tóufa hēihēi de, tuǐ chángcháng de, yǎnjing dàdà de, piàoliang de wǒ bù néng bú ài tā.", "Tính từ lặp AA的 để miêu tả. 漂亮得 + câu: đẹp đến mức… 不能不: không thể không (= phải)."], ["Tôi thích tiếng Hán đến nỗi ngày nào cũng xem phim Trung Quốc.", "我喜欢汉语喜欢得每天都看中国电影。", "Wǒ xǐhuan Hànyǔ xǐhuan de měi tiān dōu kàn Zhōngguó diànyǐng.", "Động từ có tân ngữ (喜欢汉语) thì phải lặp lại động từ trước 得: 喜欢汉语喜欢得…"], ["Bây giờ tôi mệt đến mức vừa tan làm là chỉ muốn ngủ.", "我现在累得一下班就只想睡觉。", "Wǒ xiànzài lèi de yí xiàbān jiù zhǐ xiǎng shuìjiào.", "累得 + câu. 一…就…: vừa… là… 下班: tan làm."], ["Món này ngon đến nỗi tôi muốn ăn thêm lần nữa!", "这个菜好吃得我还想再吃一次！", "Zhège cài hǎochī de wǒ hái xiǎng zài chī yí cì!", "好吃得 + câu. 还想再…: còn muốn… thêm nữa. 一次 sau động từ: một lần."]], "dist": {"pair": "的, 得 và 地", "w": [["的", "de", "Đứng TRƯỚC danh từ: 我的书, 妈妈做的菜."], ["得", "de", "Đứng SAU động từ, tính từ, dẫn ra bổ ngữ: 说得好, 累得不想动."], ["地", "de", "Đứng TRƯỚC động từ, biến cụm phía trước thành trạng ngữ: 高高兴兴地走了."]], "q": [{"q": "这是我妈妈做___菜。", "o": ["的", "得", "地"], "a": 0, "zh": "这是我妈妈做的菜。", "py": "Zhè shì wǒ māma zuò de cài.", "vi": "Đây là món mẹ tôi nấu.", "why": "Phía sau là danh từ 菜, nên dùng 的."}, {"q": "他高兴___跳了起来。", "o": ["的", "得", "地"], "a": 1, "zh": "他高兴得跳了起来。", "py": "Tā gāoxìng de tiào le qǐlai.", "vi": "Anh ấy vui đến nỗi nhảy cẫng lên.", "why": "Sau tính từ 高兴, dẫn ra mức độ, nên dùng 得."}, {"q": "孩子们高高兴兴___去公园了。", "o": ["的", "得", "地"], "a": 2, "zh": "孩子们高高兴兴地去公园了。", "py": "Háizimen gāogāoxìngxìng de qù gōngyuán le.", "vi": "Bọn trẻ vui vẻ đi công viên.", "why": "高高兴兴 bổ nghĩa cho động từ 去 phía sau, nên dùng 地."}, {"q": "你汉语说___真好！", "o": ["的", "得", "地"], "a": 1, "zh": "你汉语说得真好！", "py": "Nǐ Hànyǔ shuō de zhēn hǎo!", "vi": "Bạn nói tiếng Trung giỏi thật!", "why": "Sau động từ 说, dẫn ra đánh giá, nên dùng 得."}]}}, {"no": 17, "zhT": "谁都有办法看好你的“病”", "pyT": "Shéi dōu yǒu bànfǎ kàn hǎo nǐ de “bìng”", "viT": "Ai cũng có cách chữa khỏi “bệnh” của em", "g": [{"t": "Đại từ nghi vấn phiếm chỉ", "f": "谁 / 什么 / 哪儿 + 都 / 也 + …", "d": "Ai cũng, cái gì cũng, đâu cũng. Câu phủ định hay dùng 也: 谁也不知道.", "ex": ["这件事谁都知道。", "Zhè jiàn shì shéi dōu zhīdào.", "Chuyện này ai cũng biết."]}, {"t": "不是……都……", "f": "不是 + 谁 / 什么 + 都 + …", "d": "Không phải ai / cái gì cũng… (phủ định một phần).", "ex": ["不是谁都能学好汉语。", "Bú shì shéi dōu néng xué hǎo Hànyǔ.", "Không phải ai cũng học giỏi được tiếng Trung."]}, {"t": "Động từ ly hợp", "f": "请假 → 请几天假 ／ 跑步 → 跑完步", "d": "Động từ ly hợp gồm động từ + tân ngữ. Thời lượng, bổ ngữ kết quả phải chen vào giữa hai chữ.", "ex": ["我想请两天假。", "Wǒ xiǎng qǐng liǎng tiān jià.", "Tôi muốn xin nghỉ hai ngày."]}, {"t": "Liệt kê và kể trình tự", "f": "一是…，二是… ／ 以前…，后来…，最后…", "d": "一是…二是…: một là… hai là… 以前…后来…最后…: trước đây… sau đó… cuối cùng… (kể lại chuyện đã qua).", "ex": ["他以前是老师，后来当了经理。", "Tā yǐqián shì lǎoshī, hòulái dāng le jīnglǐ.", "Trước đây anh ấy là giáo viên, sau đó làm giám đốc."]}], "s": [["Cuối tuần này tôi muốn xin nghỉ phép mấy ngày vì có việc riêng.", "这个周末我想请几天假，因为我有一些自己的事情。", "Zhège zhōumò wǒ xiǎng qǐng jǐ tiān jià, yīnwèi wǒ yǒu yìxiē zìjǐ de shìqing.", "请假 là động từ ly hợp: thời lượng chen vào giữa, 请几天假. 自己的事情: việc riêng."], ["Hàng xóm của tôi ai cũng rất nhiệt tình và yêu thích thể thao.", "我的邻居们谁都很热情，也都很喜欢运动。", "Wǒ de línjūmen shéi dōu hěn rèqíng, yě dōu hěn xǐhuan yùndòng.", "谁都: ai cũng. 也都: cũng đều. Thể thao, vận động là 运动."], ["Bạn trai tôi vẽ tranh, hát, đá bóng... cái gì cũng giỏi.", "我男朋友画画儿、唱歌、踢足球……什么都做得很好。", "Wǒ nánpéngyou huà huàr, chàng gē, tī zúqiú…… shénme dōu zuò de hěn hǎo.", "什么都: cái gì cũng. 做得很好: làm giỏi (bổ ngữ trạng thái). Khẩu ngữ hay nói 什么都很厉害."], ["\"Thể thao rất quan trọng\" – câu nói này không phải ai cũng hiểu rõ.", "“运动很重要”——这句话不是谁都真的明白。", "“Yùndòng hěn zhòngyào” —— zhè jù huà bú shì shéi dōu zhēn de míngbai.", "不是谁都…: không phải ai cũng… (phủ định một phần). Lượng từ của câu nói là 句."], ["Bạn cần nhớ: vừa chạy bộ xong thì không nên ngồi xuống ngay.", "你要记住：刚跑完步，不要马上坐下。", "Nǐ yào jì zhù: gāng pǎo wán bù, búyào mǎshàng zuò xià.", "跑步 là động từ ly hợp: 跑完步 (完 chen vào giữa). 记住: nhớ kỹ. 马上: ngay lập tức."], ["Chúng tôi trước đây là bạn bè, sau đó trở thành bạn thân, cuối cùng là người yêu.", "我们以前是朋友，后来变成了好朋友，最后成了男女朋友。", "Wǒmen yǐqián shì péngyou, hòulái biànchéng le hǎo péngyou, zuìhòu chéng le nán-nǚ péngyou.", "以前…后来…最后…: kể trình tự chuyện đã qua. 变成 / 成: trở thành."], ["Ai cũng biết thể thao tốt cho sức khỏe, chỉ có tôi là không biết giữ gìn.", "谁都知道运动对身体好，只有我不注意自己的身体。", "Shéi dōu zhīdào yùndòng duì shēntǐ hǎo, zhǐyǒu wǒ bú zhùyì zìjǐ de shēntǐ.", "谁都知道: ai cũng biết. A对B好: A tốt cho B. 只有: chỉ có."], ["Bài thi hôm nay gồm hai phần: một là chọn đúng sai, hai là trả lời câu hỏi.", "今天的考试有两个部分：一是判断对错，二是回答问题。", "Jīntiān de kǎoshì yǒu liǎng ge bùfen: yī shì pànduàn duì cuò, èr shì huídá wèntí.", "一是…二是…: một là… hai là… 部分: phần. 判断对错: phán đoán đúng sai."], ["Ai cũng có cách riêng để giúp bạn vượt qua khó khăn.", "谁都有自己的办法帮你解决问题。", "Shéi dōu yǒu zìjǐ de bànfǎ bāng nǐ jiějué wèntí.", "谁都有: ai cũng có. 办法 + động từ: cách để làm gì. 解决问题: giải quyết vấn đề."], ["\"Bệnh\" lười của em, ai cũng có thể chữa được – trừ chính em!", "你的“懒病”，谁都能看好——除了你自己！", "Nǐ de “lǎn bìng”, shéi dōu néng kàn hǎo —— chúle nǐ zìjǐ!", "看好病: chữa khỏi bệnh (看 ở đây là khám chữa). 除了…: trừ… ra."]], "dist": {"pair": "以前, 后来 và 然后", "w": [["以前", "yǐqián", "Trước đây, so với bây giờ."], ["后来", "hòulái", "Về sau, sau đó. Chỉ dùng khi kể chuyện ĐÃ qua."], ["然后", "ránhòu", "Sau đó, tiếp theo. Nối trình tự các bước, dùng được cả cho tương lai."]], "q": [{"q": "我___不喜欢运动，现在每天都跑步。", "o": ["以前", "后来", "然后"], "a": 0, "zh": "我以前不喜欢运动，现在每天都跑步。", "py": "Wǒ yǐqián bù xǐhuan yùndòng, xiànzài měi tiān dōu pǎobù.", "vi": "Trước đây tôi không thích thể thao, giờ ngày nào cũng chạy bộ.", "why": "So sánh với 现在, nên dùng 以前."}, {"q": "我们先吃饭，___去看电影。", "o": ["以前", "后来", "然后"], "a": 2, "zh": "我们先吃饭，然后去看电影。", "py": "Wǒmen xiān chī fàn, ránhòu qù kàn diànyǐng.", "vi": "Chúng ta ăn cơm trước, sau đó đi xem phim.", "why": "Kế hoạch chưa xảy ra, nối trình tự sau 先, nên dùng 然后. 后来 không dùng cho tương lai."}, {"q": "他去年来过一次，___再也没来过。", "o": ["以前", "后来", "然后"], "a": 1, "zh": "他去年来过一次，后来再也没来过。", "py": "Tā qùnián lái guo yí cì, hòulái zài yě méi lái guo.", "vi": "Năm ngoái anh ấy đến một lần, về sau không đến nữa.", "why": "Kể chuyện đã qua, chỉ khoảng thời gian về sau, nên dùng 后来."}, {"q": "你先往前走，___往左走。", "o": ["以前", "后来", "然后"], "a": 2, "zh": "你先往前走，然后往左走。", "py": "Nǐ xiān wǎng qián zǒu, ránhòu wǎng zuǒ zǒu.", "vi": "Bạn đi thẳng trước, sau đó rẽ trái.", "why": "Chỉ đường là các bước theo thứ tự, nên dùng 然后."}]}}, {"no": 18, "zhT": "我相信他们会同意的", "pyT": "Wǒ xiāngxìn tāmen huì tóngyì de", "viT": "Tôi tin họ sẽ đồng ý", "g": [{"t": "只要……就……", "f": "只要 + điều kiện，(主语) + 就 + kết quả", "d": "Chỉ cần… là… Điều kiện đủ: có nó là có kết quả, nhưng không phải điều kiện duy nhất.", "ex": ["只要你喜欢，就买吧。", "Zhǐyào nǐ xǐhuan, jiù mǎi ba.", "Chỉ cần bạn thích thì mua đi."]}, {"t": "关于", "f": "关于 + chủ đề，…", "d": "Về (vấn đề gì). Thường đứng đầu câu để nêu chủ đề.", "ex": ["关于这件事，我们明天再说。", "Guānyú zhè jiàn shì, wǒmen míngtiān zài shuō.", "Về chuyện này, mai mình bàn tiếp."]}, {"t": "会……的", "f": "会 + động từ + 的", "d": "Khẳng định chắc chắn điều gì đó sẽ xảy ra.", "ex": ["我相信他们会同意的。", "Wǒ xiāngxìn tāmen huì tóngyì de.", "Tôi tin họ sẽ đồng ý."]}, {"t": "A 跟 B 一样，都……", "f": "A 跟 B 一样，都 + …", "d": "A cũng giống B, đều…", "ex": ["我跟你一样，都是学生。", "Wǒ gēn nǐ yíyàng, dōu shì xuésheng.", "Tôi cũng như bạn, đều là học sinh."]}], "s": [["Chỉ cần em đồng ý, anh nguyện sẽ đối xử tốt với em cả đời.", "只要你同意，我就一辈子对你好。", "Zhǐyào nǐ tóngyì, wǒ jiù yíbèizi duì nǐ hǎo.", "只要…就…: chỉ cần… là… 对 + người + 好: đối xử tốt với ai. 一辈子: cả đời."], ["Tôi muốn mượn bạn một ít tiền, được không?", "我想跟你借点儿钱，可以吗？", "Wǒ xiǎng gēn nǐ jiè diǎnr qián, kěyǐ ma?", "Mượn CỦA ai: 跟 + người + 借. Nếu nói 借你钱 lại thành \"cho bạn mượn tiền\"."], ["Tôi nghĩ, chỉ cần tôi chăm chỉ học tập thì nhất định sẽ thi đậu đại học.", "我觉得，只要我努力学习，就一定能考上大学。", "Wǒ juéde, zhǐyào wǒ nǔlì xuéxí, jiù yídìng néng kǎo shàng dàxué.", "只要…就…. 考上: thi đỗ (bổ ngữ kết quả 上). 一定: nhất định."], ["Về việc mua nhà, tôi vẫn chưa quyết định sẽ mua ở đâu.", "关于买房子的事，我还没决定在哪儿买。", "Guānyú mǎi fángzi de shì, wǒ hái méi juédìng zài nǎr mǎi.", "关于…的事: về chuyện… đứng đầu câu. 还没决定: vẫn chưa quyết định."], ["Về kỳ thi đại học, tôi vẫn chưa nghĩ xong sẽ đăng ký trường nào.", "关于高考，我还没想好要考哪个大学。", "Guānyú gāokǎo, wǒ hái méi xiǎng hǎo yào kǎo nǎge dàxué.", "关于 + chủ đề. 想好: nghĩ xong (bổ ngữ kết quả 好). Kỳ thi đại học ở Trung Quốc gọi là 高考."], ["Bạn có biết không, động vật cũng giống như trẻ em – đều cần được chăm sóc.", "你知道吗？动物跟孩子一样，都需要别人照顾。", "Nǐ zhīdào ma? Dòngwù gēn háizi yíyàng, dōu xūyào biérén zhàogù.", "A跟B一样，都…: A cũng như B, đều… \"Được chăm sóc\" dịch thành 需要别人照顾 cho tự nhiên."], ["Mỗi người đều có thói quen sinh hoạt khác nhau.", "每个人都有不同的生活习惯。", "Měi ge rén dōu yǒu bù tóng de shēnghuó xíguàn.", "每…都…. 不同的: khác nhau (định ngữ). 生活习惯: thói quen sinh hoạt."], ["Sau một thời gian cố gắng làm việc, giám đốc giờ đã rất tin tưởng tôi.", "经过一段时间的努力工作，经理现在已经很相信我了。", "Jīngguò yí duàn shíjiān de nǔlì gōngzuò, jīnglǐ xiànzài yǐjīng hěn xiāngxìn wǒ le.", "经过…: trải qua… 一段时间: một khoảng thời gian. 相信: tin tưởng. 已经…了: đã… rồi."], ["Thành phố này có đặc điểm gì? Bạn có thể giới thiệu cho tôi một chút không?", "这个城市有什么特点？你能给我介绍一下吗？", "Zhège chéngshì yǒu shénme tèdiǎn? Nǐ néng gěi wǒ jièshào yíxià ma?", "特点: đặc điểm. 给 + người + 介绍一下: giới thiệu cho ai một chút."], ["Khi đến làm việc tại một công ty mới, bạn sẽ luôn có cảm giác mới mẻ.", "到一个新公司工作的时候，你总会有一种新鲜的感觉。", "Dào yí ge xīn gōngsī gōngzuò de shíhou, nǐ zǒng huì yǒu yì zhǒng xīnxiān de gǎnjué.", "…的时候: khi… 总会: luôn sẽ. 新鲜的感觉: cảm giác mới mẻ; lượng từ là 种."]], "dist": {"pair": "会, 能 và 可以", "w": [["会", "huì", "Biết làm (nhờ học mà có); hoặc \"sẽ\" (dự đoán)."], ["能", "néng", "Có khả năng, có điều kiện để làm."], ["可以", "kěyǐ", "Được phép; xin phép."]], "q": [{"q": "我___说一点儿汉语。", "o": ["会", "能", "可以"], "a": 0, "zh": "我会说一点儿汉语。", "py": "Wǒ huì shuō yìdiǎnr Hànyǔ.", "vi": "Tôi biết nói một chút tiếng Trung.", "why": "Kỹ năng có được nhờ học, nên dùng 会."}, {"q": "老师，我___进来吗？", "o": ["会", "能", "可以"], "a": 2, "zh": "老师，我可以进来吗？", "py": "Lǎoshī, wǒ kěyǐ jìnlai ma?", "vi": "Thưa cô, em vào được không ạ?", "why": "Xin phép, nên dùng 可以."}, {"q": "我相信他们___同意的。", "o": ["会", "能", "可以"], "a": 0, "zh": "我相信他们会同意的。", "py": "Wǒ xiāngxìn tāmen huì tóngyì de.", "vi": "Tôi tin họ sẽ đồng ý.", "why": "Dự đoán tương lai trong cấu trúc 会…的."}, {"q": "我感冒了，明天不___去上课了。", "o": ["会", "能", "可以"], "a": 1, "zh": "我感冒了，明天不能去上课了。", "py": "Wǒ gǎnmào le, míngtiān bù néng qù shàngkè le.", "vi": "Tôi bị cảm rồi, mai không đi học được.", "why": "Do điều kiện sức khỏe mà không làm được, nên dùng 能."}]}}, {"no": 19, "zhT": "你没看出来吗", "pyT": "Nǐ méi kàn chūlai ma", "viT": "Anh không nhìn ra được à?", "g": [{"t": "出来 (nghĩa mở rộng)", "f": "看 / 听 / 认 / 写 / 猜 + 出来", "d": "Không còn là \"đi ra\" nữa, mà là làm cho điều gì đó lộ ra, nhận biết được: 看出来 (nhìn ra), 认出来 (nhận ra), 猜出来 (đoán ra), 写出来 (viết ra).", "ex": ["我听出来了，是你的声音。", "Wǒ tīng chūlai le, shì nǐ de shēngyīn.", "Tôi nghe ra rồi, là giọng bạn."]}, {"t": "起来 (nghĩa mở rộng)", "f": "想起来 ／ 看起来", "d": "想起来: nhớ ra điều đã quên. 看起来 / 听起来: xem ra, trông có vẻ, nghe có vẻ.", "ex": ["这个菜看起来很好吃。", "Zhège cài kàn qǐlai hěn hǎochī.", "Món này trông có vẻ ngon."]}, {"t": "下来 (nghĩa mở rộng)", "f": "安静 / 慢 / 停 + 下来", "d": "Chuyển từ trạng thái động sang tĩnh, dần ổn định lại.", "ex": ["教室里安静下来了。", "Jiàoshì li ānjìng xiàlai le.", "Lớp học đã yên lặng lại."]}, {"t": "Bổ ngữ khả năng với xu hướng", "f": "V + 得 / 不 + 出来 / 起来", "d": "看不出来 (không nhìn ra được), 想不起来 (không nhớ ra được).", "ex": ["我想不起来他的名字。", "Wǒ xiǎng bu qǐlai tā de míngzi.", "Tôi không nhớ ra tên anh ấy."]}], "s": [["Tên tiếng Trung của mình, bạn có thể viết ra không?", "我的中文名字，你能写出来吗？", "Wǒ de Zhōngwén míngzi, nǐ néng xiě chūlai ma?", "写出来: viết ra được (出来 nghĩa mở rộng). Tân ngữ 我的中文名字 đưa lên đầu câu làm chủ đề."], ["Mình không đoán ra cậu nấu món gì nữa.", "我猜不出来你做的是什么菜。", "Wǒ cāi bu chūlai nǐ zuò de shì shénme cài.", "猜不出来: bổ ngữ khả năng, không đoán ra được. 你做的: món bạn nấu."], ["Xin lỗi, mình không nhận ra cậu là ai.", "对不起，我没认出来你是谁。", "Duìbuqǐ, wǒ méi rèn chūlai nǐ shì shéi.", "认出来: nhận ra. Chuyện vừa xảy ra nên phủ định bằng 没. Muốn nói \"không thể nhận ra\" thì dùng 认不出来."], ["Đứa trẻ đó nếu đang khóc chỉ cần nhìn thấy tôi là sẽ yên lặng lại.", "那个孩子如果在哭，只要看见我就会安静下来。", "Nàge háizi rúguǒ zài kū, zhǐyào kànjiàn wǒ jiù huì ānjìng xiàlai.", "安静下来: yên lặng lại (下来 nghĩa mở rộng). 只要…就…: chỉ cần… là… 在 + V: đang."], ["Tốt quá, bạn thức dậy rồi, chúng ta sắp trễ học rồi bạn biết không?", "太好了，你终于醒了！我们上课快要迟到了，你知道吗？", "Tài hǎo le, nǐ zhōngyú xǐng le! Wǒmen shàngkè kuài yào chídào le, nǐ zhīdào ma?", "醒了: tỉnh, thức dậy rồi. 快要…了: sắp. 迟到: đến muộn. (醒过来 thường dùng khi tỉnh lại sau khi ngất, ốm nặng.)"], ["Tôi không thể nhớ được cuốn sách này là của ai.", "我想不起来这本书是谁的了。", "Wǒ xiǎng bu qǐlai zhè běn shū shì shéi de le.", "想不起来: không nhớ ra được (bổ ngữ khả năng + 起来). 了 cuối câu: trạng thái mới (đã quên mất)."], ["Hôm nay sao bạn không nói gì cả, xem ra hình như không vui lắm.", "你今天怎么不说话？看起来好像不太高兴。", "Nǐ jīntiān zěnme bù shuōhuà? Kàn qǐlai hǎoxiàng bú tài gāoxìng.", "看起来: xem ra, trông có vẻ. 好像: hình như. 怎么不…: sao không…"], ["Trải qua một thời gian cố gắng làm việc, giám đốc bây giờ rất tin tưởng tôi.", "经过一段时间的努力工作，经理现在很相信我。", "Jīngguò yí duàn shíjiān de nǔlì gōngzuò, jīnglǐ xiànzài hěn xiāngxìn wǒ.", "Câu này giống câu 8 bài 18. 经过…: trải qua… 相信: tin tưởng."], ["Mình thật sự mong thời gian có thể chậm lại, mình sắp phải về nước rồi.", "我真希望时间能过得慢一点儿，我快要回国了。", "Wǒ zhēn xīwàng shíjiān néng guò de màn yìdiǎnr, wǒ kuài yào huí guó le.", "希望: mong. 过得慢一点儿: trôi chậm hơn một chút. Cũng có thể nói 时间能慢下来 (下来 nghĩa mở rộng)."], ["Đọc sách mỗi ngày khiến tôi cảm thấy rất hạnh phúc.", "每天看书让我觉得很幸福。", "Měi tiān kàn shū ràng wǒ juéde hěn xìngfú.", "让 + người + cảm xúc: khiến ai cảm thấy… Văn viết trang trọng hơn dùng 使 (shǐ)."]], "dist": {"pair": "出来 và 起来", "w": [["出来", "chūlai", "Làm lộ ra, nhận biết được, tạo ra cái mới: 看出来 (nhìn ra), 想出来 (nghĩ ra)."], ["起来", "qǐlai", "想起来: nhớ ra điều đã quên. 看起来: trông có vẻ."]], "q": [{"q": "你没看___吗？她今天不太高兴。", "o": ["出来", "起来"], "a": 0, "zh": "你没看出来吗？她今天不太高兴。", "py": "Nǐ méi kàn chūlai ma? Tā jīntiān bú tài gāoxìng.", "vi": "Bạn không nhìn ra à? Hôm nay cô ấy không vui lắm.", "why": "Quan sát rồi nhận ra điều gì, nên dùng 看出来."}, {"q": "这件衣服看___很贵。", "o": ["出来", "起来"], "a": 1, "zh": "这件衣服看起来很贵。", "py": "Zhè jiàn yīfu kàn qǐlai hěn guì.", "vi": "Cái áo này trông có vẻ đắt.", "why": "Nhận xét theo vẻ bề ngoài (trông có vẻ), nên dùng 看起来."}, {"q": "我终于想___他叫什么名字了。", "o": ["出来", "起来"], "a": 1, "zh": "我终于想起来他叫什么名字了。", "py": "Wǒ zhōngyú xiǎng qǐlai tā jiào shénme míngzi le.", "vi": "Cuối cùng tôi cũng nhớ ra anh ấy tên gì.", "why": "Nhớ lại điều đã biết nhưng quên, nên dùng 想起来."}, {"q": "这个好办法是谁想___的？", "o": ["出来", "起来"], "a": 0, "zh": "这个好办法是谁想出来的？", "py": "Zhège hǎo bànfǎ shì shéi xiǎng chūlai de?", "vi": "Cách hay này là ai nghĩ ra vậy?", "why": "Nghĩ ra một điều mới, trước đó chưa có, nên dùng 想出来."}]}}, {"no": 20, "zhT": "我被他影响了", "pyT": "Wǒ bèi tā yǐngxiǎng le", "viT": "Mình chịu ảnh hưởng từ anh ấy", "g": [{"t": "Câu bị động với 被", "f": "Chủ thể chịu tác động + 被 + (người làm) + động từ + thành phần khác", "d": "Sau động từ thường phải có 了, bổ ngữ kết quả… (吃完了, 认错了). Phủ định đặt 没 trước 被: 没被发现. Người làm có thể lược bỏ.", "ex": ["我的自行车被弟弟骑走了。", "Wǒ de zìxíngchē bèi dìdi qí zǒu le.", "Xe đạp của tôi bị em trai đạp đi mất rồi."]}, {"t": "只有……才……", "f": "只有 + điều kiện，(主语) + 才 + kết quả", "d": "Chỉ khi… mới… Điều kiện duy nhất: thiếu nó thì không có kết quả.", "ex": ["只有多练习，才能说好汉语。", "Zhǐyǒu duō liànxí, cái néng shuō hǎo Hànyǔ.", "Chỉ có luyện nhiều mới nói giỏi tiếng Trung được."]}, {"t": "虽然……但是……", "f": "虽然 + A，但是 + B", "d": "Tuy… nhưng… (tiếng Việt hay nói \"dù… nhưng\").", "ex": ["虽然很累，但是我很高兴。", "Suīrán hěn lèi, dànshì wǒ hěn gāoxìng.", "Tuy mệt nhưng tôi rất vui."]}, {"t": "Bổ ngữ kết quả 错", "f": "认错 / 写错 / 听错 / 叫错", "d": "Làm nhầm, làm sai.", "ex": ["对不起，我听错了。", "Duìbuqǐ, wǒ tīng cuò le.", "Xin lỗi, tôi nghe nhầm."]}], "s": [["Đồ ăn của chúng ta bị con chó kia ăn sạch rồi.", "我们的饭被那只狗吃完了。", "Wǒmen de fàn bèi nà zhī gǒu chī wán le.", "Câu bị động: A + 被 + B + V + 完了. Lượng từ của chó là 只. \"Ăn sạch\" khẩu ngữ còn nói 吃光了."], ["Chỉ khi giải quyết xong vấn đề này, tôi mới yên tâm nghỉ ngơi.", "只有把这个问题解决了，我才能放心地休息。", "Zhǐyǒu bǎ zhège wèntí jiějué le, wǒ cái néng fàngxīn de xiūxi.", "只有…才…: chỉ khi… mới… 把…解决了: giải quyết xong. 放心地 + động từ: yên tâm mà làm."], ["Xin lỗi, mình không nhận ra cậu là ai.", "对不起，我没认出来你是谁。", "Duìbuqǐ, wǒ méi rèn chūlai nǐ shì shéi.", "Câu này giống câu 3 bài 19. 认出来: nhận ra; phủ định dùng 没."], ["Người trẻ tuổi khi gặp khó khăn thường rất lo lắng, không biết nên giải quyết thế nào.", "年轻人遇到困难的时候，常常很着急，不知道应该怎么解决。", "Niánqīng rén yù dào kùnnan de shíhou, chángcháng hěn zháojí, bù zhīdào yīnggāi zěnme jiějué.", "遇到困难: gặp khó khăn. 着急: lo lắng, sốt ruột. 应该怎么 + V: nên… thế nào."], ["Chỉ có anh trai tôi mới có thể nói tiếng Anh giỏi như thế.", "只有我哥哥才能说这么好的英语。", "Zhǐyǒu wǒ gēge cái néng shuō zhème hǎo de Yīngyǔ.", "只有 + người + 才: chỉ có ai mới… 这么好的: tốt như thế này (định ngữ)."], ["Điện thoại tôi để trên bàn lúc nãy mà, sao bây giờ lại không thấy nữa?", "我的手机刚才还放在桌子上，怎么现在找不到了？", "Wǒ de shǒujī gāngcái hái fàng zài zhuōzi shang, zěnme xiànzài zhǎo bu dào le?", "刚才还…: lúc nãy vẫn còn… 找不到: tìm không thấy (bổ ngữ khả năng). 了: tình huống mới."], ["Vấn đề này của công ty vẫn chưa được giải quyết.", "公司的这个问题还没被解决。", "Gōngsī de zhège wèntí hái méi bèi jiějué.", "Phủ định câu 被: 没 đứng TRƯỚC 被. Trong khẩu ngữ người Trung hay bỏ 被: 还没解决."], ["Chúng tôi thường hay bị người khác nhận nhầm.", "我们常常被别人认错。", "Wǒmen chángcháng bèi biérén rèn cuò.", "被 + người + V + 错: bị ai làm nhầm. Phó từ 常常 đứng trước 被."], ["Dù sống cùng một thành phố, nhưng chúng tôi rất ít khi gặp nhau.", "虽然住在同一个城市，但是我们很少见面。", "Suīrán zhù zài tóng yí ge chéngshì, dànshì wǒmen hěn shǎo jiànmiàn.", "虽然…但是…: tuy… nhưng… 很少: rất ít khi. 见面 là động từ ly hợp, không có tân ngữ phía sau."], ["Sắp thi HSK3 rồi, mình đã ôn tập xong từ lâu, còn các bạn đã chuẩn bị xong chưa?", "快要考HSK三级了，我早就复习好了，你们都准备好了吗？", "Kuài yào kǎo HSK sān jí le, wǒ zǎo jiù fùxí hǎo le, nǐmen dōu zhǔnbèi hǎo le ma?", "快要…了: sắp. 早就…了: từ lâu đã. 复习好 / 准备好: bổ ngữ kết quả 好. HSK3 đọc là HSK 三级."]], "dist": {"pair": "只要……就…… và 只有……才……", "w": [["只要……就……", "zhǐyào… jiù…", "Chỉ cần… là…: điều kiện đủ, có nó thì có kết quả (nhưng cách khác cũng có thể được)."], ["只有……才……", "zhǐyǒu… cái…", "Chỉ khi… mới…: điều kiện duy nhất, thiếu nó thì không được."]], "q": [{"q": "___你努力，就一定能考好。", "o": ["只要", "只有"], "a": 0, "zh": "只要你努力，就一定能考好。", "py": "Zhǐyào nǐ nǔlì, jiù yídìng néng kǎo hǎo.", "vi": "Chỉ cần bạn cố gắng là nhất định thi tốt.", "why": "Vế sau có 就, nên đi với 只要."}, {"q": "___多练习，才能说好汉语。", "o": ["只要", "只有"], "a": 1, "zh": "只有多练习，才能说好汉语。", "py": "Zhǐyǒu duō liànxí, cái néng shuō hǎo Hànyǔ.", "vi": "Chỉ có luyện tập nhiều mới nói giỏi tiếng Trung được.", "why": "Vế sau có 才, nên đi với 只有."}, {"q": "只要有时间，我___去看你。", "o": ["就", "才"], "a": 0, "zh": "只要有时间，我就去看你。", "py": "Zhǐyào yǒu shíjiān, wǒ jiù qù kàn nǐ.", "vi": "Chỉ cần có thời gian là tôi đến thăm bạn.", "why": "只要 đi cặp với 就."}, {"q": "只有他来了，我们___能开始。", "o": ["就", "才"], "a": 1, "zh": "只有他来了，我们才能开始。", "py": "Zhǐyǒu tā lái le, wǒmen cái néng kāishǐ.", "vi": "Chỉ khi anh ấy đến, chúng ta mới bắt đầu được.", "why": "只有 đi cặp với 才: anh ấy là điều kiện bắt buộc."}]}}];

y khó, mình cùng nghĩ cách giải quyết nhé."]]}, {"bank": ["越", "跟", "一样", "得", "认识", "知道"], "q": [["雨___下越大了。", 0, "Mưa càng lúc càng to."], ["我的想法___你一样。", 1, "Suy nghĩ của tôi giống bạn."], ["这两件衣服的颜色___。", 2, "Màu của hai chiếc áo này giống nhau."], ["她的汉语说___跟中国人一样好。", 3, "Cô ấy nói tiếng Trung giỏi như người Trung Quốc."], ["你___他住在哪儿吗？", 5, "Bạn có biết anh ấy sống ở đâu không?"]]}], "read": [{"p": "安娜学汉语学了三年了，她的汉语说得跟中国人一样好。她说：“我每天都看中国电视，听中国歌，还常常跟中国朋友聊天儿。”她觉得汉语越学越有意思，现在她对中国文化也越来越感兴趣了。", "vi": "Anna học tiếng Trung được ba năm rồi, cô ấy nói tiếng Trung giỏi như người Trung Quốc. Cô ấy nói: \"Ngày nào tôi cũng xem tivi Trung Quốc, nghe nhạc Trung Quốc, còn hay trò chuyện với bạn Trung Quốc.\" Cô thấy tiếng Trung càng học càng thú vị, giờ cô cũng ngày càng thích văn hóa Trung Quốc.", "q": [["安娜学汉语学了多长时间了？", ["一年", "两年", "三年"], 2], ["安娜的汉语怎么样？", ["跟中国人一样好", "不太好", "还可以"], 0], ["下面哪个不是安娜学汉语的方法？", ["看中国电视", "去中国旅游", "跟中国朋友聊天儿"], 1], ["安娜觉得学汉语怎么样？", ["越学越难", "越学越有意思", "越学越累"], 1], ["安娜现在对什么越来越感兴趣？", ["中国文化", "中国菜", "中国历史"], 0]]}, {"p": "晚上玩儿手机对睡觉有影响吗？医生说，有很大的影响。很多人睡觉以前一直看手机，越看越不想睡。第二天上班的时候，他们就觉得很累。医生说，睡觉前一个小时最好别玩儿手机。", "vi": "Buổi tối chơi điện thoại có ảnh hưởng đến giấc ngủ không? Bác sĩ nói là ảnh hưởng rất lớn. Nhiều người trước khi ngủ cứ xem điện thoại suốt, càng xem càng không muốn ngủ. Hôm sau đi làm họ thấy rất mệt. Bác sĩ nói, một tiếng trước khi ngủ tốt nhất đừng chơi điện thoại.", "q": [["晚上玩儿手机对睡觉有影响吗？", ["没有影响", "有很大的影响", "有一点儿影响"], 1], ["很多人睡觉以前做什么？", ["看书", "听音乐", "看手机"], 2], ["一直看手机的人会怎么样？", ["越看越不想睡", "越看越困", "很快就睡了"], 0], ["第二天他们觉得怎么样？", ["很舒服", "很累", "很高兴"], 1], ["睡觉前多长时间最好别玩儿手机？", ["半个小时", "一个小时", "两个小时"], 1]]}], "ord": [[["她的汉语", "说得", "跟中国人", "一样好"], "Cô ấy nói tiếng Trung giỏi như người Trung Quốc."], [["雨", "越下", "越大了"], "Mưa càng lúc càng to."], [["我的想法", "跟你的", "一样"], "Suy nghĩ của tôi giống của bạn."], [["晚上喝咖啡", "对睡觉", "有", "影响"], "Buổi tối uống cà phê có ảnh hưởng đến giấc ngủ."], [["他", "学习", "非常", "努力"], "Cậu ấy học rất chăm chỉ."], [ g."], ["只有", "zhǐyǒu", "chỉ có", "只有多练习，才能学好。", "Chỉ có luyện nhiều mới học giỏi được."], ["虽然", "suīrán", "tuy, mặc dù", "虽然很累，但是很高兴。", "Tuy mệt nhưng rất vui."], ["但是", "dànshì", "nhưng", "他很忙，但是每天都运动。", "Anh ấy rất bận nhưng ngày nào cũng tập."], ["错", "cuò", "sai", "对不起，我拿错了。", "Xin lỗi, tôi cầm nhầm rồi."], ["自己", "zìjǐ", "tự mình, bản thân", "这件事你自己决定吧。", "Việc này bạn tự quyết định đi."], ["动物", "dòngwù", "động vật", "你最喜欢什么动物？", "Bạn thích con vật nào nhất?"], ["熊猫", "xióngmāo", "gấu trúc", "大熊猫是黑白色的。", "Gấu trúc có màu đen trắng."], ["猫", "māo", "con mèo", "我家的小猫喜欢吃鱼。", "Con mèo nhà tôi thích ăn cá."], ["鸟", "niǎo", "con chim", "树上有很多小鸟。", "Trên cây có rất nhiều chim nhỏ."], ["月亮", "yuèliang", "mặt trăng", "今天晚上的月亮又大又圆。", "Trăng tối nay vừa to vừa tròn."], ["字", "zì", "chữ", "你写错了一个字。", "Bạn viết sai một chữ."], ["刮风", "guā fēng", "nổi gió", "外面刮风了。", "Bên ngoài nổi gió rồi."], ["才", "cái", "mới", "只有努力，才能成功。", "Chỉ có cố gắng mới thành công được."]], "fill": [{"bank": ["动物", "熊猫", "猫", "鸟", "月亮", "刮风"], "q": [["大___是黑白色的，很多人都喜欢它。", 1, "Gấu trúc có màu đen trắng, rất nhiều người yêu thích."], ["我家的小___喜欢吃鱼。", 2, "Con mèo nhỏ nhà tôi thích ăn cá."], ["树上有很多小___在唱歌。", 3, "Trên cây có nhiều chú chim nhỏ đang hót."], ["今天晚上的___又大又圆。", 4, "Trăng tối nay vừa to vừa tròn."], ["外面___了，你多穿点儿衣服。", 5, "Bên ngoài nổi gió rồi, mặc thêm áo đi."]]}, {"bank": ["被", "只有", "虽然", "错", "自己", "影响"], "q": [["我的自行车___弟弟骑走了。", 0, "Xe đạp của tôi bị em trai đạp đi mất rồi."], ["___多练习，才能学好汉语。", 1, "Chỉ có luyện tập nhiều mới học giỏi tiếng Trung."], ["___他很累，但是还在工作。", 2, "Tuy anh ấy rất mệt nhưng vẫn đang làm việc."], ["对不起，我拿___了，这不是我的包。", 3, "Xin lỗi, tôi cầm nhầm rồi, đây không phải túi của tôi."], ["这件事你___决定吧。", 4, "Việc này bạn tự quyết định đi."]]}, {"bank": ["被", "才", "但是", "就", "影响", "所以"], "q": [["只有多练习，___能学好。", 1, "Chỉ có luyện nhiều mới học giỏi được."], ["只要多练习，___能学好。", 3, "Chỉ cần luyện nhiều là học giỏi được."], ["虽然下雨了，___我们还是去了。", 2, "Tuy trời mưa nhưng chúng tôi ng là chê). 一点儿 đứng SAU tính từ (…hơn một chút, so sánh). 不A也不B: không A cũng không B. Lượng từ của váy, quần là 条.":"yǒu diǎn ér yì diǎn ér bù yě bù tiáo","还没…呢: vẫn chưa… (呢 cuối câu làm câu mềm hơn). Câu phủ định với 没 không có 了.":"hái méi ne ne méi le","还是 và 或者":"hái shì huò zhě","Dùng trong câu hỏi lựa chọn, hoặc sau 不知道 / 没想好 / 没决定… (vẫn đang phân vân).":"bù zhī dào méi xiǎng hǎo méi jué dìng","你喝茶___喝咖啡？":"nǐ hē chá hē kā fēi","Đây là câu hỏi bắt người nghe chọn một trong hai, nên dùng 还是.":"hái shì","周末我常常看书___看电影。":"zhōu mò wǒ cháng cháng kàn shū kàn diàn yǐng","Câu kể bình thường, không hỏi ai chọn gì, nên dùng 或者.":"huò zhě","我还没想好坐火车去___坐飞机去。":"wǒ hái méi xiǎng hǎo zuò huǒ chē qù zuò fēi jī qù","Không có dấu hỏi nhưng vẫn là lựa chọn chưa quyết (sau 还没想好), nên dùng 还是.":"hái méi xiǎng hǎo hái shì","你明天___后天来都可以。":"nǐ míng tiān hòu tiān lái dōu kě yǐ","Nêu các khả năng đều chấp nhận được, nên dùng 或者.":"huò zhě","V1 + (bổ ngữ kết quả / xu hướng) + 了 + (tân ngữ) + 就 + V2":"le jiù","V1 xong là làm V2 ngay. 了 ở đây chỉ V1 đã hoàn thành trước V2, nên dùng được cho cả việc sắp làm, không chỉ chuyện đã qua. Nếu V1 có bổ ngữ thì 了 đứng SAU bổ ngữ: 买完了水果就…, 走进了教室就…, 回到了宿舍就… Động từ ly hợp thì 了 chen vào giữa: 下了课, 游了泳.":"le le mǎi wán le shuǐ guǒ jiù zǒu jìn le jiào shì jiù huí dào le sù shè jiù le xià le kè yóu le yǒng","Bổ ngữ xu hướng đơn 来 / 去":"lái qù","Động từ + 来 / 去":"lái qù","来: hành động hướng VỀ PHÍA người nói. 去: hành động RỜI XA người nói. Muốn chọn đúng, trước hết phải xác định người nói đang đứng ở đâu.":"lái qù","Động từ + nơi chốn + 来 / 去":"lái qù","Khi có tân ngữ chỉ nơi chốn, nó phải đứng GIỮA động từ và 来 / 去. Không nói 进来教室, mà nói 进教室来.":"lái qù jìn lái jiào shì jìn jiào shì lái","去 / 来 / 回 + nơi chốn + động từ":"qù lái huí","Nói gọn: 先……再……":"xiān zài","先 + V1，再 + V2":"xiān zài","Câu liên động: 去 + nơi chốn + động từ (đi đâu để làm gì). Tên Hoa viết là 华; 姐 đứng sau tên: 华姐.":"qù huá jiě huá jiě","去 + nơi chốn + động từ. Người nói không ở nhà anh Minh nên dùng 去. 吧 cuối câu: đề nghị.":"qù qù ba","Người nói đang ở nhà mình, người nghe đi về phía người nói nên dùng 来. Nhấc máy điện thoại nói 喂 (wèi).":"lái wèi","Người nói đang ở trong nhà, ra ngoài là rời xa chỗ đang đứng nên dùng 出去. 跟 + người: cùng với ai.":"chū qù gēn","Người nói đang ở dưới, Minh đi xuống về phía người nói nên dùng 下来. Đá bóng là 踢足球.":"xià lái tī zú qiú","Cô giáo ở trong lớp nên dùng 来. Tân ngữ nơi chốn 教室 đứng giữa 进 và 来, không nói 进来教室.":"lái jiào shì jìn lái jìn lái jiào shì","V + BNKQ + 了 + O + 就 + V: 买完了水果就进去 (mua xong là vào ngay). Việc chưa xảy ra vẫn dùng 了 vì nó chỉ \"xong V1\". Người nói đứng ngoài quán nên dùng 进去.":"le jiù mǎi wán le shuǐ guǒ jiù jìn qù le jìn qù","才: \"mới\", cho thấy thời gian lâu hơn mong muốn. 回来: về lại chỗ người nói. Sếp thường gọi là 经理.":"cái huí lái jīng lǐ","上 + nơi chốn + 去: đi lên chỗ nào đó. Số phòng đọc từng chữ số, số 1 thường đọc là yāo. 上课: học, lên lớp.":"shàng qù shàng kè","V1了 + 就 + V2. 游泳 là động từ ly hợp nên 了 chen vào giữa: 游了泳. 怎么这么 + tính từ: sao… thế. KFC là 肯德基.":"le jiù yóu yǒng le yóu le yǒng zěn me zhè me kěn dé jī","怎么可能…呢？: sao mà… được (câu hỏi tu từ, ý là không thể). Người yêu là nam thì đổi thành 男朋友.":"zěn me kě néng ne nán péng yǒu","V + BNKQ 到 + 了 + nơi chốn + 就 + V: 回到了宿舍就看电影 (về đến KTX là xem phim). Ký túc xá là 宿舍.":"dào le jiù huí dào le sù shè jiù kàn diàn yǐng sù shè","V + BNXH 进 + 了 + nơi chốn + 就 + V: 走进了教室就收… Chuyện đã xảy ra nên V2 cũng có 了: 收了. 收作业: thu bài tập về nhà.":"jìn le jiù zǒu jìn le jiào shì jiù shōu le shōu le shōu zuò yè","V1了 + nơi chốn + 就 + V2: 到了宾馆就去吃饭. 跟…一起: cùng với ai. Khách hàng trong công việc cũng có thể nói 客户 (kèhù).":"le jiù dào le bīn guǎn jiù qù chī fàn gēn yì qǐ kè hù","V + BNKQ 完 + 了 + O + 就 + V. Hai vế khác chủ ngữ (我 / 我们) thì 就 đứng sau chủ ngữ vế hai. Lẩu là 火锅.":"wán le jiù wǒ wǒ men jiù huǒ guō","这么 + động từ: như thế này. 应该: nên. 问问: động từ lặp, hỏi thử. 先: trước đã.":"zhè me yīng gāi wèn wèn xiān","才 và 再":"cái zài","你先休息，吃完饭___做作业。":"nǐ xiān xiū xī chī wán fàn zuò zuò yè","Sắp xếp trình tự cho việc chưa làm, nên dùng 再.":"zài","我昨天晚上十一点___到家。":"wǒ zuó tiān wǎn shàng shí yì diǎn dào jiā","Việc đã xảy ra và muộn, nên dùng 才. 再 không dùng cho việc đã qua.":"cái zài","这件事我们明天___说吧。":"zhè jiàn shì wǒ men míng tiān shuō ba","Hoãn việc sang ngày mai, nên dùng 再.":"zài","他学了三年汉语___能看中国电影。":"tā xué le sān nián hàn yǔ néng kàn zhòng guó diàn yǐng","Phải mất lâu mới làm được, nên dùng 才.":"cái","Câu tồn hiện với 着":"zhe","Nơi chốn + động từ + 着 + (số lượng) + danh từ":"zhe","Câu hỏi tu từ 不是……吗":"bú shì ma","不是 + … + 吗？":"bú shì ma","别……了":"bié le","别 + động từ + 了":"bié le","Động từ + 在 + nơi chốn":"zài","放 / 住 / 坐 + 在 + nơi chốn":"fàng zhù zuò zài","Cho biết vật hoặc người ở đâu sau khi hành động xảy ra. Hỏi vị trí: 放在哪儿了？":"fàng zài nǎ ér le","别…了: thôi đừng… nữa (bỏ kế hoạch đã định). 吧 cuối câu làm lời đề nghị mềm hơn.":"bié le ba","放在 + nơi chốn: để ở đâu. 刚买的: vừa mới mua (định ngữ). Lượng từ của hộp sữa là 盒.":"fàng zài gāng mǎi de hé","Kết hợp hai điểm ngữ pháp: câu tồn hiện (桌子上放着饮料) và câu hỏi tu từ 不是…吗.":"zhuō zi shàng fàng zhe yǐn liào bú shì ma","怎么 ở đây hỏi nguyên nhân kèm ngạc nhiên (sao lại…). 一点儿也不记得: không nhớ chút nào.":"zěn me yì diǎn ér yě bú jì dé","太…了: quá. Tính từ + 一点儿 + 的: loại… hơn một chút (的 thay cho danh từ đã nói). 种: loại.":"tài le yì diǎn ér de de zhǒng","只…不…: chỉ… mà không…. 多 + động từ + (一)点儿: làm thêm một chút. 菜 vừa là rau vừa là món ăn.":"zhǐ bù duō yī diǎn ér cài","给 + người + 打电话: gọi điện cho ai (给 đứng TRƯỚC động từ, khác tiếng Việt). 不会: sẽ không.":"gěi dǎ diàn huà gěi bú huì","会…的: khẳng định chắc chắn sẽ làm. 好好 + động từ: làm cho thật tốt, đàng hoàng.":"huì de hǎo hǎo","会 + tính từ + 一点儿: sẽ… hơn một chút. 累了: 了 chỉ sự thay đổi trạng thái.":"huì yì diǎn ér lèi le le","Câu kể nên \"hoặc\" dùng 或者. …的时候: khi…; …以后: sau khi… (cả hai đều đứng sau vế câu).":"huò zhě de shí hòu yǐ hòu","一点儿 và 有点儿":"yì diǎn ér yǒu diǎn ér","Đứng TRƯỚC tính từ: hơi…, thường mang ý không vừa lòng. 有点儿贵, 有点儿冷.":"yǒu diǎn ér guì yǒu diǎn ér lěng","Đứng SAU tính từ: …hơn một chút (so sánh, đề nghị). Và trong cấu trúc 一点儿也不…":"yì diǎn ér yě bù","今天___冷，你多穿点儿衣服。":"jīn tiān lěng nǐ duō chuān diǎn ér yī fú","Chỗ trống đứng trước tính từ 冷, nên chỉ có thể là 有点儿.":"lěng yǒu diǎn ér","这件太大了，有没有小___的？":"zhè jiàn tài dà le yǒu méi yǒu xiǎo de","Đứng sau tính từ 小, mang ý so sánh (nhỏ hơn), nên dùng 一点儿.":"xiǎo yì diǎn ér","我___也不饿。":"wǒ yě bù è","Cấu trúc cố định 一点儿也不 + tính từ.":"yì diǎn ér yě bù","这个菜___辣，我不太喜欢。":"zhè ge cài là wǒ bù tài xǐ huān","Đánh giá không vừa ý, đứng trước tính từ, nên dùng 有点儿.":"yǒu diǎn ér","Động từ 1 + 着 + động từ 2":"zhe","V1 着 + V2":"zhe","V1 là cách thức, tư thế khi làm V2: 笑着说 (cười nói), 站着吃 (đứng ăn), 坐着听 (ngồi nghe).":"xiào zhe shuō zhàn zhe chī zuò zhe tīng","又 + tính từ + 又 + tính từ":"yòu yòu","一边 + V1 + 一边 + V2":"yī biān yī biān","每次……都……":"měi cì dōu","每次 + … + 都 + …":"měi cì dōu","又A又B nối hai tính từ. 总是: lúc nào cũng. 笑着: động từ + 着 chỉ trạng thái kéo dài. 跟…说话: nói chuyện với ai.":"yòu yòu zǒng shì xiào zhe zhe gēn shuō huà","站着吃: V1着V2, đứng (tư thế) để ăn. Cả cụm 站着吃东西 làm định ngữ, nối với 那个人 bằng 的.":"zhàn zhe chī zhe zhàn zhe chī dōng xī nà ge rén de","每次…都…: lần nào cũng. 笑着回答: vừa cười vừa trả lời (cười là cách trả lời).":"měi cì dōu xiào zhe huí dá","又A又B với hai tính từ. Lượng từ của cửa hàng, nhà hàng là 家.":"yòu yòu jiā","\"Ai cũng\" có thể dịch là 大家都 hoặc 谁都. 做事: làm việc (nói chung).":"dà jiā dōu shéi dōu zuò shì","是…的 nhấn mạnh thời gian của việc đã xảy ra. Lượng từ của ảnh là 张.":"shì de zhāng","Động từ + 得 + đánh giá: 说得有点儿快. 听懂: nghe hiểu (bổ ngữ kết quả), phủ định là 没听懂.":"dé shuō dé yǒu diǎn ér kuài tīng dǒng méi tīng dǒng","一边…一边… nối hai hành động cùng lúc. 总是 đứng trước 一边.":"yī biān yī biān zǒng shì yī biān","Giống câu 2: 站着吃蛋糕 là định ngữ cho 那个人.":"zhàn zhe chī dàn gāo nà ge rén","给 + người + 介绍: giới thiệu cho ai. 一下 sau động từ làm câu nhẹ nhàng hơn.":"gěi jiè shào yī xià","又……又…… và 一边……一边……":"yòu yòu yī biān yī biān","这个苹果___大___甜。":"zhè ge píng guǒ dà tián","大 và 甜 là tính từ, nên dùng 又…又…":"dà tián yòu yòu","他___吃饭___看手机。":"tā chī fàn kàn shǒu jī","Hai hành động xảy ra cùng lúc, nên dùng 一边…一边…":"yī biān yī biān","我妹妹___聪明___可爱。":"wǒ mèi mèi cōng míng kě ài","聪明 và 可爱 là tính từ chỉ đặc điểm.":"cōng míng kě ài","我们___走___聊天吧。":"wǒ men zǒu liáo tiān ba","走 và 聊天 là hai hành động đồng thời.":"zǒu liáo tiān","越来越 + tính từ / động từ tâm lý (+ 了)":"yuè lái yuè le","Càng ngày càng…, mức độ tăng dần theo thời gian. Không thêm 很, 更 vào sau 越来越.":"hěn gèng yuè lái yuè","了 chỉ sự thay đổi":"le","… + 了 (cuối câu)":"le","Cho biết đã có một trạng thái mới: 胖了 (béo ra), 冷了 (lạnh rồi), 不去了 (không đi nữa).":"pàng le lěng le bù qù le","要 / 快 / 快要 / 就要 + … + 了":"yào kuài kuài yào jiù yào le","Việc sắp xảy ra. Khi có thời gian cụ thể phía trước thì dùng 就要, không dùng 快要: 明天就要考试了.":"jiù yào kuài yào míng tiān jiù yào kǎo shì le","是不是":"shì bú shì","是不是 + …？":"shì bú shì","听说 đứng đầu câu: nghe nói. 怎么了？: có chuyện gì vậy? 不太好: không được tốt lắm.":"tīng shuō zěn me le bù tài hǎo","越来越热: càng ngày càng nóng. 好像: hình như. 有点儿感冒了: bị cảm nhẹ, 了 chỉ trạng thái mới.":"yuè lái yuè rè hǎo xiàng yǒu diǎn ér gǎn mào le le","刚买的: vừa mới mua (định ngữ). 跟…一起: cùng với. Đại từ cho con vật là 它 (tā).":"gāng mǎi de gēn yì qǐ tā","是不是: hỏi xác nhận điều đang đoán. 总是: cứ, luôn. \"Lạnh lạnh\" dịch thành 有点儿冷.":"shì bú shì zǒng shì yǒu diǎn ér lěng","是…的 nhấn mạnh thời gian đã mua. 快…了: sắp. 吃完: ăn hết (bổ ngữ kết quả).":"shì de kuài le chī wán","还是 ở đây nghĩa là \"vẫn là\", khác 还是 trong câu hỏi lựa chọn. 最喜欢的: cái thích nhất.":"hái shì hái shì zuì xǐ huān de","是不是 + 越来越…了. Chữ viết đẹp thường dùng 好看 hoặc 漂亮.":"shì bú shì yuè lái yuè le hǎo kàn piào liàng","要…了: sắp. 快 đầu câu là \"nhanh lên\", khác 快…了 (sắp).":"yào le kuài kuài le","这么 + tính từ: …thế này. 当然: tất nhiên. 会: sẽ (dự đoán).":"zhè me dāng rán huì","开药: kê thuốc (bác sĩ).   const prev=LESSONS.find(x=>x.no===no-1),next=LESSONS.find(x=>x.no===no+1);
  const pn=`<div class="pn">${prev?`<a href="#/bai/${prev.no}">← Bài ${prev.no}</a>`:"<span></span>"}${next?`<a href="#/bai/${next.no}">Bài ${next.no} →</a>`:"<span></span>"}</div>`;

  function gram(){return L.g.map(g=>`<div class="gp"><h3>${rb(g.t)}</h3><div class="formula">${rb(g.f)}</div><p>${rb(g.d)}</p>
    <div class="gex"><div class="z">${rb(g.ex[0])}${sp(g.ex[0])}</div><div class="y">${esc(g.ex[1])}</div><div class="v">${rb(g.ex[2])}</div></div></div>`).join("")}

  function sent(){const sub=S.subS;let ok=0,near=0;
    const items=L.s.map((s,i)=>{let res="",cls="";
      if(sub){const g=grade(S.ans[i],s[1]);cls=g.level;if(g.level==="ok")ok++;else if(g.level==="near")near++;
        const lb=g.blank?"Chưa làm":g.level==="ok"?"Khớp đáp án":g.level==="near"?"Gần đúng":"Chưa đúng";
        res=`<div class="res"><span class="badge ${g.level}">${lb}${g.blank?"":" "+g.pct+"%"}</span>
          ${(!g.blank&&g.level!=="ok")?`<div class="cmp">Bài của bạn (gạch ngang là chữ thừa hoặc sai):<div class="line">${g.ua}</div>Đáp án (tô đậm là chữ bạn còn thiếu):<div class="line">${g.ub}</div></div>`:""}
          <div class="answer"><div class="ans-zh">${rb(s[1])}${sp(s[1])}</div><div class="ans-py">${esc(s[2])}</div><div class="ans-note"><b>Ngữ pháp:</b> ${rb(s[3])}</div></div></div>`}
      return `<li class="item ${cls}"><div class="vs"><span class="n">${i+1}</span>${rb(s[0])}</div>
        <textarea data-i="${i}" rows="2" ${sub?"disabled":""} placeholder="Viết câu tiếng Trung của bạn vào đây…" aria-label="Dịch câu ${i+1}">${esc(S.ans[i]||"")}</textarea>${res}</li>`}).join("");
    const left=L.s.filter((_,i)=>!norm(S.ans[i]).length).length;
    const box=sub?`<div class="sbox"><h2>Kết quả dịch câu</h2><div class="score"><div><b>${ok}/${L.s.length}</b><span>khớp đáp án</span></div><div><b>${near}</b><span>gần đúng</span></div></div>
      <p class="muted">Máy chấm bằng cách so từng chữ với đáp án. Câu "gần đúng" hoặc "chưa đúng" có thể vẫn là một cách dịch hợp lệ.</p><button class="btn" id="redoS">Làm lại phần này</button></div>`
      :`<div class="sbox"><h2>Nộp bài dịch</h2><p class="${warned.s?"warn":"muted"}">${warned.s?`Còn ${left} câu chưa làm. Nộp rồi sẽ không sửa được.`:"Đáp án và giải thích chỉ hiện ra sau khi nộp."}</p><button class="btn primary" id="subS">${warned.s?"Vẫn nộp bài":"Nộp bài và xem đáp án"}</button></div>`;
    return `<ol class="items">${items}</ol>${box}`}

  function dist(){const D=L.dist,sub=S.subM;let ok=0;
    const w=`<div class="dw">${D.w.map(x=>`<div><div class="w">${rb(x[0])}${sp(x[0])}</div><div class="y pyw muted">${esc(x[1])}</div><div>${rb(x[2])}</div></div>`).join("")}</div>`;
    const qs=D.q.map((q,qi)=>{const pick=S.mc[qi];let fb="";
      if(sub){const good=pick===q.a;if(good)ok++;
        fb=`<div class="fb ${good?"ok":"no"}"><b>${good?"Chính xác.":pick===undefined?"Chưa làm. Đáp án là "+rb(q.o[q.a])+".":"Chưa đúng, đáp án là "+rb(q.o[q.a])+"."}</b> ${rb(q.why)}<div class="full">${rb(q.zh)}${sp(q.zh)}</div><div class="mc-py">${esc(q.py)}</div><div>${esc(q.vi)}</div></div>`}
      const opts=q.o.map((o,oi)=>{let c="";if(sub){if(oi===q.a)c="right";else if(pick===oi)c="wrong"}
        return `<button class="opt ${c}" data-q="${qi}" data-o="${oi}" aria-pressed="${!sub&&pick===oi}" ${sub?"disabled":""}>${rb(o)}</button>`}).join("");
      return `<div class="mc">${q.ctx?`<div class="mc-ctx">${rb(q.ctx)}</div>`:""}<div class="mc-q"><span class="n">${qi+1}.</span>${rb(q.q).replace(/___/g,'<span class="blank"></span>')}</div><div class="opts">${opts}</div>${fb}</div>`}).join("");
    const left=D.q.length-Object.keys(S.mc).length;
    const box=sub?`<div class="sbox"><h2>Kết quả</h2><div class="score"><div><b>${ok}/${D.q.length}</b><span>câu đúng</span></div></div><button class="btn" id="redoM">Làm lại phần này</button></div>`
      :`<div class="sbox"><p class="${warned.m?"warn":"muted"}">${warned.m?`Còn ${left} câu chưa chọn. Nộp rồi sẽ không sửa được.`:"Chọn đáp án cho từng câu rồi nộp để xem giải thích."}</p><button class="btn primary" id="subM">${warned.m?"Vẫn nộp bài":"Nộp bài"}</button></div>`;
    return `<h2>${rb(D.pair)}</h2>${w}${qs}${box}`}

  function test(){
    const sub=S2.sub,sc={fc:0,fi:0,rd:0,od:0};
    const st=(p,i,a)=>sub?(i===a?"right":p===i?"wrong":""):"";
    const ob=(at,lab,p,i,a)=>`<button class="topt ${st(p,i,a)}" ${at} aria-pressed="${!sub&&p===i}" ${sub?"disabled":""}>${lab}</button>`;
    const vd=(ok,p)=>ok?"Chính xác.":p===undefined?"Chưa làm.":"Chưa đúng.";
    const cards=FC.map((f,i)=>{const p=S2.fc[i],ok=p===f.a;if(sub&&ok)sc.fc++;const fl=sub&&S2.flip[i];
      const face=fl?`<div class="face back"><div class="hz sm">${rb(f.c[0])}${sp(f.c[3])}</div><div class="bpy">${esc(f.c[1])}</div><div class="bvi">${esc(f.c[2])}</div><div class="bex">${rb(f.c[3])}</div><div class="bexv">${esc(f.c[4])}</div></div>`
        :`<div class="face"><span class="n">${i+1}</span><div class="hz">${rb(f.c[0])}${sp(f.c[0])}</div></div>`;
      const opts=fl?"":`<div class="copts">${f.opts.map((o,oi)=>ob(`data-t="fc" data-q="${i}" data-o="${oi}"`,esc(o),p,oi,f.a)).join("")}</div>`;
      return `<div class="card ${sub?(ok?"ok":"bad"):""}">${face}${opts}${sub?`<button class="btn flip" data-flip="${i}">${fl?"Lật lại":"Lật thẻ"}</button>`:""}</div>`}).join("");
    let qn=0;
    const fills=T.fill.map((g,gi)=>{const bank=`<div class="bank">${g.bank.map((w,wi)=>`<span><b>${LT[wi]}</b>${rb(w)}</span>`).join("")}</div>`;
      const qs=g.q.map((q,qi)=>{const k=gi+"_"+qi,p=S2.fi[k],ok=p===q[1];if(sub&&ok)sc.fi++;qn++;const full=q[0].replace("___",g.bank[q[1]]);
        const fb=sub?`<div class="fb ${ok?"ok":"no"}"><b>${vd(ok,p)}</b> Đáp án: <b>${LT[q[1]]} ${rb(g.bank[q[1]])}</b><div class="full">${rb(full)}${sp(full)}</div><div>${esc(q[2])}</div></div>`:"";
        return `<div class="mc"><div class="mc-q"><span class="n">${qn}.</span>${rb(q[0]).replace("___",'<span class="blank"></span>')}</div><div class="opts">${g.bank.map((w,wi)=>ob(`data-t="fi" data-q="${k}" data-o="${wi}"`,`<b class="lt">${LT[wi]}</b>${rb(w)}`,p,wi,q[1])).join("")}</div>${fb}</div>`}).join("");
      return bank+qs}).join("");
    let rn=0;
    const reads=T.read.map((p,pi)=>{
      const qs=p.q.map((q,qi)=>{const k=pi+"_"+qi,pk=S2.rd[k],ok=pk===q[2];if(sub&&ok)sc.rd++;rn++;
        const fb=sub?`<div class="fb ${ok?"ok":"no"}"><b>${vd(ok,pk)}</b> Đáp án: <b>${LT[q[2]]}. ${rb(q[1][q[2]])}</b></div>`:"";
        return `<div class="mc"><div class="mc-q"><span class="n">${rn}.</span>${rb(q[0])}</div><div class="opts">${q[1].map((o,oi)=>ob(`data-t="rd" data-q="${k}" data-o="${oi}"`,`<b class="lt">${LT[oi]}</b>${rb(o)}`,pk,oi,q[2])).join("")}</div>${fb}</div>`}).join("");
      return `<div class="passage"><div class="pt">Đoạn ${pi+1}</div><div class="pz">${rb(p.p)}${sub?sp(p.p):""}</div></div>${sub?`<div class="pvi"><b>Dịch:</b> ${rb(p.vi)}</div>`:""}${qs}`}).join("");
    const ords=OD.map((o,i)=>{const pk=S2.od[i]||[],ok=odOk(i);if(sub&&ok)sc.od++;
      const pb=id=>`<button class="pc" data-od="${i}" data-id="${id}" ${sub?"disabled":""}>${rbCtx(o.pool[id].t,o.disp,o.pool[id].s)}</button>`;
      const fb=sub?`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Chính xác.":pk.length?"Chưa đúng.":"Chưa làm."}</b><div class="full">${rb(o.disp)}${sp(o.disp)}</div>${o.alt.length?`<div>Cũng đúng: <span class="zhf">${o.alt.map(rb).join("；")}</span></div>`:""}<div>${esc(o.vi)}</div></div>`:"";
      return `<div class="mc"><div class="mc-q"><span class="n">${i+1}.</span><span style="font-family:var(--vi);font-weight:500;font-size:16px">Sắp xếp thành câu hoàn chỉnh</span></div><div class="ansline ${sub?(ok?"right":"wrong"):""}">${pk.map(pb).join("")}</div><div class="pool">${o.pool.filter(c=>!pk.includes(c.id)).map(c=>pb(c.id)).join("")}</div>${fb}</div>`}).join("");
    const tot=sc.fc+sc.fi+sc.rd+sc.od,left=TOTAL-filledT();
    const box=sub?`<div class="sbox" id="tres"><h2>Kết quả bài 50 câu</h2><div class="score"><div><b>${tot}/${TOTAL}</b><span>tổng số câu đúng (thang 10: ${(tot/TOTAL*10).toFixed(1)})</span></div><div><b>${sc.fc}/${FC.length}</b><span>thẻ từ</span></div><div><b>${sc.fi}/${nFI}</b><span>điền từ</span></div><div><b>${sc.rd}/${nRD}</b><span>đọc hiểu</span></div><div><b>${sc.od}/${OD.length}</b><span>sắp xếp câu</span></div></div><p class="muted">Bấm "Lật thẻ" ở phần thẻ từ để xem lại phiên âm và câu ví dụ.</p><button class="btn" id="redoT">Làm lại bài 50 câu</button></div>`
      :`<div class="sbox" id="tres"><h2>Nộp bài 50 câu</h2><p id="tinfo" class="${warned.t?"warn":"muted"}">${warned.t?`Còn ${left} câu chưa làm. Nộp rồi sẽ không sửa được.`:`Đã làm ${filledT()}/${TOTAL} câu. Phần này chấm riêng với các tab khác.`}</p><button class="btn primary" id="subT">${warned.t?"Vẫn nộp bài":"Nộp bài 50 câu"}</button></div>`;
    const sec=(n,t,z,h)=>`<h2 class="sh">Phần ${n} – ${t} <span class="zhs">${rb(z)}</span></h2><p class="hint">${h}</p>`;
    return `<p class="muted" style="margin-top:0">Gồm 4 phần, tổng ${TOTAL} câu. Bài được lưu tự động, đáp án hiện ra sau khi nộp.</p>
      ${sec(1,`Thẻ từ (${FC.length} câu)`,"词语卡片","Nhìn chữ Hán, chọn nghĩa đúng. Sau khi nộp có thể lật thẻ để xem phiên âm và câu ví dụ.")}<div class="cards">${cards}</div>
      ${sec(2,`Điền từ (${nFI} câu)`,"选词填空","Chọn từ trong khung để điền vào chỗ trống. Mỗi nhóm có 6 từ cho 5 câu, một từ không dùng đến.")}${fills}
      ${sec(3,`Đọc hiểu (${nRD} câu)`,"阅读理解","Đọc đoạn văn rồi chọn đáp án đúng.")}${reads}
      ${sec(4,`Sắp xếp câu (${OD.length} câu)`,"连词成句","Bấm các mảnh theo đúng thứ tự để ghép thành câu. Bấm vào mảnh ở dòng trả lời để gỡ ra.")}${ords}
      ${box}`}
  function newWords(){const done=T.fc.filter((_,i)=>LRN3[no+"_"+i]).length;
    return `<div class="tools"><span class="muted" id="cnt">${T.fc.length} từ mới · đã thuộc ${done}/${T.fc.length}</span></div><div class="nwlist">${T.fc.map((c,i)=>{const k=no+"_"+i,got=!!LRN3[k];
      return `<div class="nw ${got?"got":""}"><div><div class="nwh"><span class="n">${i+1}</span>${rb(c[0])}${sp(c[0])}</div><div class="y">${esc(c[1])}</div></div><div><div class="bvi">${esc(c[2])}</div><div class="bex">${rb(c[3])}${sp(c[3])}</div><div class="bexv">${esc(c[4])}</div></div><button class="btn ${got?"on":""}" data-got3="${k}">${got?"Đã thuộc ✓":"Đã thuộc?"}</button></div>`}).join("")}</div>`}
  const updT=()=>{const p=$("#tinfo");if(p&&!S2.sub){warned.t=false;p.className="muted";p.textContent=`Đã làm ${filledT()}/${TOTAL} câu. Phần này chấm riêng với các tab khác.`;const b=$("#subT");if(b)b.textContent="Nộp bài 50 câu"}};

  function draw(keepScroll){
    app.innerHTML=head+(tab==="n"?newWords():tab==="g"?gram():tab==="s"?sent():tab==="d"?dist():test())+pn;
    app.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
    document.title=`Bài ${L.no} – ${L.zhT} · HSK 3`;
    if(!keepScroll)window.scrollTo(0,0);
    app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
    app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
    app.querySelectorAll("[data-got3]").forEach(b=>b.onclick=()=>{const k=b.dataset.got3;if(LRN3[k])delete LRN3[k];else LRN3[k]=1;store("hsk3_learned",LRN3);draw(true)});
    app.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{S.ans[t.dataset.i]=t.value;store(KEY(no),S)});
    app.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{S.mc[b.dataset.q]=+b.dataset.o;store(KEY(no),S);
      b.parentNode.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",o===b))});
    const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
    on("#subS",()=>{const left=L.s.filter((_,i)=>!norm(S.ans[i]).length).length;if(left&&!warned.s){warned.s=true;draw(true);return}S.subS=true;store(KEY(no),S);draw()});
    on("#subM",()=>{const left=L.dist.q.length-Object.keys(S.mc).length;if(left&&!warned.m){warned.m=true;draw(true);return}S.subM=true;store(KEY(no),S);draw()});
    on("#redoS",()=>{S.subS=false;S.ans={};store(KEY(no),S);warned.s=false;draw()});
    on("#redoM",()=>{S.subM=false;S.mc={};store(KEY(no),S);warned.m=false;draw()});
    app.querySelectorAll(".topt:not([disabled])").forEach(b=>b.onclick=()=>{const bag=S2[b.dataset.t],q=b.dataset.q,o=+b.dataset.o;if(bag[q]===o)delete bag[q];else bag[q]=o;store(KT,S2);
      b.parentNode.querySelectorAll(".topt").forEach(x=>x.setAttribute("aria-pressed",bag[q]===+x.dataset.o));updT()});
    app.querySelectorAll("[data-od]:not([disabled])").forEach(b=>b.onclick=()=>{const i=b.dataset.od,id=+b.dataset.id,a=(S2.od[i]=S2.od[i]||[]),k=a.indexOf(id);if(k>=0)a.splice(k,1);else a.push(id);store(KT,S2);warned.t=false;draw(true)});
    app.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{const i=b.dataset.flip;S2.flip[i]=!S2.flip[i];store(KT,S2);draw(true)});
    on("#subT",()=>{if(filledT()<TOTAL&&!warned.t){warned.t=true;draw(true);$("#tres").scrollIntoView({block:"center"});return}S2.sub=true;store(KT,S2);draw(true);$("#tres").scrollIntoView({block:"start"})});
    on("#redoT",()=>{S2.sub=false;S2.fc={};S2.fi={};S2.rd={};S2.od={};S2.flip={};store(KT,S2);warned.t=false;draw()});
  }
  draw()}

function route(){const m=location.hash.match(/^#\/bai\/(\d+)/);m?lesson(+m[1]):home()}
addEventListener("hashchange",route);route();
})();
</script>
</body>
</html>
