<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3 – Học tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --snow:#F4F6F9;--paper:#FFFFFF;--ink:#1E2533;--muted:#5E6778;--line:#DCE2EA;
  --crimson:#A11D35;--crimson-soft:#F7E8EB;--pine:#2E6B57;--pine-soft:#E4F1EB;--amber:#8E5A06;--amber-soft:#FBF1DD;--formula:#EEF2F7;
  --vi:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --zh:"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --snow:#161A22;--paper:#1F2430;--ink:#E7EAF0;--muted:#A3AABA;--line:#343B4A;--crimson:#E0566E;--crimson-soft:#3A2129;--pine:#6CC3A2;--pine-soft:#1D3530;--amber:#E3AE52;--amber-soft:#3A2F1B;--formula:#283040}}
:root[data-theme="dark"]{--snow:#161A22;--paper:#1F2430;--ink:#E7EAF0;--muted:#A3AABA;--line:#343B4A;--crimson:#E0566E;--crimson-soft:#3A2129;--pine:#6CC3A2;--pine-soft:#1D3530;--amber:#E3AE52;--amber-soft:#3A2F1B;--formula:#283040}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--snow);color:var(--ink);font-family:var(--vi);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--crimson);outline-offset:2px;border-radius:4px}
a{color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px clamp(16px,4vw,40px);display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.seal{flex:none;width:38px;height:38px;background:var(--crimson);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--zh);font-weight:700;font-size:18px;box-shadow:inset 0 0 0 3px var(--crimson),inset 0 0 0 4px rgba(255,255,255,.55)}
.brand b{font-size:16px;line-height:1.2;display:block}.brand small{color:var(--muted);font-size:12px}
.tog{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.tog[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
main{max-width:880px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 100px}
h1{font-family:var(--zh);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.2;margin:4px 0 2px;letter-spacing:1px}
h2{font-size:20px;margin:0 0 10px}
.muted{color:var(--muted)}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0 26px}.sum div b{display:block;font-size:26px;line-height:1.1}.sum div span{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none}
.row:hover{background:var(--formula)}
.num{flex:none;width:34px;text-align:center;font-weight:600;color:var(--crimson)}
.rt{flex:1;min-width:0}.rt .z{font-family:var(--zh);font-weight:600;font-size:18px}.rt .v{font-size:14px;color:var(--muted)}
.chip{flex:none;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--formula);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--pine-soft);color:var(--pine)}.chip.part{background:var(--amber-soft);color:var(--amber)}
.crumb{font-size:14px;margin-bottom:6px}.crumb a{color:var(--crimson);text-decoration:none}
.head .py{margin:0;color:var(--muted)}.head .vt{margin:6px 0 0;font-size:17px}
.tabs{display:flex;gap:4px;margin:24px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--crimson);border-bottom-color:var(--crimson);font-weight:600}
.gp{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--crimson);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.gp h3{margin:0 0 8px;font-size:17px}
.formula{display:inline-block;background:var(--formula);border-radius:6px;padding:4px 10px;font-family:var(--zh);font-size:16px;margin-bottom:8px}
.gp p{margin:0 0 10px}
.gex{background:var(--snow);border-radius:6px;padding:10px 12px}
.z,.ans-zh{font-family:var(--zh);font-size:19px;font-weight:600}
.y,.ans-py,.mc-py{color:var(--muted);font-size:14px}.v{font-size:15px}
.speak{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:32px;height:32px;margin-left:8px;vertical-align:middle;font-size:14px;line-height:1}
.hide-py .y,.hide-py .bpy,.hide-py .ans-py,.hide-py .mc-py,.hide-py .pyw{display:none}
ol.items{list-style:none;margin:0;padding:0}
.item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.item.ok{border-color:var(--pine)}.item.near{border-color:var(--amber)}.item.no{border-color:var(--crimson)}
.vs{font-weight:500;margin-bottom:8px}.vs .n{color:var(--crimson);font-weight:600;margin-right:8px}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--snow);padding:10px 12px;font-family:var(--zh);font-size:18px;resize:vertical}
textarea:disabled{opacity:.8}
.res{margin-top:10px;font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:13px}
.badge.ok{background:var(--pine-soft);color:var(--pine)}.badge.near{background:var(--amber-soft);color:var(--amber)}.badge.no{background:var(--crimson-soft);color:var(--crimson)}
.cmp{margin:8px 0}.cmp .line{font-family:var(--zh);font-size:18px;margin:2px 0 8px}
.x{text-decoration:line-through;color:var(--crimson)}.m{font-weight:700;background:var(--pine-soft);color:var(--pine)}
.answer{margin-top:8px;padding:10px 12px;background:var(--snow);border-radius:6px}.ans-note{font-size:14px;margin-top:4px}
.dw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
@media (max-width:560px){.dw{grid-template-columns:1fr}}
.dw div{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--pine);border-radius:8px;padding:12px 14px}
.dw .w{font-family:var(--zh);font-size:22px;font-weight:700}
.mc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.mc-ctx{font-size:14px;color:var(--muted);margin-bottom:4px}
.mc-q{font-family:var(--zh);font-size:19px;font-weight:600;margin-bottom:10px}.mc-q .n{color:var(--crimson);margin-right:8px;font-family:var(--vi);font-size:16px}
.blank{display:inline-block;width:56px;border-bottom:2px solid var(--ink);margin:0 4px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--snow);border-radius:8px;padding:8px 18px;font-family:var(--zh);font-size:18px}
.opt[aria-pressed="true"]{border-color:var(--crimson);background:var(--crimson-soft)}
.opt.right{border-color:var(--pine);background:var(--pine-soft)}.opt.wrong{border-color:var(--crimson);background:var(--crimson-soft)}
.fb{margin-top:10px;font-size:14px;border-radius:6px;padding:10px 12px}.fb.ok{background:var(--pine-soft)}.fb.no{background:var(--crimson-soft)}
.fb .full{font-family:var(--zh);font-size:18px;font-weight:600;margin-top:6px}
.sbox{margin-top:26px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.score{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0}.score b{display:block;font-size:26px;line-height:1.1}.score span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 18px;font-weight:600}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
.warn{color:var(--crimson)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.pn a{text-decoration:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:500}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.sh{margin:34px 0 6px}.sh .zhs{font-family:var(--zh);color:var(--muted);font-weight:400;font-size:15px;margin-left:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.ok{border-color:var(--pine)}.card.bad{border-color:var(--crimson)}
.face{text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center;position:relative}
.face .n{position:absolute;left:0;top:0;font-size:13px;color:var(--muted)}
.hz{font-family:var(--zh);font-weight:700;font-size:38px;line-height:1.2}.hz.sm{font-size:28px}
.back .bpy{color:var(--muted)}.back .bvi{font-weight:600;color:var(--crimson)}.back .bex{font-family:var(--zh);font-size:16px;margin-top:6px}.back .bexv{font-size:13px;color:var(--muted)}
.copts{display:grid;gap:6px}
.topt{border:1px solid var(--line);background:var(--snow);border-radius:8px;padding:8px 12px;text-align:left}
.copts .topt{font-size:14px}.opts .topt{font-family:var(--zh);font-size:18px}
.topt[aria-pressed="true"]{border-color:var(--crimson);background:var(--crimson-soft)}
.topt.right{border-color:var(--pine);background:var(--pine-soft)}.topt.wrong{border-color:var(--crimson);background:var(--crimson-soft)}
.lt{font-family:var(--vi);font-size:12px;color:var(--muted);margin-right:6px}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 12px;padding:10px 12px;background:var(--amber-soft);border-radius:8px;font-family:var(--zh);font-size:18px}.bank b{font-family:var(--vi);font-size:12px;color:var(--amber);margin-right:4px}
.passage{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--pine);border-radius:8px;padding:14px 16px;margin:18px 0 10px}
.passage .pt{font-size:12px;font-weight:600;color:var(--pine);text-transform:uppercase;letter-spacing:.5px}.passage .pz{font-family:var(--zh);font-size:19px;line-height:1.9}
.pvi{margin-bottom:14px;padding:10px 12px;background:var(--pine-soft);border-radius:6px;font-size:14px}
.ansline{min-height:52px;border:1.5px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ansline.right{border-color:var(--pine);border-style:solid}.ansline.wrong{border-color:var(--crimson);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pc{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-family:var(--zh);font-size:18px}
.ansline .pc{background:var(--crimson-soft);border-color:var(--crimson)}
.zhf{font-family:var(--zh)}
ruby{ruby-position:over;ruby-align:center}
rt{font-family:var(--vi);font-weight:400;font-size:max(10px,.48em);color:var(--muted);letter-spacing:0;line-height:1.1;font-style:normal}
.hide-py rt{display:none}
.nwlist{display:grid;gap:12px}
.nw{display:grid;grid-template-columns:minmax(130px,180px) 1fr auto;gap:8px 18px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.nw.got{border-color:var(--pine);background:var(--pine-soft)}
.nwh{font-family:var(--zh);font-weight:700;font-size:30px;line-height:1.6}
.nwh .n{font-family:var(--vi);font-size:12px;color:var(--muted);font-weight:400;margin-right:6px;vertical-align:top}
.nw .bvi{font-weight:600;color:var(--crimson)}
.nw .bex{font-family:var(--zh);font-size:17px;margin-top:6px;line-height:1.9}
.nw .bhv{font-size:13px;color:var(--amber);font-weight:500}
.nw .bexv{font-size:13px;color:var(--muted)}
.nw .btn{padding:7px 12px;font-size:13px;white-space:nowrap}.nw .btn.on{background:var(--pine);border-color:var(--pine);color:#fff}
@media (max-width:640px){.nw{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.tab,.opt,.row{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#/"><span class="seal">汉</span><span><b>HSK 3</b><small>Học tiếng Trung · 20 bài</small></span></a>
  <a class="tog" href="./">Các cấp độ</a>
  <button class="tog" id="togPy" aria-pressed="false">Ẩn pinyin</button>
</div></header>
<main id="app"></main>
<script>
const LESSONS = [{"no": 1, "zhT": "周末你有什么打算", "pyT": "Zhōumò nǐ yǒu shénme dǎsuàn", "viT": "Anh dự định làm gì vào cuối tuần?", "g": [{"t": "Bổ ngữ kết quả 好 và 完", "f": "Động từ + 好 / 完 (+ 了)", "d": "完 cho biết việc đã làm xong. 好 cũng là xong, nhưng nhấn vào chỗ việc đã làm xong xuôi, ổn thỏa, sẵn sàng. Phủ định dùng 没: 没想好, 没看完.", "ex": ["你准备好了吗？", "Nǐ zhǔnbèi hǎo le ma?", "Bạn chuẩn bị xong chưa?"]}, {"t": "Không… chút nào", "f": "一点儿 + 也 / 都 + 不 / 没 + …", "d": "Phủ định tuyệt đối, mạnh hơn hẳn 不 đơn thuần.", "ex": ["这个菜一点儿也不辣。", "Zhège cài yìdiǎnr yě bú là.", "Món này không cay chút nào."]}, {"t": "还是 khi lựa chọn", "f": "A 还是 B", "d": "Dùng trong câu hỏi lựa chọn, và cả sau 不知道 / 没决定 / 没想好… khi người nói còn đang phân vân giữa hai phương án.", "ex": ["你喝茶还是喝咖啡？", "Nǐ hē chá háishi hē kāfēi?", "Bạn uống trà hay cà phê?"]}, {"t": "Đại từ nghi vấn + 都 / 也", "f": "什么 / 哪儿 / 谁 + 都 / 也 + …", "d": "Mang nghĩa \"bất cứ… nào cũng\", \"cái gì cũng\".", "ex": ["他什么都会做。", "Tā shénme dōu huì zuò.", "Cái gì anh ấy cũng biết làm."]}], "s": [["Tôi nghĩ xong từ lâu rồi, cuối tuần tôi sẽ mời bạn gái đi ăn tối.", "我早就想好了，周末我要请女朋友吃晚饭。", "Wǒ zǎo jiù xiǎng hǎo le, zhōumò wǒ yào qǐng nǚpéngyou chī wǎnfàn.", "想好: bổ ngữ kết quả 好, nghĩ xong và đã có quyết định. 早就…了: từ lâu đã. 请 + người + động từ: mời ai làm gì."], ["Tôi đã đọc xong cuốn tiểu thuyết bạn tặng trước đây rồi.", "你以前送我的那本小说，我已经看完了。", "Nǐ yǐqián sòng wǒ de nà běn xiǎoshuō, wǒ yǐjīng kàn wán le.", "看完: bổ ngữ kết quả 完. Tân ngữ dài (cuốn tiểu thuyết bạn tặng) được đưa lên đầu câu làm chủ đề cho gọn. 以前送我的 là định ngữ, nối bằng 的."], ["Mẹ tôi rất thích xem phim tình cảm, ngày nào cũng xem.", "我妈妈很喜欢看爱情电影，每天都看。", "Wǒ māma hěn xǐhuan kàn àiqíng diànyǐng, měi tiān dōu kàn.", "每 thường đi với 都: 每天都…, 每次都…"], ["Tôi vẫn chưa quyết định cuối tuần nên đi Bắc Kinh hay Thượng Hải du lịch.", "我还没决定周末去北京还是去上海旅游。", "Wǒ hái méi juédìng zhōumò qù Běijīng háishi qù Shànghǎi lǚyóu.", "\"Hay\" ở đây là lựa chọn chưa quyết, nên dùng 还是, không dùng 或者. 还没 + động từ: vẫn chưa."], ["Hôm nay đi chơi với bạn bè rất vui, tôi không thấy mệt chút nào.", "今天跟朋友一起去玩儿，特别开心，我一点儿也不累。", "Jīntiān gēn péngyou yìqǐ qù wánr, tèbié kāixīn, wǒ yìdiǎnr yě bú lèi.", "一点儿也不 + tính từ: không… chút nào. 跟…一起: cùng với ai."], ["Tôi cảm thấy trời không lạnh lắm, tôi muốn ăn một quả táo.", "我觉得天气不太冷，我想吃一个苹果。", "Wǒ juéde tiānqì bú tài lěng, wǒ xiǎng chī yí ge píngguǒ.", "不太 + tính từ: không… lắm (nhẹ hơn 不). 觉得: cảm thấy, cho rằng."], ["Đồ đạc của bạn đã chuẩn bị xong chưa?", "你的东西准备好了吗？", "Nǐ de dōngxi zhǔnbèi hǎo le ma?", "准备好: chuẩn bị xong, sẵn sàng (bổ ngữ kết quả 好). Hỏi \"xong chưa\" dùng …了吗？ hoặc …了没有？"], ["Áo sơ mi, váy, quần… cái gì cũng có rồi, không thiếu gì cả.", "衬衫、裙子、裤子……什么都有了，什么也不缺。", "Chènshān, qúnzi, kùzi…… shénme dōu yǒu le, shénme yě bù quē.", "什么都 / 什么也: cái gì cũng. Liệt kê các danh từ ngang hàng dùng dấu 、 chứ không dùng dấu phẩy."], ["Cái váy này thì hơi đắt, cái kia rẻ hơn một chút, không đắt cũng không rẻ.", "这条裙子有点儿贵，那条便宜一点儿，不贵也不便宜。", "Zhè tiáo qúnzi yǒudiǎnr guì, nà tiáo piányi yìdiǎnr, bú guì yě bù piányi.", "有点儿 đứng TRƯỚC tính từ (hơi… , thường là chê). 一点儿 đứng SAU tính từ (…hơn một chút, so sánh). 不A也不B: không A cũng không B. Lượng từ của váy, quần là 条."], ["Tôi vẫn chưa mua vé tàu nữa, bạn có biết chỗ nào bán vé không?", "我还没买火车票呢，你知道哪儿卖票吗？", "Wǒ hái méi mǎi huǒchēpiào ne, nǐ zhīdào nǎr mài piào ma?", "还没…呢: vẫn chưa… (呢 cuối câu làm câu mềm hơn). Câu phủ định với 没 không có 了."]], "dist": {"pair": "还是 và 或者", "w": [["还是", "háishi", "Dùng trong câu hỏi lựa chọn, hoặc sau 不知道 / 没想好 / 没决定… (vẫn đang phân vân)."], ["或者", "huòzhě", "Dùng trong câu kể: A hoặc B đều được, không hỏi ai phải chọn."]], "q": [{"q": "你喝茶___喝咖啡？", "o": ["还是", "或者"], "a": 0, "zh": "你喝茶还是喝咖啡？", "py": "Nǐ hē chá háishi hē kāfēi?", "vi": "Bạn uống trà hay uống cà phê?", "why": "Đây là câu hỏi bắt người nghe chọn một trong hai, nên dùng 还是."}, {"q": "周末我常常看书___看电影。", "o": ["还是", "或者"], "a": 1, "zh": "周末我常常看书或者看电影。", "py": "Zhōumò wǒ chángcháng kàn shū huòzhě kàn diànyǐng.", "vi": "Cuối tuần tôi thường đọc sách hoặc xem phim.", "why": "Câu kể bình thường, không hỏi ai chọn gì, nên dùng 或者."}, {"q": "我还没想好坐火车去___坐飞机去。", "o": ["还是", "或者"], "a": 0, "zh": "我还没想好坐火车去还是坐飞机去。", "py": "Wǒ hái méi xiǎng hǎo zuò huǒchē qù háishi zuò fēijī qù.", "vi": "Tôi vẫn chưa nghĩ xong nên đi tàu hay đi máy bay.", "why": "Không có dấu hỏi nhưng vẫn là lựa chọn chưa quyết (sau 还没想好), nên dùng 还是."}, {"q": "你明天___后天来都可以。", "o": ["还是", "或者"], "a": 1, "zh": "你明天或者后天来都可以。", "py": "Nǐ míngtiān huòzhě hòutiān lái dōu kěyǐ.", "vi": "Bạn đến ngày mai hoặc ngày kia đều được.", "why": "Nêu các khả năng đều chấp nhận được, nên dùng 或者."}]}}, {"no": 2, "zhT": "他什么时候回来", "pyT": "Tā shénme shíhou huílai", "viT": "Khi nào anh ấy về?", "g": [{"t": "Hai hành động xảy ra liên tiếp", "f": "V1 + (bổ ngữ kết quả / xu hướng) + 了 + (tân ngữ) + 就 + V2", "d": "V1 xong là làm V2 ngay. 了 ở đây chỉ V1 đã hoàn thành trước V2, nên dùng được cho cả việc sắp làm, không chỉ chuyện đã qua. Nếu V1 có bổ ngữ thì 了 đứng SAU bổ ngữ: 买完了水果就…, 走进了教室就…, 回到了宿舍就… Động từ ly hợp thì 了 chen vào giữa: 下了课, 游了泳.", "ex": ["我下了课就去找你。", "Wǒ xià le kè jiù qù zhǎo nǐ.", "Tan học là tôi đi tìm bạn ngay."]}, {"t": "Bổ ngữ xu hướng đơn 来 / 去", "f": "Động từ + 来 / 去", "d": "来: hành động hướng VỀ PHÍA người nói. 去: hành động RỜI XA người nói. Muốn chọn đúng, trước hết phải xác định người nói đang đứng ở đâu.", "ex": ["小明，你下来吧！", "Xiǎo Míng, nǐ xiàlai ba!", "Tiểu Minh ơi, xuống đây đi! (người nói ở dưới)"]}, {"t": "Tân ngữ nơi chốn đứng giữa", "f": "Động từ + nơi chốn + 来 / 去", "d": "Khi có tân ngữ chỉ nơi chốn, nó phải đứng GIỮA động từ và 来 / 去. Không nói 进来教室, mà nói 进教室来.", "ex": ["他回家去了。", "Tā huí jiā qu le.", "Anh ấy về nhà rồi."]}, {"t": "Câu liên động chỉ mục đích", "f": "去 / 来 / 回 + nơi chốn + động từ", "d": "Đi đâu để làm gì: động từ chỉ việc di chuyển đứng trước, việc cần làm đứng sau.", "ex": ["我去超市买东西。", "Wǒ qù chāoshì mǎi dōngxi.", "Tôi đi siêu thị mua đồ."]}, {"t": "Nói gọn: 先……再……", "f": "先 + V1，再 + V2", "d": "Làm V1 trước rồi mới làm V2, chỉ nói thứ tự, không nhấn mạnh là \"ngay\". Dùng cho việc chưa xảy ra.", "ex": ["我们先吃饭，再去看电影。", "Wǒmen xiān chī fàn, zài qù kàn diànyǐng.", "Chúng ta ăn cơm trước rồi đi xem phim."]}], "s": [["Em qua nhà chị Hoa lấy laptop.", "我去华姐家拿笔记本电脑。", "Wǒ qù Huá jiě jiā ná bǐjìběn diànnǎo.", "Câu liên động: 去 + nơi chốn + động từ (đi đâu để làm gì). Tên Hoa viết là 华; 姐 đứng sau tên: 华姐."], ["Chúng ta qua nhà anh Minh ăn cơm đi.", "我们去明哥家吃饭吧。", "Wǒmen qù Míng gē jiā chī fàn ba.", "去 + nơi chốn + động từ. Người nói không ở nhà anh Minh nên dùng 去. 吧 cuối câu: đề nghị."], ["Alo! Bạn đến nhà tôi ăn cơm nhé.", "喂！你来我家吃饭吧。", "Wèi! Nǐ lái wǒ jiā chī fàn ba.", "Người nói đang ở nhà mình, người nghe đi về phía người nói nên dùng 来. Nhấc máy điện thoại nói 喂 (wèi)."], ["Con ra ngoài mua hoa quả với mẹ nha.", "你跟妈妈出去买水果吧。", "Nǐ gēn māma chūqu mǎi shuǐguǒ ba.", "Người nói đang ở trong nhà, ra ngoài là rời xa chỗ đang đứng nên dùng 出去. 跟 + người: cùng với ai."], ["Minh ơi, xuống đây đi đá bóng với bọn tớ.", "小明，你下来跟我们一起去踢足球吧！", "Xiǎo Míng, nǐ xiàlai gēn wǒmen yìqǐ qù tī zúqiú ba!", "Người nói đang ở dưới, Minh đi xuống về phía người nói nên dùng 下来. Đá bóng là 踢足球."], ["Các em học sinh vào lớp học đi. (cô giáo đang ở trong lớp)", "同学们，进教室来吧！", "Tóngxuémen, jìn jiàoshì lai ba!", "Cô giáo ở trong lớp nên dùng 来. Tân ngữ nơi chốn 教室 đứng giữa 进 và 来, không nói 进来教室."], ["Bạn vào quán cà phê trước đi, tôi đi mua hoa quả xong rồi tôi vào.", "你先进咖啡馆去吧，我买完了水果就进去。", "Nǐ xiān jìn kāfēiguǎn qu ba, wǒ mǎi wán le shuǐguǒ jiù jìnqu.", "V + BNKQ + 了 + O + 就 + V: 买完了水果就进去 (mua xong là vào ngay). Việc chưa xảy ra vẫn dùng 了 vì nó chỉ \"xong V1\". Người nói đứng ngoài quán nên dùng 进去."], ["Sếp Vương chiều nay đi Thượng Hải, 2 hôm nữa mới về.", "王经理今天下午去上海，两天以后才回来。", "Wáng jīnglǐ jīntiān xiàwǔ qù Shànghǎi, liǎng tiān yǐhòu cái huílai.", "才: \"mới\", cho thấy thời gian lâu hơn mong muốn. 回来: về lại chỗ người nói. Sếp thường gọi là 经理."], ["Tôi lên phòng 201 học môn Tiếng Anh.", "我上二零一教室去上英语课。", "Wǒ shàng èr líng yāo jiàoshì qu shàng Yīngyǔ kè.", "上 + nơi chốn + 去: đi lên chỗ nào đó. Số phòng đọc từng chữ số, số 1 thường đọc là yāo. 上课: học, lên lớp."], ["Sao trời hôm nay đẹp thế, chiều đi bơi rồi đi ăn KFC.", "今天天气怎么这么好！下午我们游了泳就去吃肯德基吧。", "Jīntiān tiānqì zěnme zhème hǎo! Xiàwǔ wǒmen yóu le yǒng jiù qù chī Kěndéjī ba.", "V1了 + 就 + V2. 游泳 là động từ ly hợp nên 了 chen vào giữa: 游了泳. 怎么这么 + tính từ: sao… thế. KFC là 肯德基."], ["Ngày nào cũng bận công việc, có thể có ny sao?", "每天都忙工作，怎么可能有女朋友呢？", "Měi tiān dōu máng gōngzuò, zěnme kěnéng yǒu nǚpéngyou ne?", "怎么可能…呢？: sao mà… được (câu hỏi tu từ, ý là không thể). Người yêu là nam thì đổi thành 男朋友."], ["Buổi tối tôi về KTX rồi xem phim.", "晚上我回到了宿舍就看电影。", "Wǎnshang wǒ huí dào le sùshè jiù kàn diànyǐng.", "V + BNKQ 到 + 了 + nơi chốn + 就 + V: 回到了宿舍就看电影 (về đến KTX là xem phim). Ký túc xá là 宿舍."], ["Cô giáo hôm nay vào lớp rồi thu bài về nhà của chúng tôi.", "今天老师走进了教室就收了我们的作业。", "Jīntiān lǎoshī zǒu jìn le jiàoshì jiù shōu le wǒmen de zuòyè.", "V + BNXH 进 + 了 + nơi chốn + 就 + V: 走进了教室就收… Chuyện đã xảy ra nên V2 cũng có 了: 收了. 收作业: thu bài tập về nhà."], ["Anh ấy tới khách sạn rồi đi ăn với khách hàng.", "他到了宾馆就跟客人一起去吃饭了。", "Tā dào le bīnguǎn jiù gēn kèrén yìqǐ qù chī fàn le.", "V1了 + nơi chốn + 就 + V2: 到了宾馆就去吃饭. 跟…一起: cùng với ai. Khách hàng trong công việc cũng có thể nói 客户 (kèhù)."], ["Em giặt quần áo xong rồi chúng mình đi ăn lẩu nhé.", "我洗完了衣服，我们就去吃火锅吧。", "Wǒ xǐ wán le yīfu, wǒmen jiù qù chī huǒguō ba.", "V + BNKQ 完 + 了 + O + 就 + V. Hai vế khác chủ ngữ (我 / 我们) thì 就 đứng sau chủ ngữ vế hai. Lẩu là 火锅."], ["Có thể viết ntn sao? Tôi nghĩ bạn nên hỏi Giám đốc trước đã.", "能这么写吗？我觉得你应该先问问经理。", "Néng zhème xiě ma? Wǒ juéde nǐ yīnggāi xiān wènwen jīnglǐ.", "这么 + động từ: như thế này. 应该: nên. 问问: động từ lặp, hỏi thử. 先: trước đã."]], "dist": {"pair": "才 và 再", "w": [["才", "cái", "\"Mới\": việc xảy ra muộn hoặc lâu hơn mong đợi. Dùng được cho cả việc đã xảy ra."], ["再", "zài", "\"Rồi mới\", \"để sau\": sắp xếp trình tự hoặc hoãn lại. Chỉ dùng cho việc CHƯA xảy ra."]], "q": [{"q": "你先休息，吃完饭___做作业。", "o": ["才", "再"], "a": 1, "zh": "你先休息，吃完饭再做作业。", "py": "Nǐ xiān xiūxi, chī wán fàn zài zuò zuòyè.", "vi": "Con nghỉ trước đi, ăn cơm xong rồi hẵng làm bài.", "why": "Sắp xếp trình tự cho việc chưa làm, nên dùng 再."}, {"q": "我昨天晚上十一点___到家。", "o": ["才", "再"], "a": 0, "zh": "我昨天晚上十一点才到家。", "py": "Wǒ zuótiān wǎnshang shíyī diǎn cái dào jiā.", "vi": "Tối qua 11 giờ tôi mới về đến nhà.", "why": "Việc đã xảy ra và muộn, nên dùng 才. 再 không dùng cho việc đã qua."}, {"q": "这件事我们明天___说吧。", "o": ["才", "再"], "a": 1, "zh": "这件事我们明天再说吧。", "py": "Zhè jiàn shì wǒmen míngtiān zài shuō ba.", "vi": "Chuyện này mai mình nói tiếp nhé.", "why": "Hoãn việc sang ngày mai, nên dùng 再."}, {"q": "他学了三年汉语___能看中国电影。", "o": ["才", "再"], "a": 0, "zh": "他学了三年汉语才能看中国电影。", "py": "Tā xué le sān nián Hànyǔ cái néng kàn Zhōngguó diànyǐng.", "vi": "Anh ấy học tiếng Trung ba năm mới xem được phim Trung Quốc.", "why": "Phải mất lâu mới làm được, nên dùng 才."}]}}, {"no": 3, "zhT": "桌子上放着很多饮料", "pyT": "Zhuōzi shang fàngzhe hěn duō yǐnliào", "viT": "Trên bàn có rất nhiều đồ uống", "g": [{"t": "Câu tồn hiện với 着", "f": "Nơi chốn + động từ + 着 + (số lượng) + danh từ", "d": "Cho biết ở một chỗ nào đó đang có vật gì, ở trạng thái nào. Nơi chốn luôn đứng đầu câu.", "ex": ["墙上挂着一张照片。", "Qiáng shang guàzhe yì zhāng zhàopiàn.", "Trên tường treo một tấm ảnh."]}, {"t": "Câu hỏi tu từ 不是……吗", "f": "不是 + … + 吗？", "d": "Nghĩa là \"chẳng phải… sao?\". Người nói không thật sự hỏi mà khẳng định, thường kèm chút ngạc nhiên hoặc nhắc nhở.", "ex": ["你不是说今天不来吗？", "Nǐ bú shì shuō jīntiān bù lái ma?", "Chẳng phải bạn nói hôm nay không đến sao?"]}, {"t": "别……了", "f": "别 + động từ + 了", "d": "Khuyên hoặc ngăn ai đó đừng làm tiếp một việc, hoặc thôi không làm việc đã định.", "ex": ["别看手机了，快睡觉吧。", "Bié kàn shǒujī le, kuài shuìjiào ba.", "Đừng xem điện thoại nữa, ngủ nhanh đi."]}, {"t": "Động từ + 在 + nơi chốn", "f": "放 / 住 / 坐 + 在 + nơi chốn", "d": "Cho biết vật hoặc người ở đâu sau khi hành động xảy ra. Hỏi vị trí: 放在哪儿了？", "ex": ["书放在桌子上了。", "Shū fàng zài zhuōzi shang le.", "Sách để trên bàn rồi."]}], "s": [["Chân tớ vẫn chưa khỏi hẳn, cuối tuần này chúng ta đừng đi leo núi nữa nhé.", "我的脚还没完全好，这个周末我们别去爬山了吧。", "Wǒ de jiǎo hái méi wánquán hǎo, zhège zhōumò wǒmen bié qù pá shān le ba.", "别…了: thôi đừng… nữa (bỏ kế hoạch đã định). 吧 cuối câu làm lời đề nghị mềm hơn."], ["Hộp sữa em vừa mua, anh để ở đâu rồi? Em muốn uống bây giờ.", "我刚买的那盒牛奶，你放在哪儿了？我现在想喝。", "Wǒ gāng mǎi de nà hé niúnǎi, nǐ fàng zài nǎr le? Wǒ xiànzài xiǎng hē.", "放在 + nơi chốn: để ở đâu. 刚买的: vừa mới mua (định ngữ). Lượng từ của hộp sữa là 盒."], ["Trên bàn không phải đang để đồ uống sao?", "桌子上不是放着饮料吗？", "Zhuōzi shang bú shì fàngzhe yǐnliào ma?", "Kết hợp hai điểm ngữ pháp: câu tồn hiện (桌子上放着饮料) và câu hỏi tu từ 不是…吗."], ["Điện thoại của mình để đâu rồi nhỉ? Sao mình chẳng nhớ gì cả?", "我的手机放在哪儿了？我怎么一点儿也不记得了？", "Wǒ de shǒujī fàng zài nǎr le? Wǒ zěnme yìdiǎnr yě bú jìde le?", "怎么 ở đây hỏi nguyên nhân kèm ngạc nhiên (sao lại…). 一点儿也不记得: không nhớ chút nào."], ["Loại trái cây nhập từ Mỹ này đắt quá, mình mua loại rẻ hơn một chút đi.", "这种从美国来的水果太贵了，我们买便宜一点儿的吧。", "Zhè zhǒng cóng Měiguó lái de shuǐguǒ tài guì le, wǒmen mǎi piányi yìdiǎnr de ba.", "太…了: quá. Tính từ + 一点儿 + 的: loại… hơn một chút (的 thay cho danh từ đã nói). 种: loại."], ["Sao bạn chỉ ăn cơm mà không ăn thức ăn? Nào, ăn thêm một chút rau đi.", "你怎么只吃米饭不吃菜？来，多吃点儿菜吧。", "Nǐ zěnme zhǐ chī mǐfàn bù chī cài? Lái, duō chī diǎnr cài ba.", "只…不…: chỉ… mà không…. 多 + động từ + (一)点儿: làm thêm một chút. 菜 vừa là rau vừa là món ăn."], ["Cô ấy không gọi cho tôi, thì tôi cũng sẽ không gọi cho cô ấy.", "她不给我打电话，那我也不会给她打。", "Tā bù gěi wǒ dǎ diànhuà, nà wǒ yě bú huì gěi tā dǎ.", "给 + người + 打电话: gọi điện cho ai (给 đứng TRƯỚC động từ, khác tiếng Việt). 不会: sẽ không."], ["Bố mẹ đừng lo lắng, con sẽ tự chăm sóc bản thân thật tốt.", "爸爸妈妈，你们别担心，我会好好照顾自己的。", "Bàba māma, nǐmen bié dānxīn, wǒ huì hǎohāo zhàogù zìjǐ de.", "会…的: khẳng định chắc chắn sẽ làm. 好好 + động từ: làm cho thật tốt, đàng hoàng."], ["Bạn mệt rồi à? Uống một ly trà nóng đi, sẽ thấy dễ chịu hơn.", "你累了吗？喝一杯热茶吧，会舒服一点儿。", "Nǐ lèi le ma? Hē yì bēi rè chá ba, huì shūfu yìdiǎnr.", "会 + tính từ + 一点儿: sẽ… hơn một chút. 累了: 了 chỉ sự thay đổi trạng thái."], ["Khi trời nóng hoặc sau khi vận động, tôi rất thích uống trà.", "天气热的时候或者运动以后，我很喜欢喝茶。", "Tiānqì rè de shíhou huòzhě yùndòng yǐhòu, wǒ hěn xǐhuan hē chá.", "Câu kể nên \"hoặc\" dùng 或者. …的时候: khi…; …以后: sau khi… (cả hai đều đứng sau vế câu)."]], "dist": {"pair": "一点儿 và 有点儿", "w": [["有点儿", "yǒudiǎnr", "Đứng TRƯỚC tính từ: hơi…, thường mang ý không vừa lòng. 有点儿贵, 有点儿冷."], ["一点儿", "yìdiǎnr", "Đứng SAU tính từ: …hơn một chút (so sánh, đề nghị). Và trong cấu trúc 一点儿也不…"]], "q": [{"q": "今天___冷，你多穿点儿衣服。", "o": ["一点儿", "有点儿"], "a": 1, "zh": "今天有点儿冷，你多穿点儿衣服。", "py": "Jīntiān yǒudiǎnr lěng, nǐ duō chuān diǎnr yīfu.", "vi": "Hôm nay hơi lạnh, bạn mặc thêm áo vào.", "why": "Chỗ trống đứng trước tính từ 冷, nên chỉ có thể là 有点儿."}, {"q": "这件太大了，有没有小___的？", "o": ["一点儿", "有点儿"], "a": 0, "zh": "这件太大了，有没有小一点儿的？", "py": "Zhè jiàn tài dà le, yǒu méiyǒu xiǎo yìdiǎnr de?", "vi": "Cái này to quá, có cái nào nhỏ hơn một chút không?", "why": "Đứng sau tính từ 小, mang ý so sánh (nhỏ hơn), nên dùng 一点儿."}, {"q": "我___也不饿。", "o": ["一点儿", "有点儿"], "a": 0, "zh": "我一点儿也不饿。", "py": "Wǒ yìdiǎnr yě bú è.", "vi": "Tôi không đói chút nào.", "why": "Cấu trúc cố định 一点儿也不 + tính từ."}, {"q": "这个菜___辣，我不太喜欢。", "o": ["一点儿", "有点儿"], "a": 1, "zh": "这个菜有点儿辣，我不太喜欢。", "py": "Zhège cài yǒudiǎnr là, wǒ bú tài xǐhuan.", "vi": "Món này hơi cay, tôi không thích lắm.", "why": "Đánh giá không vừa ý, đứng trước tính từ, nên dùng 有点儿."}]}}, {"no": 4, "zhT": "她总是笑着跟客人说话", "pyT": "Tā zǒngshì xiàozhe gēn kèrén shuōhuà", "viT": "Cô ấy thường cười khi nói chuyện với khách hàng", "g": [{"t": "Động từ 1 + 着 + động từ 2", "f": "V1 着 + V2", "d": "V1 là cách thức, tư thế khi làm V2: 笑着说 (cười nói), 站着吃 (đứng ăn), 坐着听 (ngồi nghe).", "ex": ["他常常站着吃早饭。", "Tā chángcháng zhànzhe chī zǎofàn.", "Anh ấy hay đứng ăn sáng."]}, {"t": "又……又……", "f": "又 + tính từ + 又 + tính từ", "d": "Vừa… vừa…, nói hai đặc điểm cùng có ở một người hay một vật.", "ex": ["这个苹果又大又甜。", "Zhège píngguǒ yòu dà yòu tián.", "Quả táo này vừa to vừa ngọt."]}, {"t": "一边……一边……", "f": "一边 + V1 + 一边 + V2", "d": "Vừa… vừa…, nói hai hành động xảy ra cùng một lúc.", "ex": ["我喜欢一边吃饭一边聊天。", "Wǒ xǐhuan yìbiān chī fàn yìbiān liáotiān.", "Tôi thích vừa ăn vừa trò chuyện."]}, {"t": "每次……都……", "f": "每次 + … + 都 + …", "d": "Lần nào… cũng…", "ex": ["每次考试他都很紧张。", "Měi cì kǎoshì tā dōu hěn jǐnzhāng.", "Lần nào thi anh ấy cũng rất căng thẳng."]}], "s": [["Anh ấy vừa cao vừa đẹp trai, lúc nào nói chuyện với tôi cũng cười.", "他又高又帅，跟我说话的时候总是笑着。", "Tā yòu gāo yòu shuài, gēn wǒ shuōhuà de shíhou zǒngshì xiàozhe.", "又A又B nối hai tính từ. 总是: lúc nào cũng. 笑着: động từ + 着 chỉ trạng thái kéo dài. 跟…说话: nói chuyện với ai."], ["Người đang đứng ăn kia là ai vậy?", "站着吃东西的那个人是谁？", "Zhànzhe chī dōngxi de nàge rén shì shéi?", "站着吃: V1着V2, đứng (tư thế) để ăn. Cả cụm 站着吃东西 làm định ngữ, nối với 那个人 bằng 的."], ["Mỗi lần tôi hỏi, cô ấy đều cười rồi trả lời tôi.", "每次我问她，她都笑着回答我。", "Měi cì wǒ wèn tā, tā dōu xiàozhe huídá wǒ.", "每次…都…: lần nào cũng. 笑着回答: vừa cười vừa trả lời (cười là cách trả lời)."], ["Nhân viên phục vụ ở cửa hàng này vừa nhiệt tình vừa chăm chỉ.", "这家店的服务员又热情又认真。", "Zhè jiā diàn de fúwùyuán yòu rèqíng yòu rènzhēn.", "又A又B với hai tính từ. Lượng từ của cửa hàng, nhà hàng là 家."], ["Đứa trẻ này làm việc rất nghiêm túc, ai cũng thích nó.", "这个孩子做事很认真，大家都喜欢他。", "Zhège háizi zuò shì hěn rènzhēn, dàjiā dōu xǐhuan tā.", "\"Ai cũng\" có thể dịch là 大家都 hoặc 谁都. 做事: làm việc (nói chung)."], ["Tấm ảnh này chụp khi nào thế?", "这张照片是什么时候照的？", "Zhè zhāng zhàopiàn shì shénme shíhou zhào de?", "是…的 nhấn mạnh thời gian của việc đã xảy ra. Lượng từ của ảnh là 张."], ["Xin lỗi, anh nói hơi nhanh, tôi không hiểu câu hỏi của anh.", "对不起，你说得有点儿快，我没听懂你的问题。", "Duìbuqǐ, nǐ shuō de yǒudiǎnr kuài, wǒ méi tīng dǒng nǐ de wèntí.", "Động từ + 得 + đánh giá: 说得有点儿快. 听懂: nghe hiểu (bổ ngữ kết quả), phủ định là 没听懂."], ["Sao bạn cứ vừa nghe nhạc vừa làm bài tập vậy?", "你怎么总是一边听音乐一边做作业？", "Nǐ zěnme zǒngshì yìbiān tīng yīnyuè yìbiān zuò zuòyè?", "一边…一边… nối hai hành động cùng lúc. 总是 đứng trước 一边."], ["Người đang đứng ăn bánh kem kia là ai thế?", "站着吃蛋糕的那个人是谁？", "Zhànzhe chī dàngāo de nàge rén shì shéi?", "Giống câu 2: 站着吃蛋糕 là định ngữ cho 那个人."], ["Em gái mình vừa xinh vừa thân thiện, sau này có dịp mình sẽ giới thiệu cho bạn nhé!", "我妹妹又漂亮又友好，以后有机会我给你介绍一下！", "Wǒ mèimei yòu piàoliang yòu yǒuhǎo, yǐhòu yǒu jīhuì wǒ gěi nǐ jièshào yíxià!", "给 + người + 介绍: giới thiệu cho ai. 一下 sau động từ làm câu nhẹ nhàng hơn."]], "dist": {"pair": "又……又…… và 一边……一边……", "w": [["又……又……", "yòu… yòu…", "Thường nối hai TÍNH TỪ: hai đặc điểm cùng có."], ["一边……一边……", "yìbiān… yìbiān…", "Nối hai ĐỘNG TỪ: hai hành động làm cùng một lúc."]], "q": [{"q": "这个苹果___大___甜。", "o": ["又……又……", "一边……一边……"], "a": 0, "zh": "这个苹果又大又甜。", "py": "Zhège píngguǒ yòu dà yòu tián.", "vi": "Quả táo này vừa to vừa ngọt.", "why": "大 và 甜 là tính từ, nên dùng 又…又…"}, {"q": "他___吃饭___看手机。", "o": ["又……又……", "一边……一边……"], "a": 1, "zh": "他一边吃饭一边看手机。", "py": "Tā yìbiān chī fàn yìbiān kàn shǒujī.", "vi": "Anh ấy vừa ăn cơm vừa xem điện thoại.", "why": "Hai hành động xảy ra cùng lúc, nên dùng 一边…一边…"}, {"q": "我妹妹___聪明___可爱。", "o": ["又……又……", "一边……一边……"], "a": 0, "zh": "我妹妹又聪明又可爱。", "py": "Wǒ mèimei yòu cōngming yòu kě'ài.", "vi": "Em gái tôi vừa thông minh vừa đáng yêu.", "why": "聪明 và 可爱 là tính từ chỉ đặc điểm."}, {"q": "我们___走___聊天吧。", "o": ["又……又……", "一边……一边……"], "a": 1, "zh": "我们一边走一边聊天吧。", "py": "Wǒmen yìbiān zǒu yìbiān liáotiān ba.", "vi": "Chúng ta vừa đi vừa nói chuyện nhé.", "why": "走 và 聊天 là hai hành động đồng thời."}]}}, {"no": 5, "zhT": "我最近越来越胖了", "pyT": "Wǒ zuìjìn yuè lái yuè pàng le", "viT": "Dạo này em càng ngày càng béo ra", "g": [{"t": "越来越", "f": "越来越 + tính từ / động từ tâm lý (+ 了)", "d": "Càng ngày càng…, mức độ tăng dần theo thời gian. Không thêm 很, 更 vào sau 越来越.", "ex": ["天气越来越冷了。", "Tiānqì yuè lái yuè lěng le.", "Trời càng ngày càng lạnh."]}, {"t": "了 chỉ sự thay đổi", "f": "… + 了 (cuối câu)", "d": "Cho biết đã có một trạng thái mới: 胖了 (béo ra), 冷了 (lạnh rồi), 不去了 (không đi nữa).", "ex": ["他长高了。", "Tā zhǎng gāo le.", "Cậu ấy cao lên rồi."]}, {"t": "Sắp… rồi", "f": "要 / 快 / 快要 / 就要 + … + 了", "d": "Việc sắp xảy ra. Khi có thời gian cụ thể phía trước thì dùng 就要, không dùng 快要: 明天就要考试了.", "ex": ["快走吧，要下雨了！", "Kuài zǒu ba, yào xià yǔ le!", "Đi nhanh lên, sắp mưa rồi!"]}, {"t": "是不是", "f": "是不是 + …？", "d": "Hỏi để xác nhận điều mình đoán: có phải… không?", "ex": ["你是不是感冒了？", "Nǐ shì bu shì gǎnmào le?", "Có phải bạn bị cảm rồi không?"]}], "s": [["Tôi nghe nói dạo này sức khỏe bạn không được tốt, có chuyện gì vậy?", "听说你最近身体不太好，怎么了？", "Tīngshuō nǐ zuìjìn shēntǐ bú tài hǎo, zěnme le?", "听说 đứng đầu câu: nghe nói. 怎么了？: có chuyện gì vậy? 不太好: không được tốt lắm."], ["Mấy ngày nay thời tiết càng ngày càng nóng, tôi thấy như bị cảm nhẹ.", "这几天天气越来越热，我觉得好像有点儿感冒了。", "Zhè jǐ tiān tiānqì yuè lái yuè rè, wǒ juéde hǎoxiàng yǒudiǎnr gǎnmào le.", "越来越热: càng ngày càng nóng. 好像: hình như. 有点儿感冒了: bị cảm nhẹ, 了 chỉ trạng thái mới."], ["Đây là mèo con tôi mới mua, bạn có thể cùng tôi chăm sóc nó không?", "这是我刚买的小猫，你能跟我一起照顾它吗？", "Zhè shì wǒ gāng mǎi de xiǎo māo, nǐ néng gēn wǒ yìqǐ zhàogù tā ma?", "刚买的: vừa mới mua (định ngữ). 跟…一起: cùng với. Đại từ cho con vật là 它 (tā)."], ["Có phải tôi bị sốt rồi không? Sao tôi cứ thấy lạnh lạnh.", "我是不是发烧了？怎么总是觉得有点儿冷？", "Wǒ shì bu shì fāshāo le? Zěnme zǒngshì juéde yǒudiǎnr lěng?", "是不是: hỏi xác nhận điều đang đoán. 总是: cứ, luôn. \"Lạnh lạnh\" dịch thành 有点儿冷."], ["Số trái cây này tôi mua từ hôm qua, hôm nay gần ăn hết rồi.", "这些水果是我昨天买的，今天快吃完了。", "Zhèxiē shuǐguǒ shì wǒ zuótiān mǎi de, jīntiān kuài chī wán le.", "是…的 nhấn mạnh thời gian đã mua. 快…了: sắp. 吃完: ăn hết (bổ ngữ kết quả)."], ["Tôi thích cả bốn mùa, nhưng mùa xuân vẫn là mùa tôi thích nhất.", "一年四个季节我都喜欢，但是我最喜欢的还是春天。", "Yì nián sì ge jìjié wǒ dōu xǐhuan, dànshì wǒ zuì xǐhuan de háishi chūntiān.", "还是 ở đây nghĩa là \"vẫn là\", khác 还是 trong câu hỏi lựa chọn. 最喜欢的: cái thích nhất."], ["Bạn xem, chữ Hán tôi viết có phải càng ngày càng đẹp không?", "你看，我写的汉字是不是越来越好看了？", "Nǐ kàn, wǒ xiě de Hànzì shì bu shì yuè lái yuè hǎokàn le?", "是不是 + 越来越…了. Chữ viết đẹp thường dùng 好看 hoặc 漂亮."], ["Mau đi nhanh lên, sắp mưa rồi kìa!", "快走吧，要下雨了！", "Kuài zǒu ba, yào xià yǔ le!", "要…了: sắp. 快 đầu câu là \"nhanh lên\", khác 快…了 (sắp)."], ["Bạn mặc nhiều quần áo thế này, tất nhiên sẽ cảm thấy nóng rồi.", "你穿这么多衣服，当然会觉得热了。", "Nǐ chuān zhème duō yīfu, dāngrán huì juéde rè le.", "这么 + tính từ: …thế này. 当然: tất nhiên. 会: sẽ (dự đoán)."], ["Anh hơi sốt rồi đấy, để tôi kê cho anh ít thuốc nhé.", "你有点儿发烧，我给你开点儿药吧。", "Nǐ yǒudiǎnr fāshāo, wǒ gěi nǐ kāi diǎnr yào ba.", "开药: kê thuốc (bác sĩ). 给 + người + động từ: làm gì cho ai. 点儿 = 一点儿: ít, một chút."]], "dist": {"pair": "越来越 và 更", "w": [["越来越", "yuè lái yuè", "Mức độ tăng dần theo thời gian, thường có 了 cuối câu. Không dùng trong câu có 比."], ["更", "gèng", "Hơn nữa, dùng khi so sánh hai người, hai vật hoặc hai thời điểm."]], "q": [{"q": "天气___冷了。", "o": ["越来越", "更"], "a": 0, "zh": "天气越来越冷了。", "py": "Tiānqì yuè lái yuè lěng le.", "vi": "Thời tiết càng ngày càng lạnh.", "why": "Nói sự thay đổi dần theo thời gian, có 了 cuối câu, nên dùng 越来越."}, {"q": "我觉得北京的冬天比上海___冷。", "o": ["越来越", "更"], "a": 1, "zh": "我觉得北京的冬天比上海更冷。", "py": "Wǒ juéde Běijīng de dōngtiān bǐ Shànghǎi gèng lěng.", "vi": "Tôi thấy mùa đông Bắc Kinh lạnh hơn Thượng Hải.", "why": "Có 比 so sánh hai nơi, nên dùng 更. 越来越 không dùng trong câu 比."}, {"q": "他的汉语说得___好了。", "o": ["越来越", "更"], "a": 0, "zh": "他的汉语说得越来越好了。", "py": "Tā de Hànyǔ shuō de yuè lái yuè hǎo le.", "vi": "Tiếng Trung của anh ấy nói ngày càng giỏi.", "why": "Tiến bộ dần theo thời gian."}, {"q": "这件衬衫不错，那件___好看。", "o": ["越来越", "更"], "a": 1, "zh": "这件衬衫不错，那件更好看。", "py": "Zhè jiàn chènshān búcuò, nà jiàn gèng hǎokàn.", "vi": "Cái áo sơ mi này được đấy, cái kia còn đẹp hơn.", "why": "So sánh hai chiếc áo, nên dùng 更."}]}}, {"no": 6, "zhT": "怎么突然找不到了", "pyT": "Zěnme tūrán zhǎo bu dào le", "viT": "Sao bỗng dưng lại tìm không thấy?", "g": [{"t": "Bổ ngữ kết quả 清楚 / 懂 / 见 / 到 / 完", "f": "Động từ + bổ ngữ kết quả", "d": "Cho biết kết quả của hành động: 看见 (nhìn thấy), 听懂 (nghe hiểu), 找到 (tìm thấy), 讲清楚 (giảng rõ).", "ex": ["我找到我的钥匙了。", "Wǒ zhǎo dào wǒ de yàoshi le.", "Tôi tìm thấy chìa khóa rồi."]}, {"t": "Bổ ngữ khả năng", "f": "Động từ + 得 / 不 + bổ ngữ", "d": "Có làm được hay không: 看得清楚 (nhìn rõ được), 看不见 (không nhìn thấy được), 找不到 (tìm không thấy).", "ex": ["黑板上的字你看得见吗？", "Hēibǎn shang de zì nǐ kàn de jiàn ma?", "Chữ trên bảng bạn có nhìn thấy không?"]}, {"t": "刚 và 刚才", "f": "主语 + 刚 + V ／ 刚才 + (主语) + …", "d": "刚 là phó từ, đứng sau chủ ngữ, trước động từ. 刚才 là danh từ thời gian, đứng được ở đầu câu, và có thể đi với 不 / 没. (Xem thêm phần luyện phân biệt bên dưới.)", "ex": ["我刚到家。", "Wǒ gāng dào jiā.", "Tôi vừa về đến nhà."]}, {"t": "Bổ ngữ trạng thái và so sánh", "f": "V + 得 + tính từ ／ A 比 B + tính từ + 多了", "d": "跑得很快: chạy nhanh. 比我快多了: nhanh hơn tôi nhiều.", "ex": ["他跑得比我快多了。", "Tā pǎo de bǐ wǒ kuài duō le.", "Anh ấy chạy nhanh hơn tôi nhiều."]}], "s": [["Chữ Hán tôi viết bạn nhìn có rõ không?", "我写的汉字你看得清楚吗？", "Wǒ xiě de Hànzì nǐ kàn de qīngchu ma?", "看得清楚: bổ ngữ khả năng (nhìn rõ được không). Phủ định: 看不清楚."], ["Câu hỏi này tôi đã giảng rất rõ rồi, đừng hỏi lại nữa.", "这个问题我已经讲得很清楚了，别再问了。", "Zhège wèntí wǒ yǐjīng jiǎng de hěn qīngchu le, bié zài wèn le.", "讲得很清楚: bổ ngữ trạng thái (giảng rõ ràng). 别再…了: đừng… lại nữa."], ["Anh ấy chạy rất nhanh, nhanh hơn tôi nhiều.", "他跑得很快，比我快多了。", "Tā pǎo de hěn kuài, bǐ wǒ kuài duō le.", "跑得很快: bổ ngữ trạng thái. A比B + tính từ + 多了: hơn nhiều. Trong câu 比 không dùng 很."], ["Con vừa làm bài tập xong rồi.", "我刚做完作业。", "Wǒ gāng zuò wán zuòyè.", "刚 + động từ: vừa mới. Câu có 刚 thường không thêm 了 cuối câu. 做完: làm xong."], ["Vừa nãy cô giáo của bạn có gọi điện, bảo bạn đến văn phòng gặp cô.", "刚才你的老师打电话来，让你去办公室找她。", "Gāngcái nǐ de lǎoshī dǎ diànhuà lái, ràng nǐ qù bàngōngshì zhǎo tā.", "刚才 đứng đầu câu (danh từ thời gian, không thay bằng 刚 được). 让 + người + động từ: bảo ai làm gì."], ["Lúc nãy còn nắng mà, sao tự nhiên lại mưa thế này?", "刚才还是晴天，怎么突然下雨了？", "Gāngcái hái shì qíngtiān, zěnme tūrán xià yǔ le?", "怎么 + 突然: sao bỗng dưng (ngạc nhiên). 下雨了: 了 chỉ tình huống mới."], ["Buổi tối tôi thường thích trò chuyện với bạn bè.", "晚上我常常喜欢跟朋友聊天。", "Wǎnshang wǒ chángcháng xǐhuan gēn péngyou liáotiān.", "跟 + người + 聊天: trò chuyện với ai. 聊天 là động từ ly hợp, không nói 聊天朋友."], ["Phim hôm nay đông người xem vậy, không biết còn mua được vé không?", "今天看电影的人这么多，不知道还能不能买到票。", "Jīntiān kàn diànyǐng de rén zhème duō, bù zhīdào hái néng bu néng mǎi dào piào.", "买到: mua được (bổ ngữ kết quả 到). 能不能 đặt sau 不知道 thành câu kể, cuối câu không dùng 吗."], ["Con vừa mới về đến nhà, cho con nghỉ một chút đã nhé.", "我刚到家，让我先休息一下吧。", "Wǒ gāng dào jiā, ràng wǒ xiān xiūxi yíxià ba.", "刚 + động từ: vừa mới. 让我…: để tôi… 先: trước đã."], ["Không có kính, tôi chẳng nhìn thấy gì cả.", "没有眼镜，我什么都看不见。", "Méiyǒu yǎnjìng, wǒ shénme dōu kàn bu jiàn.", "看不见: bổ ngữ khả năng, không nhìn thấy được. 什么都: cái gì cũng."]], "dist": {"pair": "刚 và 刚才", "w": [["刚", "gāng", "Phó từ: đứng sau chủ ngữ, trước động từ. Thời gian \"vừa mới\" có thể khá dài theo cảm nhận (vừa đến 1 tháng). Thường đi với 就: 刚…就…"], ["刚才", "gāngcái", "Danh từ thời gian: vài phút trước lúc nói. Đứng được ở đầu câu, và có thể đi với 不 / 没 phía sau."]], "q": [{"q": "___你去哪儿了？我找了你半天。", "o": ["刚", "刚才"], "a": 1, "zh": "刚才你去哪儿了？我找了你半天。", "py": "Gāngcái nǐ qù nǎr le? Wǒ zhǎo le nǐ bàntiān.", "vi": "Lúc nãy bạn đi đâu vậy? Tôi tìm bạn mãi.", "why": "Chỗ trống đứng trước chủ ngữ 你. Chỉ 刚才 (danh từ thời gian) đứng được ở đầu câu."}, {"q": "我___来北京一个月，还不太习惯。", "o": ["刚", "刚才"], "a": 0, "zh": "我刚来北京一个月，还不太习惯。", "py": "Wǒ gāng lái Běijīng yí ge yuè, hái bú tài xíguàn.", "vi": "Tôi mới đến Bắc Kinh được một tháng, vẫn chưa quen lắm.", "why": "Khoảng thời gian là một tháng, không phải vài phút trước, nên dùng 刚."}, {"q": "我___没看见他。", "o": ["刚", "刚才"], "a": 1, "zh": "我刚才没看见他。", "py": "Wǒ gāngcái méi kànjiàn tā.", "vi": "Lúc nãy tôi không nhìn thấy anh ấy.", "why": "Phía sau có 没. 刚 không đi với 不 / 没, còn 刚才 thì được."}, {"q": "他___到家，就下雨了。", "o": ["刚", "刚才"], "a": 0, "zh": "他刚到家，就下雨了。", "py": "Tā gāng dào jiā, jiù xià yǔ le.", "vi": "Anh ấy vừa về đến nhà thì trời mưa.", "why": "Cấu trúc 刚…就…: vừa… thì đã…"}]}}, {"no": 7, "zhT": "我跟她都认识五年了", "pyT": "Wǒ gēn tā dōu rènshi wǔ nián le", "viT": "Tôi và cô ấy quen nhau được năm năm rồi", "g": [{"t": "Thời lượng + 了 (đã được bao lâu)", "f": "(都) + V + (了) + thời lượng + 了", "d": "了 ở cuối câu cho biết việc vẫn đang tiếp diễn đến bây giờ. 都 nhấn mạnh là đã lâu.", "ex": ["我学汉语学了两年了。", "Wǒ xué Hànyǔ xué le liǎng nián le.", "Tôi học tiếng Trung được hai năm rồi."]}, {"t": "离 chỉ khoảng cách", "f": "A 离 B + 远 / 近", "d": "Dùng cho khoảng cách không gian và cả thời gian: 离考试还有三天.", "ex": ["我家离公司很近。", "Wǒ jiā lí gōngsī hěn jìn.", "Nhà tôi cách công ty rất gần."]}, {"t": "Ước lượng với 左右", "f": "Số lượng + 左右", "d": "Khoảng, chừng. 左右 đứng SAU con số (khác 大概 đứng trước).", "ex": ["一个小时左右。", "Yí ge xiǎoshí zuǒyòu.", "Khoảng một tiếng."]}, {"t": "还要多长时间才……", "f": "还要多长时间 + 才 + V？", "d": "Còn bao lâu nữa mới… 才 cho thấy người nói thấy lâu.", "ex": ["你还要多长时间才能做完？", "Nǐ hái yào duō cháng shíjiān cái néng zuò wán?", "Bạn còn bao lâu nữa mới làm xong?"]}], "s": [["Tôi và cô ấy quen nhau đã được năm năm rồi.", "我跟她都认识五年了。", "Wǒ gēn tā dōu rènshi wǔ nián le.", "都…了: đã… rồi (nhấn mạnh lâu). Thời lượng 五年 đứng sau động từ, 了 cuối câu cho biết đến giờ vẫn quen."], ["Cô giáo xinh đẹp mới đến kia tên là gì vậy?", "那个新来的漂亮老师叫什么名字？", "Nàge xīn lái de piàoliang lǎoshī jiào shénme míngzi?", "新来的: mới đến (định ngữ). Thứ tự định ngữ: 那个 + 新来的 + 漂亮 + 老师."], ["Xin hỏi, thầy Vương đã quay lại chưa ạ?", "请问，王老师回来了吗？", "Qǐngwèn, Wáng lǎoshī huílai le ma?", "回来: quay lại (hướng về phía người nói). Họ đứng trước chức danh: 王老师."], ["Ngày mai có bài kiểm tra tiếng Trung, hôm nay con phải chuẩn bị thật kỹ.", "明天有汉语考试，今天我得好好准备。", "Míngtiān yǒu Hànyǔ kǎoshì, jīntiān wǒ děi hǎohāo zhǔnbèi.", "得 đọc là děi: phải. 好好 + động từ: làm cho thật kỹ."], ["Còn bao lâu nữa thì anh mới đến Bắc Kinh?", "你还要多长时间才能到北京？", "Nǐ hái yào duō cháng shíjiān cái néng dào Běijīng?", "还要多长时间才…: còn bao lâu nữa mới… 才 thể hiện người nói thấy lâu."], ["Nhà tôi cách trường khá xa, đi xe buýt mất khoảng một tiếng.", "我家离学校比较远，坐公共汽车要一个小时左右。", "Wǒ jiā lí xuéxiào bǐjiào yuǎn, zuò gōnggòng qìchē yào yí ge xiǎoshí zuǒyòu.", "A离B + 远/近. 比较: khá. 要: mất (thời gian). 左右 đứng sau số lượng."], ["Bây giờ là 7 giờ sáng, ngoài đường xe cộ đông lắm.", "现在是早上七点，路上的车很多。", "Xiànzài shì zǎoshang qī diǎn, lù shang de chē hěn duō.", "Buổi (早上) đứng trước giờ (七点). 路上: trên đường."], ["Hôm nay tôi sẽ cùng bạn đi dự sinh nhật.", "今天我跟你一起去参加生日会。", "Jīntiān wǒ gēn nǐ yìqǐ qù cānjiā shēngrì huì.", "参加: tham dự. 跟…一起去…: cùng ai đi đâu làm gì."], ["Gần đây có một nhà hàng Trung Quốc, mình tới đó thử nhé!", "这附近有一家中国饭馆，我们去尝尝吧！", "Zhè fùjìn yǒu yì jiā Zhōngguó fànguǎn, wǒmen qù chángchang ba!", "Nơi chốn + 有 + vật. 尝尝: động từ lặp lại, nghĩa là thử một chút."], ["Từ nhà tôi đến đây chỉ mất vài phút đi bộ thôi.", "从我家到这儿走路只要几分钟。", "Cóng wǒ jiā dào zhèr zǒulù zhǐ yào jǐ fēnzhōng.", "从A到B: từ A đến B. 只要: chỉ cần, chỉ mất. 几 ở đây là \"vài\"."], ["Đi xe buýt khoảng 20 phút có thể đến công ty không?", "坐公共汽车二十分钟左右能到公司吗？", "Zuò gōnggòng qìchē èrshí fēnzhōng zuǒyòu néng dào gōngsī ma?", "坐 + phương tiện: đi bằng… 左右 đứng sau số lượng. 能到: đến được."]], "dist": {"pair": "离 và 从", "w": [["离", "lí", "Chỉ KHOẢNG CÁCH giữa hai điểm (không gian hoặc thời gian): A离B很远 / 离考试还有三天."], ["从", "cóng", "Chỉ ĐIỂM XUẤT PHÁT: 从A到B, 从北京来."]], "q": [{"q": "我家___学校很近。", "o": ["离", "从"], "a": 0, "zh": "我家离学校很近。", "py": "Wǒ jiā lí xuéxiào hěn jìn.", "vi": "Nhà tôi cách trường rất gần.", "why": "Nói khoảng cách xa gần giữa hai nơi, nên dùng 离."}, {"q": "___这儿到火车站要多长时间？", "o": ["离", "从"], "a": 1, "zh": "从这儿到火车站要多长时间？", "py": "Cóng zhèr dào huǒchēzhàn yào duō cháng shíjiān?", "vi": "Từ đây đến ga tàu mất bao lâu?", "why": "Có cặp 从…到… chỉ điểm đi và điểm đến."}, {"q": "现在___考试只有三天了。", "o": ["离", "从"], "a": 0, "zh": "现在离考试只有三天了。", "py": "Xiànzài lí kǎoshì zhǐ yǒu sān tiān le.", "vi": "Bây giờ chỉ còn ba ngày nữa là thi.", "why": "离 cũng dùng cho khoảng cách thời gian đến một mốc."}, {"q": "他是___北京来的。", "o": ["离", "从"], "a": 1, "zh": "他是从北京来的。", "py": "Tā shì cóng Běijīng lái de.", "vi": "Anh ấy đến từ Bắc Kinh.", "why": "Bắc Kinh là điểm xuất phát, nên dùng 从."}]}}, {"no": 8, "zhT": "你去哪儿我就去哪儿", "pyT": "Nǐ qù nǎr wǒ jiù qù nǎr", "viT": "Em đi đâu thì anh đi đó", "g": [{"t": "又 và 再", "f": "又 + V (đã lặp lại) ／ 再 + V (sẽ lặp lại)", "d": "又: việc đã lặp lại rồi (hoặc chắc chắn lặp lại theo quy luật). 再: lặp lại ở tương lai, chưa xảy ra. 再 còn có nghĩa \"rồi mới\": 吃完饭再走.", "ex": ["他昨天来了，今天又来了。", "Tā zuótiān lái le, jīntiān yòu lái le.", "Hôm qua anh ấy đến, hôm nay lại đến."]}, {"t": "Đại từ nghi vấn dùng hai lần", "f": "…疑问词…，…就…疑问词…", "d": "Hai đại từ nghi vấn chỉ cùng một thứ: đâu… đó, bao nhiêu… bấy nhiêu, mấy giờ… mấy giờ.", "ex": ["你想去哪儿就去哪儿。", "Nǐ xiǎng qù nǎr jiù qù nǎr.", "Bạn muốn đi đâu thì đi đó."]}, {"t": "几乎", "f": "几乎 + (没有 / 都 / 每天…)", "d": "Gần như, hầu như.", "ex": ["他几乎每天都跑步。", "Tā jīhū měi tiān dōu pǎobù.", "Hầu như ngày nào anh ấy cũng chạy bộ."]}, {"t": "对……来说", "f": "对 + người + 来说，…", "d": "Đối với ai mà nói, nêu quan điểm từ góc nhìn của người đó.", "ex": ["对我来说，汉字不太难。", "Duì wǒ lái shuō, Hànzì bú tài nán.", "Đối với tôi, chữ Hán không khó lắm."]}], "s": [["Ngày mai tôi lại đi xem nhà, mấy căn hôm qua xem đều không vừa ý.", "明天我再去看房子，昨天看的几个我都不满意。", "Míngtiān wǒ zài qù kàn fángzi, zuótiān kàn de jǐ ge wǒ dōu bù mǎnyì.", "Việc \"lại đi\" ở tương lai nên dùng 再, không dùng 又. 昨天看的: những căn xem hôm qua."], ["Sao lại ăn thịt dê nữa? Mấy ngày nay ngày nào cũng ăn thịt dê mà.", "怎么又吃羊肉？这几天每天都吃羊肉。", "Zěnme yòu chī yángròu? Zhè jǐ tiān měi tiān dōu chī yángròu.", "Việc lặp lại đã đang xảy ra, nên dùng 又. 怎么又…: sao lại… nữa (than phiền)."], ["Anh thật sự không muốn xa em, em đi đâu thì anh theo đó.", "我真的不想离开你，你去哪儿我就去哪儿。", "Wǒ zhēn de bù xiǎng líkāi nǐ, nǐ qù nǎr wǒ jiù qù nǎr.", "Đại từ nghi vấn dùng hai lần: 哪儿…就…哪儿. 离开: rời xa."], ["Đối với tôi, sức khỏe là quan trọng nhất, mập hay ốm cũng không quan trọng.", "对我来说，身体健康最重要，胖一点儿瘦一点儿都没关系。", "Duì wǒ lái shuō, shēntǐ jiànkāng zuì zhòngyào, pàng yìdiǎnr shòu yìdiǎnr dōu méi guānxi.", "对…来说: đối với… 没关系: không sao, không quan trọng."], ["Tiểu Cương, bạn muốn ăn bao nhiêu cứ ăn, đừng khách sáo nhé!", "小刚，你想吃多少就吃多少，别客气！", "Xiǎo Gāng, nǐ xiǎng chī duōshao jiù chī duōshao, bié kèqi!", "多少…就…多少: bao nhiêu… bấy nhiêu. 别客气: đừng khách sáo."], ["Mấy ngày nay tôi bận quá, gần như không có thời gian nghỉ ngơi.", "这几天我太忙了，几乎没有时间休息。", "Zhè jǐ tiān wǒ tài máng le, jīhū méiyǒu shíjiān xiūxi.", "几乎: gần như. 没有时间 + động từ: không có thời gian làm gì."], ["Bộ đồ này hơi đắt, tôi muốn xem thêm mấy bộ nữa rồi mới quyết định.", "这件衣服有点儿贵，我想再看几件再决定。", "Zhè jiàn yīfu yǒudiǎnr guì, wǒ xiǎng zài kàn jǐ jiàn zài juédìng.", "再 thứ nhất: thêm (lặp lại ở tương lai). 再 thứ hai: rồi mới. 有点儿 + tính từ: hơi…"], ["Mẹ không nói nữa, con muốn ngủ tới mấy giờ thì ngủ.", "妈妈不说了，你想睡到几点就睡到几点吧。", "Māma bù shuō le, nǐ xiǎng shuì dào jǐ diǎn jiù shuì dào jǐ diǎn ba.", "几点…就…几点: mấy giờ… mấy giờ. 不说了: không nói nữa (了 chỉ thay đổi)."], ["Hôm qua con vừa đi xem phim, hôm nay lại muốn đi nữa à?", "你昨天刚去看电影，今天又想去吗？", "Nǐ zuótiān gāng qù kàn diànyǐng, jīntiān yòu xiǎng qù ma?", "又想: cái \"muốn\" đã lặp lại ngay lúc này, nên dùng 又 (không phải 再)."], ["Tôi thấy mấy năm nay bạn không thay đổi gì cả.", "我觉得这几年你一点儿也没变。", "Wǒ juéde zhè jǐ nián nǐ yìdiǎnr yě méi biàn.", "一点儿也没 + động từ: không… chút nào. Việc đã qua nên phủ định bằng 没."]], "dist": {"pair": "又 và 再", "w": [["又", "yòu", "Lặp lại ĐÃ xảy ra (thường có 了), hoặc chắc chắn lặp lại theo quy luật: 明天又是星期一."], ["再", "zài", "Lặp lại CHƯA xảy ra, ở tương lai. Cũng có nghĩa \"rồi mới\": 先…再…"]], "q": [{"q": "他昨天来了，今天___来了。", "o": ["又", "再"], "a": 0, "zh": "他昨天来了，今天又来了。", "py": "Tā zuótiān lái le, jīntiān yòu lái le.", "vi": "Hôm qua anh ấy đến, hôm nay lại đến.", "why": "Việc lặp lại đã xảy ra (có 了), nên dùng 又."}, {"q": "这个电影很好看，我想___看一遍。", "o": ["又", "再"], "a": 1, "zh": "这个电影很好看，我想再看一遍。", "py": "Zhège diànyǐng hěn hǎokàn, wǒ xiǎng zài kàn yí biàn.", "vi": "Bộ phim này hay lắm, tôi muốn xem lại một lần nữa.", "why": "Chưa xem lại, là mong muốn ở tương lai, nên dùng 再."}, {"q": "你先吃饭，吃完了___做作业。", "o": ["又", "再"], "a": 1, "zh": "你先吃饭，吃完了再做作业。", "py": "Nǐ xiān chī fàn, chī wán le zài zuò zuòyè.", "vi": "Con ăn cơm trước đi, ăn xong rồi hẵng làm bài tập.", "why": "先…再…: làm việc này trước rồi mới làm việc kia."}, {"q": "怎么___下雨了？", "o": ["又", "再"], "a": 0, "zh": "怎么又下雨了？", "py": "Zěnme yòu xià yǔ le?", "vi": "Sao lại mưa nữa rồi?", "why": "Mưa đã lặp lại và đang xảy ra, nên dùng 又."}]}}, {"no": 9, "zhT": "她的汉语说得跟中国人一样好", "pyT": "Tā de Hànyǔ shuō de gēn Zhōngguó rén yíyàng hǎo", "viT": "Cô ấy nói tiếng Trung hay như người Trung Quốc vậy", "g": [{"t": "越A越B", "f": "越 + động từ + 越 + tính từ / động từ", "d": "Càng… càng…: B thay đổi theo A.", "ex": ["雨越下越大。", "Yǔ yuè xià yuè dà.", "Mưa càng lúc càng to."]}, {"t": "So sánh ngang bằng", "f": "A 跟 B 一样 (+ tính từ)", "d": "A giống B, hoặc A… như B. Có thể phủ định: A跟B不一样.", "ex": ["我的书跟你的一样。", "Wǒ de shū gēn nǐ de yíyàng.", "Sách của tôi giống sách của bạn."]}, {"t": "Bổ ngữ trạng thái + 跟…一样", "f": "(O) + V + 得 + 跟 + B + 一样 + tính từ", "d": "Làm gì đó giỏi, hay… như ai.", "ex": ["他跑得跟我一样快。", "Tā pǎo de gēn wǒ yíyàng kuài.", "Anh ấy chạy nhanh như tôi."]}, {"t": "对……(没)有影响", "f": "A 对 B (没)有影响", "d": "A có (không có) ảnh hưởng đến B.", "ex": ["睡得太少对身体有影响。", "Shuì de tài shǎo duì shēntǐ yǒu yǐngxiǎng.", "Ngủ quá ít ảnh hưởng đến sức khỏe."]}], "s": [["Đi càng lúc càng xa rồi, chúng ta quay về thôi.", "越走越远了，我们回去吧。", "Yuè zǒu yuè yuǎn le, wǒmen huíqu ba.", "越走越远: càng đi càng xa. 回去: quay về (rời khỏi chỗ đang đứng)."], ["Bộ phim đó càng xem càng cảm thấy ý nghĩa.", "那个电影越看越觉得有意思。", "Nàge diànyǐng yuè kàn yuè juéde yǒu yìsi.", "越看越觉得…: càng xem càng thấy… 有意思: hay, thú vị, có ý nghĩa."], ["Bạn gái tôi xinh đẹp như diễn viên vậy.", "我女朋友跟演员一样漂亮。", "Wǒ nǚpéngyou gēn yǎnyuán yíyàng piàoliang.", "A跟B一样 + tính từ: A… như B."], ["Bạn nghỉ ngơi trước đi, tôi sắp ngủ rồi, đây là bài tập cuối cùng.", "你先休息吧，我马上就睡，这是最后一个练习了。", "Nǐ xiān xiūxi ba, wǒ mǎshàng jiù shuì, zhè shì zuìhòu yí ge liànxí le.", "马上就…: sắp, ngay. 先: trước. 最后一个: cái cuối cùng."], ["Tôi khá hiểu cô ấy, cô ấy không sợ đâu, anh yên tâm nhé.", "我比较了解她，她不会害怕的，你放心吧。", "Wǒ bǐjiào liǎojiě tā, tā bú huì hàipà de, nǐ fàngxīn ba.", "比较: khá. 了解: hiểu rõ (người, tình hình). 不会…的: chắc chắn sẽ không."], ["Ngày mai lớp chúng ta có trận thi đấu bóng đá, bạn tham gia được không?", "明天我们班有足球比赛，你能参加吗？", "Míngtiān wǒmen bān yǒu zúqiú bǐsài, nǐ néng cānjiā ma?", "能: có thể (có điều kiện). 参加: tham gia. 我们班: lớp chúng ta."], ["Việc này không ảnh hưởng gì đến tôi đâu, bạn đừng lo.", "这件事对我没有什么影响，你别担心。", "Zhè jiàn shì duì wǒ méiyǒu shénme yǐngxiǎng, nǐ bié dānxīn.", "A对B没有什么影响: A không ảnh hưởng gì đến B. Lượng từ của 事 là 件."], ["Tôi cảm thấy học tiếng Trung càng học càng thấy thú vị.", "我觉得汉语越学越有意思。", "Wǒ juéde Hànyǔ yuè xué yuè yǒu yìsi.", "越学越有意思: càng học càng thú vị."], ["Anh trai tôi nói tiếng Anh giỏi như người Mỹ vậy.", "我哥哥的英语说得跟美国人一样好。", "Wǒ gēge de Yīngyǔ shuō de gēn Měiguó rén yíyàng hǎo.", "V得 + 跟B一样 + tính từ. Tân ngữ 英语 đặt trước động từ để không phải lặp lại 说."], ["Vấn đề này khá khó, anh cho tôi thêm vài ngày được không?", "这个问题比较难，你再给我几天时间，行吗？", "Zhège wèntí bǐjiào nán, nǐ zài gěi wǒ jǐ tiān shíjiān, xíng ma?", "比较难: khá khó. 再给: cho thêm. …行吗？: được không?"]], "dist": {"pair": "认识, 知道 và 了解", "w": [["认识", "rènshi", "Quen biết người; biết mặt chữ, biết đường."], ["知道", "zhīdào", "Biết một thông tin, một sự việc."], ["了解", "liǎojiě", "Hiểu rõ, hiểu sâu về người hoặc tình hình."]], "q": [{"q": "我___他，他是我的同学。", "o": ["认识", "知道", "了解"], "a": 0, "zh": "我认识他，他是我的同学。", "py": "Wǒ rènshi tā, tā shì wǒ de tóngxué.", "vi": "Tôi quen anh ấy, anh ấy là bạn học của tôi.", "why": "Quen biết một người, nên dùng 认识."}, {"q": "你___明天几点开会吗？", "o": ["认识", "知道", "了解"], "a": 1, "zh": "你知道明天几点开会吗？", "py": "Nǐ zhīdào míngtiān jǐ diǎn kāihuì ma?", "vi": "Bạn có biết mai mấy giờ họp không?", "why": "Biết một thông tin (giờ họp), nên dùng 知道."}, {"q": "我们在一起五年了，我很___她。", "o": ["认识", "知道", "了解"], "a": 2, "zh": "我们在一起五年了，我很了解她。", "py": "Wǒmen zài yìqǐ wǔ nián le, wǒ hěn liǎojiě tā.", "vi": "Chúng tôi ở bên nhau năm năm rồi, tôi rất hiểu cô ấy.", "why": "Hiểu rõ tính cách một người, nên dùng 了解."}, {"q": "这个字你___吗？", "o": ["认识", "知道", "了解"], "a": 0, "zh": "这个字你认识吗？", "py": "Zhège zì nǐ rènshi ma?", "vi": "Chữ này bạn có biết không?", "why": "Biết mặt chữ (đọc được chữ) dùng 认识."}]}}, {"no": 10, "zhT": "数学比历史难多了", "pyT": "Shùxué bǐ lìshǐ nán duō le", "viT": "Môn toán khó hơn môn lịch sử nhiều", "g": [{"t": "So sánh hơn với 比", "f": "A 比 B + tính từ (+ 多了 / 得多 / 一点儿)", "d": "Muốn nói hơn nhiều thêm 多了, hơn một chút thêm 一点儿 sau tính từ. Không dùng 很, 非常, 太 trong câu 比; muốn nhấn mạnh dùng 更 hoặc 还.", "ex": ["今天比昨天冷一点儿。", "Jīntiān bǐ zuótiān lěng yìdiǎnr.", "Hôm nay lạnh hơn hôm qua một chút."]}, {"t": "So sánh kém với 没有", "f": "A 没有 B (那么 / 这么) + tính từ", "d": "A không… bằng B.", "ex": ["我没有他那么高。", "Wǒ méiyǒu tā nàme gāo.", "Tôi không cao bằng anh ấy."]}, {"t": "Số ước lượng", "f": "Hai số liền nhau: 两三个, 三四百, 二三十", "d": "Nói số gần đúng bằng cách ghép hai số liền nhau, không có dấu gạch ở giữa.", "ex": ["我等了二三十分钟。", "Wǒ děng le èr-sānshí fēnzhōng.", "Tôi đợi khoảng hai ba chục phút."]}, {"t": "Câu hỏi chính phản", "f": "Tính từ + 不 + tính từ", "d": "安静不安静, 方便不方便: có… hay không.", "ex": ["这个地方方便不方便？", "Zhège dìfang fāngbiàn bu fāngbiàn?", "Chỗ này có tiện không?"]}], "s": [["Tôi thấy môn toán khó hơn môn lịch sử nhiều.", "我觉得数学比历史难多了。", "Wǒ juéde shùxué bǐ lìshǐ nán duō le.", "A比B + tính từ + 多了: hơn nhiều."], ["Gần đây dưa hấu rẻ hơn táo nhiều.", "最近西瓜比苹果便宜多了。", "Zuìjìn xīguā bǐ píngguǒ piányi duō le.", "A比B + tính từ + 多了. Không nói 比苹果很便宜."], ["Ừ đúng rồi, bạn gái tôi không xinh bằng bạn gái cậu đâu.", "是啊，我女朋友没有你女朋友漂亮。", "Shì a, wǒ nǚpéngyou méiyǒu nǐ nǚpéngyou piàoliang.", "A没有B + tính từ: A không… bằng B."], ["Cái áo này ở đây bán ba, bốn trăm tệ, chỗ tôi chỉ hai, ba trăm tệ.", "这件衣服在这儿卖三四百块，我那儿只卖两三百块。", "Zhè jiàn yīfu zài zhèr mài sān-sìbǎi kuài, wǒ nàr zhǐ mài liǎng-sānbǎi kuài.", "Số ước lượng 三四百, 两三百. 我那儿: chỗ tôi (người + 这儿/那儿 chỉ nơi của ai đó)."], ["Từ nhà tôi đến đây đi xe máy chỉ mất khoảng 20–30 phút.", "从我家到这儿骑摩托车只要二三十分钟。", "Cóng wǒ jiā dào zhèr qí mótuōchē zhǐ yào èr-sānshí fēnzhōng.", "二三十: hai ba chục (ước lượng). Xe có yên ngồi kiểu cưỡi (xe máy, xe đạp) dùng 骑."], ["Khi mua nhà, phải chú ý xem môi trường có yên tĩnh không, có tiện lợi không.", "买房子的时候，要注意环境安静不安静，方便不方便。", "Mǎi fángzi de shíhou, yào zhùyì huánjìng ānjìng bu ānjìng, fāngbiàn bu fāngbiàn.", "Câu hỏi chính phản 安静不安静 làm tân ngữ của 注意. 要: phải, cần."], ["Gần nhà tôi có hai, ba trạm xe buýt, mỗi ngày tôi đều đi xe buýt đi làm.", "我家附近有两三个公共汽车站，我每天都坐公共汽车上班。", "Wǒ jiā fùjìn yǒu liǎng-sān ge gōnggòng qìchē zhàn, wǒ měi tiān dōu zuò gōnggòng qìchē shàngbān.", "两三个: hai ba cái (dùng 两 chứ không dùng 二). 坐车 + 上班: đi xe đi làm."], ["Thể dục, lịch sử, toán… môn nào tôi cũng thích.", "体育、历史、数学……什么课我都喜欢。", "Tǐyù, lìshǐ, shùxué…… shénme kè wǒ dōu xǐhuan.", "什么 + danh từ + 都: …nào cũng. Tân ngữ đưa lên trước chủ ngữ."], ["Bạn với anh trai bạn, ai cao hơn?", "你跟你哥哥，谁更高？", "Nǐ gēn nǐ gēge, shéi gèng gāo?", "Hỏi ai hơn dùng 谁更 + tính từ. Không nói 谁很高."], ["Tôi cảm thấy bạn học tốt hơn tôi nhiều.", "我觉得你学得比我好多了。", "Wǒ juéde nǐ xué de bǐ wǒ hǎo duō le.", "V得 + 比B + tính từ + 多了. Cũng nói được: 你比我学得好多了."], ["Cuối tuần bạn thường ôn tập trong bao lâu?", "周末你一般复习多长时间？", "Zhōumò nǐ yìbān fùxí duō cháng shíjiān?", "多长时间 đứng SAU động từ (thời lượng). 一般: thường, thông thường."]], "dist": {"pair": "比, 没有 và 跟……一样", "w": [["比", "bǐ", "A hơn B. Không đi với 很 / 非常 / 太."], ["没有", "méiyǒu", "A không… bằng B: A没有B(那么)+tính từ."], ["跟……一样", "gēn… yíyàng", "A giống B, A… như B."]], "q": [{"q": "今天___昨天热多了。", "o": ["比", "没有", "跟"], "a": 0, "zh": "今天比昨天热多了。", "py": "Jīntiān bǐ zuótiān rè duō le.", "vi": "Hôm nay nóng hơn hôm qua nhiều.", "why": "Có 多了 sau tính từ, là so sánh hơn, nên dùng 比."}, {"q": "我的房间___你的房间那么大。", "o": ["比", "没有", "跟"], "a": 1, "zh": "我的房间没有你的房间那么大。", "py": "Wǒ de fángjiān méiyǒu nǐ de fángjiān nàme dà.", "vi": "Phòng của tôi không to bằng phòng của bạn.", "why": "Có 那么 + tính từ, là so sánh kém, nên dùng 没有."}, {"q": "我的手机___你的一样。", "o": ["比", "没有", "跟"], "a": 2, "zh": "我的手机跟你的一样。", "py": "Wǒ de shǒujī gēn nǐ de yíyàng.", "vi": "Điện thoại của tôi giống của bạn.", "why": "Có 一样 ở cuối, nên dùng 跟."}, {"q": "他比我___高。", "o": ["很", "非常", "更"], "a": 2, "zh": "他比我更高。", "py": "Tā bǐ wǒ gèng gāo.", "vi": "Anh ấy cao hơn tôi.", "why": "Trong câu 比 không dùng 很, 非常. Muốn nhấn mạnh dùng 更 (hoặc 还)."}]}}, {"no": 11, "zhT": "别忘了把空调关了", "pyT": "Bié wàngle bǎ kōngtiáo guān le", "viT": "Đừng quên tắt điều hòa nhé!", "g": [{"t": "Câu chữ 把 (dạng 把…V了)", "f": "主语 + 把 + tân ngữ + động từ + 了", "d": "Nhấn vào việc xử lý một vật cụ thể và kết quả của nó: tắt đi, quên mất, bán đi… Tân ngữ phải là vật đã xác định. Phủ định đặt 没 / 别 trước 把.", "ex": ["我把作业做完了。", "Wǒ bǎ zuòyè zuò wán le.", "Tôi làm xong bài tập rồi."]}, {"t": "别忘了 / 记得", "f": "别忘了 + V ／ 记得 + V", "d": "Nhắc ai đó nhớ làm việc gì.", "ex": ["记得给我打电话。", "Jìde gěi wǒ dǎ diànhuà.", "Nhớ gọi điện cho tôi nhé."]}, {"t": "…以前 / …以后 / …的时候", "f": "Sự việc + 以前 / 以后 / 的时候", "d": "Trước khi / sau khi / khi. Cả ba đều đứng SAU cụm sự việc, ngược với tiếng Việt.", "ex": ["睡觉以前别喝咖啡。", "Shuìjiào yǐqián bié hē kāfēi.", "Trước khi ngủ đừng uống cà phê."]}, {"t": "顺便", "f": "顺便 + V", "d": "Tiện thể, nhân tiện làm việc gì.", "ex": ["你去超市的时候，顺便帮我买瓶水。", "Nǐ qù chāoshì de shíhou, shùnbiàn bāng wǒ mǎi píng shuǐ.", "Bạn đi siêu thị thì tiện mua giúp tôi chai nước."]}], "s": [["Trước khi đi học đừng quên giặt quần áo nhé!", "去上课以前，别忘了把衣服洗了！", "Qù shàngkè yǐqián, bié wàngle bǎ yīfu xǐ le!", "…以前: trước khi (đứng sau). 别忘了 + 把衣服洗了: câu chữ 把, nhấn việc giặt cho xong."], ["Sau khi cuộc họp kết thúc, nhớ tắt điều hòa nhé.", "会议结束以后，记得把空调关了。", "Huìyì jiéshù yǐhòu, jìde bǎ kōngtiáo guān le.", "…以后: sau khi. 记得: nhớ (làm gì). 把空调关了: tắt điều hòa đi."], ["Hôm qua tôi quên mất sinh nhật bạn gái rồi, giờ phải làm sao đây?", "昨天我把女朋友的生日忘了，现在怎么办？", "Zuótiān wǒ bǎ nǚpéngyou de shēngrì wàng le, xiànzài zěnme bàn?", "把…忘了: quên mất (kết quả là mất khỏi trí nhớ). 怎么办: làm sao đây."], ["Tôi đã có một cái máy tính, nhưng giờ muốn bán để mua cái tốt hơn.", "我已经有一台电脑了，但是现在想把它卖了，买一台更好的。", "Wǒ yǐjīng yǒu yì tái diànnǎo le, dànshì xiànzài xiǎng bǎ tā mài le, mǎi yì tái gèng hǎo de.", "Động từ năng nguyện (想) đứng TRƯỚC 把. Lượng từ của máy tính là 台. 更好的: cái tốt hơn."], ["Trước khi ăn cơm, đừng quên rửa tay.", "吃饭以前，别忘了洗手。", "Chī fàn yǐqián, bié wàngle xǐ shǒu.", "…以前 đứng sau sự việc. 别忘了 + động từ."], ["Nếu một ngày nào đó em đột nhiên biến mất, anh biết phải làm sao?", "如果有一天我突然不见了，你知道怎么办吗？", "Rúguǒ yǒu yì tiān wǒ tūrán bú jiàn le, nǐ zhīdào zěnme bàn ma?", "如果: nếu. 有一天: một ngày nào đó. 不见了: biến mất, không thấy đâu nữa."], ["Khoảng 5 giờ chiều tôi sẽ tới Bắc Kinh, bạn nhớ ra đón tôi nhé!", "下午五点左右我到北京，你记得来接我啊！", "Xiàwǔ wǔ diǎn zuǒyòu wǒ dào Běijīng, nǐ jìde lái jiē wǒ a!", "左右 sau mốc giờ: khoảng. 来接我: đến đón tôi. Thời gian đứng trước động từ."], ["Lát nữa khi bạn rời khỏi văn phòng, nhớ tắt đèn nha.", "一会儿你离开办公室的时候，记得把灯关了。", "Yíhuìr nǐ líkāi bàngōngshì de shíhou, jìde bǎ dēng guān le.", "一会儿: lát nữa. …的时候: khi. 把灯关了: tắt đèn đi."], ["Chiều nay tôi đi thư viện với bạn, bạn mượn sách còn tôi tiện thể trả sách.", "今天下午我跟你一起去图书馆，你借书，我顺便还书。", "Jīntiān xiàwǔ wǒ gēn nǐ yìqǐ qù túshūguǎn, nǐ jiè shū, wǒ shùnbiàn huán shū.", "借: mượn. 还 đọc là huán: trả. 顺便: tiện thể."], ["Còn thiếu một người, chúng ta đợi thêm 15 phút nữa đi.", "还差一个人，我们再等十五分钟吧。", "Hái chà yí ge rén, wǒmen zài děng shíwǔ fēnzhōng ba.", "差: thiếu. 再 + động từ + thời lượng: làm thêm bao lâu nữa."]], "dist": {"pair": "借 và 还", "w": [["借", "jiè", "Mượn, hoặc cho mượn. Cho ai mượn: 借给 + người."], ["还", "huán", "Trả lại (đồ đã mượn). Trả cho ai: 还给 + người. Lưu ý đây là chữ 还 đọc huán, khác 还 hái (còn, vẫn)."]], "q": [{"q": "我可以___你的词典吗？", "o": ["借", "还"], "a": 0, "zh": "我可以借你的词典吗？", "py": "Wǒ kěyǐ jiè nǐ de cídiǎn ma?", "vi": "Tôi mượn từ điển của bạn được không?", "why": "Hỏi mượn đồ, nên dùng 借."}, {"q": "这本书我看完了，明天___给你。", "o": ["借", "还"], "a": 1, "zh": "这本书我看完了，明天还给你。", "py": "Zhè běn shū wǒ kàn wán le, míngtiān huán gěi nǐ.", "vi": "Cuốn sách này tôi đọc xong rồi, mai trả bạn.", "why": "Đọc xong rồi đem trả, nên dùng 还 (huán)."}, {"q": "他把自行车___给我了，我用完就还他。", "o": ["借", "还"], "a": 0, "zh": "他把自行车借给我了，我用完就还他。", "py": "Tā bǎ zìxíngchē jiè gěi wǒ le, wǒ yòng wán jiù huán tā.", "vi": "Anh ấy cho tôi mượn xe đạp, tôi dùng xong sẽ trả.", "why": "借给 + người: cho ai mượn."}, {"q": "图书馆的书看完了，别忘了___。", "o": ["借", "还"], "a": 1, "zh": "图书馆的书看完了，别忘了还。", "py": "Túshūguǎn de shū kàn wán le, bié wàngle huán.", "vi": "Đọc xong sách thư viện thì đừng quên trả.", "why": "Trả sách đã mượn, nên dùng 还."}]}}, {"no": 12, "zhT": "把重要的东西放在我这儿吧", "pyT": "Bǎ zhòngyào de dōngxi fàng zài wǒ zhèr ba", "viT": "Hãy để những đồ quan trọng ở chỗ tôi đi", "g": [{"t": "把 + tân ngữ + V + 在 / 到 / 给", "f": "把 + O + 放在 / 忘在 + nơi chốn ／ 把 + O + 还给 / 交给 + người", "d": "Vật được đưa đến đâu, hoặc được giao cho ai. Với những động từ này, gần như bắt buộc dùng câu chữ 把.", "ex": ["我把钥匙放在桌子上了。", "Wǒ bǎ yàoshi fàng zài zhuōzi shang le.", "Tôi để chìa khóa trên bàn rồi."]}, {"t": "就 và 才", "f": "Thời gian + 就 + V + 了 ／ Thời gian + 才 + V", "d": "就: sớm, nhanh hơn dự kiến, thường có 了. 才: muộn, chậm hơn dự kiến, không có 了 cuối câu.", "ex": ["他六点就起床了，我八点才起床。", "Tā liù diǎn jiù qǐchuáng le, wǒ bā diǎn cái qǐchuáng.", "Anh ấy 6 giờ đã dậy, tôi 8 giờ mới dậy."]}, {"t": "怎么 + 才 / 还没", "f": "你怎么 + 现在才… / 还没…？", "d": "Trách nhẹ: sao giờ mới…, sao vẫn chưa…", "ex": ["你怎么现在才起床？", "Nǐ zěnme xiànzài cái qǐchuáng?", "Sao giờ bạn mới dậy?"]}], "s": [["Con đem trái cây cất vào tủ lạnh đi.", "你把水果放在冰箱里吧。", "Nǐ bǎ shuǐguǒ fàng zài bīngxiāng li ba.", "把 + O + 放在 + nơi chốn. Sau danh từ đồ vật phải thêm 里 / 上 để thành nơi chốn: 冰箱里."], ["Xe chạy lúc 8 giờ rồi, sao giờ bạn mới đến?", "车八点就开了，你怎么现在才来？", "Chē bā diǎn jiù kāi le, nǐ zěnme xiànzài cái lái?", "就…了: đã (sớm). 才 + V: mới (muộn), không thêm 了."], ["Tôi đến từ lúc 7 giờ, nhưng quên đồ ở nhà nên phải quay về lấy.", "我七点就到了，但是把东西忘在家里了，所以又回去拿了。", "Wǒ qī diǎn jiù dào le, dànshì bǎ dōngxi wàng zài jiā li le, suǒyǐ yòu huíqu ná le.", "七点就到了: 就 chỉ sớm. 把东西忘在家里: quên đồ ở nhà. 又回去: lại quay về (đã xảy ra)."], ["Em để quên hộ chiếu trong vali rồi.", "我把护照忘在行李箱里了。", "Wǒ bǎ hùzhào wàng zài xínglixiāng li le.", "把 + O + 忘在 + nơi chốn: để quên ở đâu."], ["Con đã đưa tiền trả cho anh ấy rồi.", "我已经把钱还给他了。", "Wǒ yǐjīng bǎ qián huán gěi tā le.", "已经 đứng trước 把. 还给 + người: trả cho ai."], ["Bạn đừng tức giận nữa, tôi sẽ đến trong 10 phút nữa.", "你别生气了，我十分钟以后就到。", "Nǐ bié shēngqì le, wǒ shí fēnzhōng yǐhòu jiù dào.", "别…了: đừng… nữa. 十分钟以后就到: 10 phút nữa là đến (就 chỉ nhanh)."], ["Em để hộ chiếu vào vali chưa đó?", "你把护照放在行李箱里了吗？", "Nǐ bǎ hùzhào fàng zài xínglixiāng li le ma?", "Câu hỏi của câu chữ 把: thêm 了吗 cuối câu."], ["Gần trường có ngân hàng Trung Quốc không?", "学校附近有中国银行吗？", "Xuéxiào fùjìn yǒu Zhōngguó Yínháng ma?", "Nơi chốn + 有 + vật: ở đâu có gì."], ["Chúng tôi cần thay bàn và ghế mới.", "我们要换新的桌子和椅子。", "Wǒmen yào huàn xīn de zhuōzi hé yǐzi.", "换: thay, đổi. 要: cần. 和 nối hai danh từ, không nối hai câu."], ["Cuộc họp bắt đầu lâu rồi, sao giờ bạn vẫn chưa đến?", "会议早就开始了，你怎么现在还没到？", "Huìyì zǎo jiù kāishǐ le, nǐ zěnme xiànzài hái méi dào?", "早就…了: từ lâu đã. 怎么还没…: sao vẫn chưa…"]], "dist": {"pair": "就 và 才", "w": [["就", "jiù", "Sớm, nhanh, dễ hơn người nói nghĩ. Thường có 了 cuối câu."], ["才", "cái", "Muộn, chậm, khó hơn người nói nghĩ. Không có 了 cuối câu."]], "q": [{"q": "电影七点开始，他六点___到了。", "o": ["就", "才"], "a": 0, "zh": "电影七点开始，他六点就到了。", "py": "Diànyǐng qī diǎn kāishǐ, tā liù diǎn jiù dào le.", "vi": "Phim 7 giờ bắt đầu, 6 giờ anh ấy đã đến rồi.", "why": "Đến sớm hơn giờ chiếu, có 了 cuối câu, nên dùng 就."}, {"q": "我等了你一个小时，你怎么现在___来？", "o": ["就", "才"], "a": 1, "zh": "我等了你一个小时，你怎么现在才来？", "py": "Wǒ děng le nǐ yí ge xiǎoshí, nǐ zěnme xiànzài cái lái?", "vi": "Tôi đợi bạn một tiếng rồi, sao giờ bạn mới đến?", "why": "Đến muộn, người nói không vui, nên dùng 才."}, {"q": "他学了三个月___能用汉语聊天了。", "o": ["就", "才"], "a": 0, "zh": "他学了三个月就能用汉语聊天了。", "py": "Tā xué le sān ge yuè jiù néng yòng Hànyǔ liáotiān le.", "vi": "Cậu ấy học có ba tháng mà đã nói chuyện được bằng tiếng Trung.", "why": "Nhanh hơn mong đợi, có 了 cuối câu, nên dùng 就."}, {"q": "昨天晚上我十二点___睡觉。", "o": ["就", "才"], "a": 1, "zh": "昨天晚上我十二点才睡觉。", "py": "Zuótiān wǎnshang wǒ shí'èr diǎn cái shuìjiào.", "vi": "Tối qua 12 giờ tôi mới đi ngủ.", "why": "Ngủ muộn, không có 了 cuối câu, nên dùng 才."}]}}, {"no": 13, "zhT": "我是走回来的", "pyT": "Wǒ shì zǒu huílai de", "viT": "Anh đi bộ về", "g": [{"t": "Bổ ngữ xu hướng kép", "f": "V + 回 / 进 / 出 / 上 / 下 / 过 / 起 + 来 / 去", "d": "来: hướng về phía người nói. 去: rời xa người nói. Ví dụ: 买回来 (mua mang về đây), 走过去 (đi qua bên đó), 站起来 (đứng dậy), 坐下来 (ngồi xuống).", "ex": ["他从楼上走下来了。", "Tā cóng lóu shang zǒu xiàlai le.", "Anh ấy từ trên lầu đi xuống."]}, {"t": "Cấu trúc 是……的", "f": "主语 + 是 + (thời gian / cách thức / nơi chốn) + V + 的", "d": "Nhấn mạnh thời gian, cách thức, nơi chốn của một việc ĐÃ xảy ra.", "ex": ["我是坐飞机来的。", "Wǒ shì zuò fēijī lái de.", "Tôi đi máy bay đến."]}, {"t": "V + V + 累 (bổ ngữ kết quả)", "f": "(V + O) + V + 累 / 饱 / 完 + 了", "d": "Làm gì đến mức mệt, no… Khi có tân ngữ thì lặp lại động từ.", "ex": ["我看书看累了。", "Wǒ kàn shū kàn lèi le.", "Tôi đọc sách đến mệt rồi."]}, {"t": "变得 + tính từ", "f": "主语 + 变得 + tính từ", "d": "Trở nên…", "ex": ["天气变得很冷。", "Tiānqì biàn de hěn lěng.", "Thời tiết trở nên rất lạnh."]}], "s": [["Cuối cùng ba cũng mua quà về rồi.", "爸爸终于把礼物买回来了。", "Bàba zhōngyú bǎ lǐwù mǎi huílai le.", "终于: cuối cùng cũng. 买回来: mua mang về (bổ ngữ xu hướng kép)."], ["Em trai tôi vừa xem tivi vừa làm bài tập.", "我弟弟一边看电视一边做作业。", "Wǒ dìdi yìbiān kàn diànshì yìbiān zuò zuòyè.", "一边…一边…: hai hành động cùng lúc."], ["Hôm nay trời mưa nên tôi phải đi xe buýt về.", "今天下雨了，所以我是坐公共汽车回来的。", "Jīntiān xià yǔ le, suǒyǐ wǒ shì zuò gōnggòng qìchē huílai de.", "是…的 nhấn mạnh cách thức đã về (bằng xe buýt)."], ["Có anh ấy bên cạnh, cuộc sống của tôi trở nên rất ý nghĩa.", "有他在我身边，我的生活变得很有意思。", "Yǒu tā zài wǒ shēnbiān, wǒ de shēnghuó biàn de hěn yǒu yìsi.", "变得 + tính từ: trở nên… 在…身边: ở bên cạnh ai."], ["Lúc mới gặp cô ấy, tôi không biết cô ấy đã có bạn trai.", "刚认识她的时候，我不知道她已经有男朋友了。", "Gāng rènshi tā de shíhou, wǒ bù zhīdào tā yǐjīng yǒu nánpéngyou le.", "刚…的时候: lúc mới… 已经…了: đã… rồi."], ["Bạn thích học toán hơn hay học lịch sử hơn?", "你更喜欢学数学还是学历史？", "Nǐ gèng xǐhuan xué shùxué háishi xué lìshǐ?", "Câu hỏi lựa chọn dùng 还是. \"Thích… hơn\" dịch là 更喜欢."], ["Làm bài tập mệt rồi thì bạn có thể đứng lên vận động một chút.", "做作业做累了，你可以站起来运动运动。", "Zuò zuòyè zuò lèi le, nǐ kěyǐ zhàn qǐlai yùndòng yùndòng.", "做作业做累了: lặp động từ khi có tân ngữ. 站起来: đứng dậy. 运动运动: lặp động từ, làm một chút."], ["Bạn giúp tôi mua một ly cà phê mang về nhé!", "你帮我买一杯咖啡带回来吧！", "Nǐ bāng wǒ mǎi yì bēi kāfēi dài huílai ba!", "带回来: mang về (phía người nói). 帮 + người + V: giúp ai làm gì."], ["Tôi rất thích vừa lái xe vừa nghe nhạc.", "我很喜欢一边开车一边听音乐。", "Wǒ hěn xǐhuan yìbiān kāichē yìbiān tīng yīnyuè.", "一边…一边… làm tân ngữ của 喜欢. Lái ô tô dùng 开车."], ["Mình mệt quá rồi, đừng chạy nữa, đi đến gốc cây kia ngồi nghỉ một lát nhé.", "我太累了，别跑了，我们走到那棵树下，坐下来休息一会儿吧。", "Wǒ tài lèi le, bié pǎo le, wǒmen zǒu dào nà kē shù xià, zuò xiàlai xiūxi yíhuìr ba.", "走到 + nơi chốn: đi đến. 坐下来: ngồi xuống. 一会儿 sau động từ: một lát. Lượng từ của cây là 棵."]], "dist": {"pair": "来 và 去 trong bổ ngữ xu hướng", "w": [["来", "lai", "Hành động hướng VỀ PHÍA người nói."], ["去", "qu", "Hành động RỜI XA người nói."]], "q": [{"ctx": "Bạn đang ở nhà, gọi điện cho mẹ đang ở ngoài.", "q": "妈妈，你什么时候回___？", "o": ["来", "去"], "a": 0, "zh": "妈妈，你什么时候回来？", "py": "Māma, nǐ shénme shíhou huílai?", "vi": "Mẹ ơi, khi nào mẹ về?", "why": "Mẹ về phía nhà, nơi người nói đang ở, nên dùng 来."}, {"ctx": "Bạn đang chơi ở nhà bạn bè.", "q": "太晚了，我要回家___了。", "o": ["来", "去"], "a": 1, "zh": "太晚了，我要回家去了。", "py": "Tài wǎn le, wǒ yào huí jiā qu le.", "vi": "Muộn quá rồi, mình phải về nhà đây.", "why": "Người nói rời khỏi chỗ đang đứng để về nhà, nên dùng 去."}, {"ctx": "Bạn ngồi trong lớp, gọi bạn đang đứng ngoài cửa.", "q": "你进___坐吧。", "o": ["来", "去"], "a": 0, "zh": "你进来坐吧。", "py": "Nǐ jìnlai zuò ba.", "vi": "Bạn vào đây ngồi đi.", "why": "Người kia đi vào phía người nói, nên dùng 来."}, {"ctx": "Bạn và bạn mình đang đứng bên này đường.", "q": "那边有一个商店，我们走过___看看吧。", "o": ["来", "去"], "a": 1, "zh": "那边有一个商店，我们走过去看看吧。", "py": "Nàbiān yǒu yí ge shāngdiàn, wǒmen zǒu guòqu kànkan ba.", "vi": "Bên kia có một cửa hàng, mình đi qua đó xem thử đi.", "why": "Đi từ chỗ đang đứng sang bên kia, rời xa vị trí hiện tại, nên dùng 去."}]}}, {"no": 14, "zhT": "你把水果拿过来", "pyT": "Nǐ bǎ shuǐguǒ ná guòlai", "viT": "Cậu mang trái cây đến đây", "g": [{"t": "把 + tân ngữ + bổ ngữ xu hướng", "f": "把 + O + V + 过来 / 过去 / 回来 / 进去…", "d": "Chuyển vật theo một hướng. 拿过来: mang lại đây, 拿过去: mang qua đó.", "ex": ["请把椅子搬过来。", "Qǐng bǎ yǐzi bān guòlai.", "Làm ơn chuyển cái ghế lại đây."]}, {"t": "把 + tân ngữ + bổ ngữ kết quả", "f": "把 + O + V + 干净 / 完 / 好", "d": "Làm cho vật đạt kết quả nào đó: giặt sạch, dọn sạch, làm xong.", "ex": ["我把房间打扫干净了。", "Wǒ bǎ fángjiān dǎsǎo gānjìng le.", "Tôi dọn phòng sạch sẽ rồi."]}, {"t": "Trình tự hành động", "f": "先…，再 / 然后…，最后…", "d": "Trước tiên… rồi / sau đó… cuối cùng…", "ex": ["我们先吃饭，然后去看电影。", "Wǒmen xiān chī fàn, ránhòu qù kàn diànyǐng.", "Chúng ta ăn cơm trước, sau đó đi xem phim."]}], "s": [["Bạn mang bài tập nộp cho cô giáo đi nhé.", "你把作业交给老师吧。", "Nǐ bǎ zuòyè jiāo gěi lǎoshī ba.", "把 + O + 交给 + người: nộp cho ai."], ["Chúng ta nghỉ ngơi một chút rồi hẵng tiếp tục leo núi nha.", "我们先休息一下，再继续爬山吧。", "Wǒmen xiān xiūxi yíxià, zài jìxù pá shān ba.", "先…再…: …trước rồi mới… 继续: tiếp tục."], ["Trước tiên bạn giặt sạch quần áo, sau đó chúng ta đi chợ mua đồ.", "你先把衣服洗干净，然后我们去超市买东西。", "Nǐ xiān bǎ yīfu xǐ gānjìng, ránhòu wǒmen qù chāoshì mǎi dōngxi.", "先…然后…. 先 đứng trước 把. 洗干净: giặt sạch (bổ ngữ kết quả)."], ["Bạn lấy trái cây trong tủ lạnh mang qua đây giúp mình nhé.", "你把冰箱里的水果拿过来吧。", "Nǐ bǎ bīngxiāng li de shuǐguǒ ná guòlai ba.", "把 + O + 拿过来: mang lại đây. 冰箱里的: ở trong tủ lạnh (định ngữ)."], ["Chúng ta ngắm trăng trước rồi vào nhà xem chương trình Tết được không?", "我们先看月亮，然后进去看春节晚会，好吗？", "Wǒmen xiān kàn yuèliang, ránhòu jìnqu kàn Chūnjié wǎnhuì, hǎo ma?", "先…然后…. 进去: đi vào (người nói đang ở ngoài). 春节晚会: chương trình đón Tết."], ["Bạn có thể giúp tôi dọn dẹp văn phòng sạch sẽ không?", "你能帮我把办公室打扫干净吗？", "Nǐ néng bāng wǒ bǎ bàngōngshì dǎsǎo gānjìng ma?", "能 và 帮我 đứng trước 把. 打扫干净: dọn sạch."], ["Bạn có rảnh không? Tôi cần mang chỗ trái cây này đi rửa sạch.", "你有空吗？我要把这些水果拿去洗干净。", "Nǐ yǒu kòng ma? Wǒ yào bǎ zhèxiē shuǐguǒ ná qù xǐ gānjìng.", "有空: rảnh. 要 đứng trước 把. 拿去 + V: mang đi làm gì."], ["Tôi vẫn chưa nấu xong bữa tối đâu.", "我还没做完晚饭呢。", "Wǒ hái méi zuò wán wǎnfàn ne.", "还没 + V + 完 + 呢: vẫn chưa làm xong. Nấu bữa ăn dùng 做饭."], ["Muốn đến đây, bạn phải đi máy bay trước, sau đó ngồi xe buýt, cuối cùng đi bộ.", "要到这儿来，你得先坐飞机，然后坐公共汽车，最后走路。", "Yào dào zhèr lái, nǐ děi xiān zuò fēijī, ránhòu zuò gōnggòng qìchē, zuìhòu zǒulù.", "先…然后…最后…: trình tự ba bước. 得 (děi): phải."], ["Mấy quyển sách này tôi đọc xong rồi, bạn mang trả thư viện giúp tôi nha.", "这几本书我看完了，你帮我把它们还给图书馆吧。", "Zhè jǐ běn shū wǒ kàn wán le, nǐ bāng wǒ bǎ tāmen huán gěi túshūguǎn ba.", "帮我 + 把 + O + 还给…: giúp tôi trả cho… 它们: chúng nó (chỉ đồ vật)."]], "dist": {"pair": "拿, 带 và 送", "w": [["拿", "ná", "Cầm, lấy bằng tay, thường ở khoảng cách gần."], ["带", "dài", "Mang theo bên mình khi đi đâu đó; dẫn người đi."], ["送", "sòng", "Tặng; đưa, tiễn ai; giao đồ đến."]], "q": [{"q": "你帮我把桌子上的杯子___过来。", "o": ["拿", "带", "送"], "a": 0, "zh": "你帮我把桌子上的杯子拿过来。", "py": "Nǐ bāng wǒ bǎ zhuōzi shang de bēizi ná guòlai.", "vi": "Bạn lấy giúp mình cái cốc trên bàn lại đây.", "why": "Động tác dùng tay lấy vật ở gần, nên dùng 拿."}, {"q": "明天出门记得___伞。", "o": ["拿", "带", "送"], "a": 1, "zh": "明天出门记得带伞。", "py": "Míngtiān chūmén jìde dài sǎn.", "vi": "Mai ra ngoài nhớ mang ô.", "why": "Mang theo bên mình khi ra ngoài, nên dùng 带."}, {"q": "过生日的时候，朋友___了我一本书。", "o": ["拿", "带", "送"], "a": 2, "zh": "过生日的时候，朋友送了我一本书。", "py": "Guò shēngrì de shíhou, péngyou sòng le wǒ yì běn shū.", "vi": "Hồi sinh nhật, bạn tặng tôi một cuốn sách.", "why": "Tặng quà, nên dùng 送."}, {"q": "周末我___孩子去公园玩儿。", "o": ["拿", "带", "送"], "a": 1, "zh": "周末我带孩子去公园玩儿。", "py": "Zhōumò wǒ dài háizi qù gōngyuán wánr.", "vi": "Cuối tuần tôi dẫn con đi công viên chơi.", "why": "Dẫn người đi cùng mình, nên dùng 带."}]}}, {"no": 15, "zhT": "其他都没什么问题", "pyT": "Qítā dōu méi shénme wèntí", "viT": "Những câu khác đều không có vấn đề gì", "g": [{"t": "除了……以外，都……", "f": "除了 A (以外)，(其他) + 都 + …", "d": "Loại A ra, những cái còn lại đều… A KHÔNG nằm trong nhóm được nói tới.", "ex": ["除了小王以外，大家都来了。", "Chúle Xiǎo Wáng yǐwài, dàjiā dōu lái le.", "Trừ Tiểu Vương ra, mọi người đều đến rồi."]}, {"t": "除了……以外，还 / 也……", "f": "除了 A (以外)，还 / 也 + B", "d": "Ngoài A ra còn có B. A VẪN được tính, B là phần thêm vào.", "ex": ["除了汉语以外，我还学英语。", "Chúle Hànyǔ yǐwài, wǒ hái xué Yīngyǔ.", "Ngoài tiếng Trung ra, tôi còn học tiếng Anh."]}, {"t": "能 + động từ", "f": "能 + V", "d": "Có thể, có khả năng hoặc có điều kiện để làm gì.", "ex": ["能帮我一下吗？", "Néng bāng wǒ yíxià ma?", "Có thể giúp tôi một chút không?"]}, {"t": "跟……一样", "f": "A 跟 B 一样", "d": "Giống như B. 跟真的一样: y như thật.", "ex": ["这个画儿跟真的一样。", "Zhège huàr gēn zhēn de yíyàng.", "Bức tranh này y như thật."]}], "s": [["Trừ tiếng Trung ra, các môn ngoại ngữ khác tôi đều có thể tự học.", "除了汉语以外，其他外语我都能自学。", "Chúle Hànyǔ yǐwài, qítā wàiyǔ wǒ dōu néng zìxué.", "除了…以外，其他…都…: loại tiếng Trung ra. 自学: tự học."], ["Ngoài Trung Quốc ra, tôi còn từng đi Mỹ, Nhật Bản và Anh nữa.", "除了中国以外，我还去过美国、日本和英国。", "Chúle Zhōngguó yǐwài, wǒ hái qù guo Měiguó, Rìběn hé Yīngguó.", "除了…以外，还…: ngoài ra còn (Trung Quốc vẫn tính). 去过: đã từng đi. 和 đứng trước danh từ cuối cùng."], ["Bên ngoài lạnh lắm, bạn nhớ mặc thêm áo ấm nhé!", "外面很冷，你记得多穿点儿衣服！", "Wàimiàn hěn lěng, nǐ jìde duō chuān diǎnr yīfu!", "多 + V + 点儿: làm thêm một chút. 记得: nhớ."], ["Ngoài văn hóa Trung Quốc, tôi còn thích tìm hiểu về lịch sử và ẩm thực ở đây.", "除了中国文化以外，我还喜欢了解这里的历史和饮食。", "Chúle Zhōngguó wénhuà yǐwài, wǒ hái xǐhuan liǎojiě zhèlǐ de lìshǐ hé yǐnshí.", "除了…还…. 了解: tìm hiểu. 饮食: ăn uống, ẩm thực."], ["Căn nhà mà chúng tôi mới mua nằm ngay trên con đường chúng ta vừa đi qua.", "我们刚买的房子就在我们刚才走过的那条路上。", "Wǒmen gāng mǎi de fángzi jiù zài wǒmen gāngcái zǒu guo de nà tiáo lù shang.", "Hai định ngữ dài nối bằng 的. 就在: ngay ở. 刚买 (vừa mới mua) và 刚才走过 (lúc nãy đi qua)."], ["Có thể gặp được bạn ở đây, tôi thật sự rất vui!", "能在这儿见到你，我真的很高兴！", "Néng zài zhèr jiàn dào nǐ, wǒ zhēn de hěn gāoxìng!", "能: có thể. 见到: gặp được (bổ ngữ kết quả 到). Nơi chốn 在这儿 đứng trước động từ."], ["Ngoài việc đi học mỗi ngày, tôi còn rửa chén thêm ở một nhà hàng.", "除了每天上课以外，我还在一家饭馆洗碗。", "Chúle měi tiān shàngkè yǐwài, wǒ hái zài yì jiā fànguǎn xǐ wǎn.", "除了…以外，还…. 在 + nơi chốn + V: làm việc gì ở đâu."], ["Trong một năm, mùa nào tôi cũng thích.", "一年里，哪个季节我都喜欢。", "Yì nián li, nǎge jìjié wǒ dōu xǐhuan.", "哪个 + danh từ + 都: …nào cũng. Tân ngữ đưa lên trước chủ ngữ."], ["Chữ Hán của bạn đẹp lắm luôn! Bạn luyện viết kiểu gì vậy?", "你的汉字写得太好看了！你是怎么练的？", "Nǐ de Hànzì xiě de tài hǎokàn le! Nǐ shì zěnme liàn de?", "V得 + 太…了: bổ ngữ trạng thái. 是怎么…的: hỏi cách thức của việc đã làm."], ["Hoa bạn vẽ đẹp ghê, trông y như thật vậy!", "你画的花真漂亮，跟真的一样！", "Nǐ huà de huā zhēn piàoliang, gēn zhēn de yíyàng!", "你画的花: hoa bạn vẽ (định ngữ). 跟真的一样: y như thật."]], "dist": {"pair": "除了……都 và 除了……还", "w": [["除了……都", "chúle… dōu", "Loại trừ: A không nằm trong nhóm còn lại."], ["除了……还 / 也", "chúle… hái / yě", "Bổ sung: có A, thêm cả B."]], "q": [{"q": "除了小王以外，我们___去过长城，只有他没去过。", "o": ["都", "还"], "a": 0, "zh": "除了小王以外，我们都去过长城，只有他没去过。", "py": "Chúle Xiǎo Wáng yǐwài, wǒmen dōu qù guo Chángchéng, zhǐyǒu tā méi qù guo.", "vi": "Trừ Tiểu Vương ra, chúng tôi đều đi Vạn Lý Trường Thành rồi, chỉ có cậu ấy chưa đi.", "why": "Tiểu Vương bị loại ra khỏi nhóm, nên dùng 都."}, {"q": "除了唱歌，她___喜欢跳舞。", "o": ["都", "还"], "a": 1, "zh": "除了唱歌，她还喜欢跳舞。", "py": "Chúle chànggē, tā hái xǐhuan tiàowǔ.", "vi": "Ngoài hát ra, cô ấy còn thích nhảy.", "why": "Cô ấy thích cả hát lẫn nhảy, là bổ sung, nên dùng 还."}, {"q": "除了星期天，我每天___上班。", "o": ["都", "还"], "a": 0, "zh": "除了星期天，我每天都上班。", "py": "Chúle xīngqītiān, wǒ měi tiān dōu shàngbān.", "vi": "Trừ Chủ nhật, ngày nào tôi cũng đi làm.", "why": "Chủ nhật bị loại ra (không đi làm), nên dùng 都."}, {"q": "除了汉语，他___会说英语和法语。", "o": ["都", "还"], "a": 1, "zh": "除了汉语，他还会说英语和法语。", "py": "Chúle Hànyǔ, tā hái huì shuō Yīngyǔ hé Fǎyǔ.", "vi": "Ngoài tiếng Trung, anh ấy còn nói được tiếng Anh và tiếng Pháp.", "why": "Biết tiếng Trung và biết thêm hai thứ tiếng nữa, nên dùng 还."}]}}, {"no": 16, "zhT": "我现在累得下了班就想睡觉", "pyT": "Wǒ xiànzài lèi de xià le bān jiù xiǎng shuìjiào", "viT": "Bây giờ tôi mệt đến nỗi hết giờ làm là chỉ muốn ngủ", "g": [{"t": "得 + bổ ngữ chỉ mức độ (đến nỗi)", "f": "Tính từ / động từ + 得 + cụm từ, câu", "d": "Phần sau 得 mô tả mức độ, kết quả: mệt đến nỗi…, vui đến nỗi… Nếu động từ
