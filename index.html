uō de zhēn hǎo!", "vi": "Bạn nói tiếng Trung giỏi thật!", "why": "Sau động từ 说, dẫn ra đánh giá, nên dùng 得."}]}}, {"no": 17, "zhT": "谁都有办法看好你的“病”", "pyT": "Shéi dōu yǒu bànfǎ kàn hǎo nǐ de “bìng”", "viT": "Ai cũng có cách chữa khỏi “bệnh” của em", "g": [{"t": "Đại từ nghi vấn phiếm chỉ", "f": "谁 / 什么 / 哪儿 + 都 / 也 + …", "d": "Ai cũng, cái gì cũng, đâu cũng. Câu phủ định hay dùng 也: 谁也不知道.", "ex": ["这件事谁都知道。", "Zhè jiàn shì shéi dōu zhīdào.", "Chuyện này ai cũng biết."]}, {"t": "不是……都……", "f": "不是 + 谁 / 什么 + 都 + …", "d": "Không phải ai / cái gì cũng… (phủ định một phần).", "ex": ["不是谁都能学好汉语。", "Bú shì shéi dōu néng xué hǎo Hànyǔ.", "Không phải ai cũng học giỏi được tiếng Trung."]}, {"t": "Động từ ly hợp", "f": "请假 → 请几天假 ／ 跑步 → 跑完步", "d": "Động từ ly hợp gồm động từ + tân ngữ. Thời lượng, bổ ngữ kết quả phải chen vào giữa hai chữ.", "ex": ["我想请两天假。", "Wǒ xiǎng qǐng liǎng tiān jià.", "Tôi muốn xin nghỉ hai ngày."]}, {"t": "Liệt kê và kể trình tự", "f": "一是…，二是… ／ 以前…，后来…，最后…", "d": "一是…二是…: một là… hai là… 以前…后来…最后…: trước đây… sau đó… cuối cùng… (kể lại chuyện đã qua).", "ex": ["他以前是老师，后来当了经理。", "Tā yǐqián shì lǎoshī, hòulái dāng le jīnglǐ.", "Trước đây anh ấy là giáo viên, sau đó làm giám đốc."]}], "s": [["Cuối tuần này tôi muốn xin nghỉ phép mấy ngày vì có việc riêng.", "这个周末我想请几天假，因为我有一些自己的事情。", "Zhège zhōumò wǒ xiǎng qǐng jǐ tiān jià, yīnwèi wǒ yǒu yìxiē zìjǐ de shìqing.", "请假 là động từ ly hợp: thời lượng chen vào giữa, 请几天假. 自己的事情: việc riêng."], ["Hàng xóm của tôi ai cũng rất nhiệt tình và yêu thích thể thao.", "我的邻居们谁都很热情，也都很喜欢运动。", "Wǒ de línjūmen shéi dōu hěn rèqíng, yě dōu hěn xǐhuan yùndòng.", "谁都: ai cũng. 也都: cũng đều. Thể thao, vận động là 运动."], ["Bạn trai tôi vẽ tranh, hát, đá bóng... cái gì cũng giỏi.", "我男朋友画画儿、唱歌、踢足球……什么都做得很好。", "Wǒ nánpéngyou huà huàr, chàng gē, tī zúqiú…… shénme dōu zuò de hěn hǎo.", "什么都: cái gì cũng. 做得很好: làm giỏi (bổ ngữ trạng thái). Khẩu ngữ hay nói 什么都很厉害."], ["\"Thể thao rất quan trọng\" – câu nói này không phải ai cũng hiểu rõ.", "“运动很重要”——这句话不是谁都真的明白。", "“Yùndòng hěn zhòngyào” —— zhè jù huà bú shì shéi dōu zhēn de míngbai.", "不是谁都…: không phải ai cũng… (phủ định một phần). Lượng từ của câu nói là 句."], ["Bạn cần nhớ: vừa chạy bộ xong thì không nên ngồi xuống ngay.", "你要记住：刚跑完步，不要马上坐下。", "Nǐ yào jì zhù: gāng pǎo wán bù, búyào mǎshàng zuò xià.", "跑步 là động từ ly hợp: 跑完步 (完 chen vào giữa). 记住: nhớ kỹ. 马上: ngay lập tức."], ["Chúng tôi trước đây là bạn bè, sau đó trở thành bạn thân, cuối cùng là người yêu.", "我们以前是朋友，后来变成了好朋友，最后成了男女朋友。", "Wǒmen yǐqián shì péngyou, hòulái biànchéng le hǎo péngyou, zuìhòu chéng le nán-nǚ péngyou.", "以前…后来…最后…: kể trình tự chuyện đã qua. 变成 / 成: trở thành."], ["Ai cũng biết thể thao tốt cho sức khỏe, chỉ có tôi là không biết giữ gìn.", "谁都知道运动对身体好，只有我不注意自己的身体。", "Shéi dōu zhīdào yùndòng duì shēntǐ hǎo, zhǐyǒu wǒ bú zhùyì zìjǐ de shēntǐ.", "谁都知道: ai cũng biết. A对B好: A tốt cho B. 只有: chỉ có."], ["Bài thi hôm nay gồm hai phần: một là chọn đúng sai, hai là trả lời câu hỏi.", "今天的考试有两个部分：一是判断对错，二是回答问题。", "Jīntiān de kǎoshì yǒu liǎng ge bùfen: yī shì pànduàn duì cuò, èr shì huídá wèntí.", "一是…二是…: một là… hai là… 部分: phần. 判断对错: phán đoán đúng sai."], ["Ai cũng có cách riêng để giúp bạn vượt qua khó khăn.", "谁都有自己的办法帮你解决问题。", "Shéi dōu yǒu zìjǐ de bànfǎ bāng nǐ jiějué wèntí.", "谁都有: ai cũng có. 办法 + động từ: cách để làm gì. 解决问题: giải quyết vấn đề."], ["\"Bệnh\" lười của em, ai cũng có thể chữa được – trừ chính em!", "你的“懒病”，谁都能看好——除了你自己！", "Nǐ de “lǎn bìng”, shéi dōu néng kàn hǎo —— chúle nǐ zìjǐ!", "看好病: chữa khỏi bệnh (看 ở đây là khám chữa). 除了…: trừ… ra."]], "dist": {"pair": "以前, 后来 và 然后", "w": [["以前", "yǐqián", "Trước đây, so với bây giờ."], ["后来", "hòulái", "Về sau, sau đó. Chỉ dùng khi kể chuyện ĐÃ qua."], ["然后", "ránhòu", "Sau đó, tiếp theo. Nối trình tự các bước, dùng được cả cho tương lai."]], "q": [{"q": "我___不喜欢运动，现在每天都跑步。", "o": ["以前", "后来", "然后"], "a": 0, "zh": "我以前不喜欢运动，现在每天都跑步。", "py": "Wǒ yǐqián bù xǐhuan yùndòng, xiànzài měi tiān dōu pǎobù.", "vi": "Trước đây tôi không thích thể thao, giờ ngày nào cũng chạy bộ.", "why": "So sánh với 现在, nên dùng 以前."}, {"q": "我们先吃饭，___去看电影。", "o": ["以前", "后来", "然后"], "a": 2, "zh": "我们先吃饭，然后去看电影。", "py": "Wǒmen xiān chī fàn, ránhòu qù kàn diànyǐng.", "vi": "Chúng ta ăn cơm trước, sau đó đi xem phim.", "why": "Kế hoạch chưa xảy ra, nối trình tự sau 先, nên dùng 然后. 后来 không dùng cho tương lai."}, {"q": "他去年来过一次，___再也没来过。", "o": ["以前", "后来", "然后"], "a": 1, "zh": "他去年来过一次，后来再也没来过。", "py": "Tā qùnián lái guo yí cì, hòulái zài yě méi lái guo.", "vi": "Năm ngoái anh ấy đến một lần, về sau không đến nữa.", "why": "Kể chuyện đã qua, chỉ khoảng thời gian về sau, nên dùng 后来."}, {"q": "你先往前走，___往左走。", "o": ["以前", "后来", "然后"], "a": 2, "zh": "你先往前走，然后往左走。", "py": "Nǐ xiān wǎng qián zǒu, ránhòu wǎng zuǒ zǒu.", "vi": "Bạn đi thẳng trước, sau đó rẽ trái.", "why": "Chỉ đường là các bước theo thứ tự, nên dùng 然后."}]}}, {"no": 18, "zhT": "我相信他们会同意的", "pyT": "Wǒ xiāngxìn tāmen huì tóngyì de", "viT": "Tôi tin họ sẽ đồng ý", "g": [{"t": "只要……就……", "f": "只要 + điều kiện，(主语) + 就 + kết quả", "d": "Chỉ cần… là… Điều kiện đủ: có nó là có kết quả, nhưng không phải điều kiện duy nhất.", "ex": ["只要你喜欢，就买吧。", "Zhǐyào nǐ xǐhuan, jiù mǎi ba.", "Chỉ cần bạn thích thì mua đi."]}, {"t": "关于", "f": "关于 + chủ đề，…", "d": "Về (vấn đề gì). Thường đứng đầu câu để nêu chủ đề.", "ex": ["关于这件事，我们明天再说。", "Guānyú zhè jiàn shì, wǒmen míngtiān zài shuō.", "Về chuyện này, mai mình bàn tiếp."]}, {"t": "会……的", "f": "会 + động từ + 的", "d": "Khẳng định chắc chắn điều gì đó sẽ xảy ra.", "ex": ["我相信他们会同意的。", "Wǒ xiāngxìn tāmen huì tóngyì de.", "Tôi tin họ sẽ đồng ý."]}, {"t": "A 跟 B 一样，都……", "f": "A 跟 B 一样，都 + …", "d": "A cũng giống B, đều…", "ex": ["我跟你一样，都是学生。", "Wǒ gēn nǐ yíyàng, dōu shì xuésheng.", "Tôi cũng như bạn, đều là học sinh."]}], "s": [["Chỉ cần em đồng ý, anh nguyện sẽ đối xử tốt với em cả đời.", "只要你同意，我就一辈子对你好。", "Zhǐyào nǐ tóngyì, wǒ jiù yíbèizi duì nǐ hǎo.", "只要…就…: chỉ cần… là… 对 + người + 好: đối xử tốt với ai. 一辈子: cả đời."], ["Tôi muốn mượn bạn một ít tiền, được không?", "我想跟你借点儿钱，可以吗？", "Wǒ xiǎng gēn nǐ jiè diǎnr qián, kěyǐ ma?", "Mượn CỦA ai: 跟 + người + 借. Nếu nói 借你钱 lại thành \"cho bạn mượn tiền\"."], ["Tôi nghĩ, chỉ cần tôi chăm chỉ học tập thì nhất định sẽ thi đậu đại học.", "我觉得，只要我努力学习，就一定能考上大学。", "Wǒ juéde, zhǐyào wǒ nǔlì xuéxí, jiù yídìng néng kǎo shàng dàxué.", "只要…就…. 考上: thi đỗ (bổ ngữ kết quả 上). 一定: nhất định."], ["Về việc mua nhà, tôi vẫn chưa quyết định sẽ mua ở đâu.", "关于买房子的事，我还没决定在哪儿买。", "Guānyú mǎi fángzi de shì, wǒ hái méi juédìng zài nǎr mǎi.", "关于…的事: về chuyện… đứng đầu câu. 还没决定: vẫn chưa quyết định."], ["Về kỳ thi đại học, tôi vẫn chưa nghĩ xong sẽ đăng ký trường nào.", "关于高考，我还没想好要考哪个大学。", "Guānyú gāokǎo, wǒ hái méi xiǎng hǎo yào kǎo nǎge dàxué.", "关于 + chủ đề. 想好: nghĩ xong (bổ ngữ kết quả 好). Kỳ thi đại học ở Trung Quốc gọi là 高考."], ["Bạn có biết không, động vật cũng giống như trẻ em – đều cần được chăm sóc.", "你知道吗？动物跟孩子一样，都需要别人照顾。", "Nǐ zhīdào ma? Dòngwù gēn háizi yíyàng, dōu xūyào biérén zhàogù.", "A跟B一样，都…: A cũng như B, đều… \"Được chăm sóc\" dịch thành 需要别人照顾 cho tự nhiên."], ["Mỗi người đều có thói quen sinh hoạt khác nhau.", "每个人都有不同的生活习惯。", "Měi ge rén dōu yǒu bù tóng de shēnghuó xíguàn.", "每…都…. 不同的: khác nhau (định ngữ). 生活习惯: thói quen sinh hoạt."], ["Sau một thời gian cố gắng làm việc, giám đốc giờ đã rất tin tưởng tôi.", "经过一段时间的努力工作，经理现在已经很相信我了。", "Jīngguò yí duàn shíjiān de nǔlì gōngzuò, jīnglǐ xiànzài yǐjīng hěn xiāngxìn wǒ le.", "经过…: trải qua… 一段时间: một khoảng thời gian. 相信: tin tưởng. 已经…了: đã… rồi."], ["Thành phố này có đặc điểm gì? Bạn có thể giới thiệu cho tôi một chút không?", "这个城市有什么特点？你能给我介绍一下吗？", "Zhège chéngshì yǒu shénme tèdiǎn? Nǐ néng gěi wǒ jièshào yíxià ma?", "特点: đặc điểm. 给 + người + 介绍一下: giới thiệu cho ai một chút."], ["Khi đến làm việc tại một công ty mới, bạn sẽ luôn có cảm giác mới mẻ.", "到一个新公司工作的时候，你总会有一种新鲜的感觉。", "Dào yí ge xīn gōngsī gōngzuò de shíhou, nǐ zǒng huì yǒu yì zhǒng xīnxiān de gǎnjué.", "…的时候: khi… 总会: luôn sẽ. 新鲜的感觉: cảm giác mới mẻ; lượng từ là 种."]], "dist": {"pair": "会, 能 và 可以", "w": [["会", "huì", "Biết làm (nhờ học mà có); hoặc \"sẽ\" (dự đoán)."], ["能", "néng", "Có khả năng, có điều kiện để làm."], ["可以", "kěyǐ", "Được phép; xin phép."]], "q": [{"q": "我___说一点儿汉语。", "o": ["会", "能", "可以"], "a": 0, "zh": "我会说一点儿汉语。", "py": "Wǒ huì shuō yìdiǎnr Hànyǔ.", "vi": "Tôi biết nói một chút tiếng Trung.", "why": "Kỹ năng có được nhờ học, nên dùng 会."}, {"q": "老师，我___进来吗？", "o": ["会", "能", "可以"], "a": 2, "zh": "老师，我可以进来吗？", "py": "Lǎoshī, wǒ kěyǐ jìnlai ma?", "vi": "Thưa cô, em vào được không ạ?", "why": "Xin phép, nên dùng 可以."}, {"q": "我相信他们___同意的。", "o": ["会", "能", "可以"], "a": 0, "zh": "我相信他们会同意的。", "py": "Wǒ xiāngxìn tāmen huì tóngyì de.", "vi": "Tôi tin họ sẽ đồng ý.", "why": "Dự đoán tương lai trong cấu trúc 会…的."}, {"q": "我感冒了，明天不___去上课了。", "o": ["会", "能", "可以"], "a": 1, "zh": "我感冒了，明天不能去上课了。", "py": "Wǒ gǎnmào le, míngtiān bù néng qù shàngkè le.", "vi": "Tôi bị cảm rồi, mai không đi học được.", "why": "Do điều kiện sức khỏe mà không làm được, nên dùng 能."}]}}, {"no": 19, "zhT": "你没看出来吗", "pyT": "Nǐ méi kàn chūlai ma", "viT": "Anh không nhìn ra được à?", "g": [{"t": "出来 (nghĩa mở rộng)", "f": "看 / 听 / 认 / 写 / 猜 + 出来", "d": "Không còn là \"đi ra\" nữa, mà là làm cho điều gì đó lộ ra, nhận biết được: 看出来 (nhìn ra), 认出来 (nhận ra), 猜出来 (đoán ra), 写出来 (viết ra).", "ex": ["我听出来了，是你的声音。", "Wǒ tīng chūlai le, shì nǐ de shēngyīn.", "Tôi nghe ra rồi, là giọng bạn."]}, {"t": "起来 (nghĩa mở rộng)", "f": "想起来 ／ 看起来", "d": "想起来: nhớ ra điều đã quên. 看起来 / 听起来: xem ra, trông có vẻ, nghe có vẻ.", "ex": ["这个菜看起来很好吃。", "Zhège cài kàn qǐlai hěn hǎochī.", "Món này trông có vẻ ngon."]}, {"t": "下来 (nghĩa mở rộng)", "f": "安静 / 慢 / 停 + 下来", "d": "Chuyển từ trạng thái động sang tĩnh, dần ổn định lại.", "ex": ["教室里安静下来了。", "Jiàoshì li ānjìng xiàlai le.", "Lớp học đã yên lặng lại."]}, {"t": "Bổ ngữ khả năng với xu hướng", "f": "V + 得 / 不 + 出来 / 起来", "d": "看不出来 (không nhìn ra được), 想不起来 (không nhớ ra được).", "ex": ["我想不起来他的名字。", "Wǒ xiǎng bu qǐlai tā de míngzi.", "Tôi không nhớ ra tên anh ấy."]}], "s": [["Tên tiếng Trung của mình, bạn có thể viết ra không?", "我的中文名字，你能写出来吗？", "Wǒ de Zhōngwén míngzi, nǐ néng xiě chūlai ma?", "写出来: viết ra được (出来 nghĩa mở rộng). Tân ngữ 我的中文名字 đưa lên đầu câu làm chủ đề."], ["Mình không đoán ra cậu nấu món gì nữa.", "我猜不出来你做的是什么菜。", "Wǒ cāi bu chūlai nǐ zuò de shì shénme cài.", "猜不出来: bổ ngữ khả năng, không đoán ra được. 你做的: món bạn nấu."], ["Xin lỗi, mình không nhận ra cậu là ai.", "对不起，我没认出来你是谁。", "Duìbuqǐ, wǒ méi rèn chūlai nǐ shì shéi.", "认出来: nhận ra. Chuyện vừa xảy ra nên phủ định bằng 没. Muốn nói \"không thể nhận ra\" thì dùng 认不出来."], ["Đứa trẻ đó nếu đang khóc chỉ cần nhìn thấy tôi là sẽ yên lặng lại.", "那个孩子如果在哭，只要看见我就会安静下来。", "Nàge háizi rúguǒ zài kū, zhǐyào kànjiàn wǒ jiù huì ānjìng xiàlai.", "安静下来: yên lặng lại (下来 nghĩa mở rộng). 只要…就…: chỉ cần… là… 在 + V: đang."], ["Tốt quá, bạn thức dậy rồi, chúng ta sắp trễ học rồi bạn biết không?", "太好了，你终于醒了！我们上课快要迟到了，你知道吗？", "Tài hǎo le, nǐ zhōngyú xǐng le! Wǒmen shàngkè kuài yào chídào le, nǐ zhīdào ma?", "醒了: tỉnh, thức dậy rồi. 快要…了: sắp. 迟到: đến muộn. (醒过来 thường dùng khi tỉnh lại sau khi ngất, ốm nặng.)"], ["Tôi không thể nhớ được cuốn sách này là của ai.", "我想不起来这本书是谁的了。", "Wǒ xiǎng bu qǐlai zhè běn shū shì shéi de le.", "想不起来: không nhớ ra được (bổ ngữ khả năng + 起来). 了 cuối câu: trạng thái mới (đã quên mất)."], ["Hôm nay sao bạn không nói gì cả, xem ra hình như không vui lắm.", "你今天怎么不说话？看起来好像不太高兴。", "Nǐ jīntiān zěnme bù shuōhuà? Kàn qǐlai hǎoxiàng bú tài gāoxìng.", "看起来: xem ra, trông có vẻ. 好像: hình như. 怎么不…: sao không…"], ["Trải qua một thời gian cố gắng làm việc, giám đốc bây giờ rất tin tưởng tôi.", "经过一段时间的努力工作，经理现在很相信我。", "Jīngguò yí duàn shíjiān de nǔlì gōngzuò, jīnglǐ xiànzài hěn xiāngxìn wǒ.", "Câu này giống câu 8 bài 18. 经过…: trải qua… 相信: tin tưởng."], ["Mình thật sự mong thời gian có thể chậm lại, mình sắp phải về nước rồi.", "我真希望时间能过得慢一点儿，我快要回国了。", "Wǒ zhēn xīwàng shíjiān néng guò de màn yìdiǎnr, wǒ kuài yào huí guó le.", "希望: mong. 过得慢一点儿: trôi chậm hơn một chút. Cũng có thể nói 时间能慢下来 (下来 nghĩa mở rộng)."], ["Đọc sách mỗi ngày khiến tôi cảm thấy rất hạnh phúc.", "每天看书让我觉得很幸福。", "Měi tiān kàn shū ràng wǒ juéde hěn xìngfú.", "让 + người + cảm xúc: khiến ai cảm thấy… Văn viết trang trọng hơn dùng 使 (shǐ)."]], "dist": {"pair": "出来 và 起来", "w": [["出来", "chūlai", "Làm lộ ra, nhận biết được, tạo ra cái mới: 看出来 (nhìn ra), 想出来 (nghĩ ra)."], ["起来", "qǐlai", "想起来: nhớ ra điều đã quên. 看起来: trông có vẻ."]], "q": [{"q": "你没看___吗？她今天不太高兴。", "o": ["出来", "起来"], "a": 0, "zh": "你没看出来吗？她今天不太高兴。", "py": "Nǐ méi kàn chūlai ma? Tā jīntiān bú tài gāoxìng.", "vi": "Bạn không nhìn ra à? Hôm nay cô ấy không vui lắm.", "why": "Quan sát rồi nhận ra điều gì, nên dùng 看出来."}, {"q": "这件衣服看___很贵。", "o": ["出来", "起来"], "a": 1, "zh": "这件衣服看起来很贵。", "py": "Zhè jiàn yīfu kàn qǐlai hěn guì.", "vi": "Cái áo này trông có vẻ đắt.", "why": "Nhận xét theo vẻ bề ngoài (trông có vẻ), nên dùng 看起来."}, {"q": "我终于想___他叫什么名字了。", "o": ["出来", "起来"], "a": 1, "zh": "我终于想起来他叫什么名字了。", "py": "Wǒ zhōngyú xiǎng qǐlai tā jiào shénme míngzi le.", "vi": "Cuối cùng tôi cũng nhớ ra anh ấy tên gì.", "why": "Nhớ lại điều đã biết nhưng quên, nên dùng 想起来."}, {"q": "这个好办法是谁想___的？", "o": ["出来", "起来"], "a": 0, "zh": "这个好办法是谁想出来的？", "py": "Zhège hǎo bànfǎ shì shéi xiǎng chūlai de?", "vi": "Cách hay này là ai nghĩ ra vậy?", "why": "Nghĩ ra một điều mới, trước đó chưa có, nên dùng 想出来."}]}}, {"no": 20, "zhT": "我被他影响了", "pyT": "Wǒ bèi tā yǐngxiǎng le", "viT": "Mình chịu ảnh hưởng từ anh ấy", "g": [{"t": "Câu bị động với 被", "f": "Chủ thể chịu tác động + 被 + (người làm) + động từ + thành phần khác", "d": "Sau động từ thường phải có 了, bổ ngữ kết quả… (吃完了, 认错了). Phủ định đặt 没 trước 被: 没被发现. Người làm có thể lược bỏ.", "ex": ["我的自行车被弟弟骑走了。", "Wǒ de zìxíngchē bèi dìdi qí zǒu le.", "Xe đạp của tôi bị em trai đạp đi mất rồi."]}, {"t": "只有……才……", "f" (function(){
const app=document.getElementById("app"),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY=n=>"hsk3_bai_"+n, GL="hsk3_global";
const load=(k,d)=>{try{const r=localStorage.getItem(k);return r?Object.assign(d,JSON.parse(r)):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const G=load(GL,{hidePy:false});
const canSpeak="speechSynthesis" in window;
function applyPy(){document.body.classList.toggle("hide-py",G.hidePy);const b=$("#togPy");b.setAttribute("aria-pressed",G.hidePy);b.textContent=G.hidePy?"Hiện pinyin":"Ẩn pinyin"}
$("#togPy").onclick=()=>{G.hidePy=!G.hidePy;store(GL,G);applyPy()};
applyPy();
function speak(t){if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.85;speechSynthesis.speak(u)}
const sp=t=>canSpeak?`<button class="speak" data-say="${esc(t)}" aria-label="Nghe đọc">🔊</button>`:"";
const norm=s=>(s||"").replace(/[\s\u3000，。！？、；：“”‘’"'（）()《》…—\-,.!?;:~·]/g,"");
function lcs(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ka=new Array(n).fill(false),kb=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ka[i]=kb[j]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  return {len:d[0][0],ka,kb}}
function grade(user,ans){const a=[...norm(user)],b=[...norm(ans)];if(!a.length)return {level:"no",pct:0,blank:true};
  const r=lcs(a,b),pct=Math.round(200*r.len/(a.length+b.length)),level=pct===100?"ok":pct>=80?"near":"no";
  return {level,pct,ua:a.map((c,i)=>r.ka[i]?esc(c):`<span class="x">${esc(c)}</span>`).join(""),ub:b.map((c,j)=>r.kb[j]?esc(c):`<span class="m">${esc(c)}</span>`).join("")}}
const newS=()=>({ans:{},mc:{},subS:false,subM:false});
function stats(L){const S=load(KEY(L.no),newS());let ok=0,mc=0;
  if(S.subS)L.s.forEach((s,i)=>{if(grade(S.ans[i],s[1]).level==="ok")ok++});
  if(S.subM)L.dist.q.forEach((q,i)=>{if(S.mc[i]===q.a)mc++});
  return {S,ok,mc}}

function home(){
  let done=0;
  const rows=LESSONS.map(L=>{const {S,ok,mc}=stats(L);const n=(S.subS?1:0)+(S.subM?1:0);if(n===2)done++;
    const chip=n===2?`<span class="chip ok">Xong · dịch ${ok}/${L.s.length} · từ ${mc}/${L.dist.q.length}</span>`:n===1?`<span class="chip part">Đã làm 1/2 phần</span>`:`<span class="chip">Chưa học</span>`;
    return `<li><a class="row" href="#/bai/${L.no}"><span class="no">${L.no}</span><span class="rt"><div class="z">${esc(L.zhT)}</div><div class="v">${esc(L.viT)}</div></span>${chip}</a></li>`}).join("");
  const gp=LESSONS.reduce((a,L)=>a+L.g.length,0),sn=LESSONS.reduce((a,L)=>a+L.s.length,0);
  app.innerHTML=`<h1>HSK 3</h1><p class="muted" style="margin:0">Mỗi bài gồm ngữ pháp, luyện dịch câu và phân biệt từ dễ nhầm.</p>
    <div class="sum"><div><b>${done}/${LESSONS.length}</b><span>bài đã hoàn thành</span></div><div><b>${gp}</b><span>điểm ngữ pháp</span></div><div><b>${sn}</b><span>câu luyện dịch</span></div></div>
    <ul class="list">${rows}</ul>`;
  document.title="HSK 3 – Học tiếng Trung";window.scrollTo(0,0)}

function lesson(no,tab){
  const L=LESSONS.find(x=>x.no===no);if(!L)return location.hash="#/";
  const S=load(KEY(no),newS());tab=tab||"g";
  let warned={s:false,m:false};
  const head=`<div class="crumb"><a href="#/">← Danh sách bài</a></div><div class="head"><div class="muted" style="color:var(--crimson);font-weight:600">Bài ${L.no}</div>
    <h1>${esc(L.zhT)}${sp(L.zhT)}</h1><p class="py pyw">${esc(L.pyT)}</p><p class="vt">${esc(L.viT)}</p></div>
    <div class="tabs" role="tablist">${[["g","Ngữ pháp"],["s","Dịch câu"],["d","Phân biệt từ"]].map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join("")}</div>`;
  const prev=LESSONS.find(x=>x.no===no-1),next=LESSONS.find(x=>x.no===no+1);
  const pn=`<div class="pn">${prev?`<a href="#/bai/${prev.no}">← Bài ${prev.no}</a>`:"<span></span>"}${next?`<a href="#/bai/${next.no}">Bài ${next.no} →</a>`:"<span></span>"}</div>`;

  function gram(){return L.g.map(g=>`<div class="gp"><h3>${esc(g.t)}</h3><div class="formula">${esc(g.f)}</div><p>${esc(g.d)}</p>
    <div class="gex"><div class="z">${esc(g.ex[0])}${sp(g.ex[0])}</div><div class="y">${esc(g.ex[1])}</div><div class="v">${esc(g.ex[2])}</div></div></div>`).join("")}

  function sent(){const sub=S.subS;let ok=0,near=0;
    const items=L.s.map((s,i)=>{let res="",cls="";
      if(sub){const g=grade(S.ans[i],s[1]);cls=g.level;if(g.level==="ok")ok++;else if(g.level==="near")near++;
        const lb=g.blank?"Chưa làm":g.level==="ok"?"Khớp đáp án":g.level==="near"?"Gần đúng":"Chưa đúng";
        res=`<div class="res"><span class="badge ${g.level}">${lb}${g.blank?"":" "+g.pct+"%"}</span>
          ${(!g.blank&&g.level!=="ok")?`<div class="cmp">Bài của bạn (gạch ngang là chữ thừa hoặc sai):<div class="line">${g.ua}</div>Đáp án (tô đậm là chữ bạn còn thiếu):<div class="line">${g.ub}</div></div>`:""}
          <div class="answer"><div class="ans-zh">${esc(s[1])}${sp(s[1])}</div><div class="ans-py">${esc(s[2])}</div><div class="ans-note"><b>Ngữ pháp:</b> ${esc(s[3])}</div></div></div>`}
      return `<li class="item ${cls}"><div class="vs"><span class="n">${i+1}</span>${esc(s[0])}</div>
        <textarea data-i="${i}" rows="2" ${sub?"disabled":""} placeholder="Viết câu tiếng Trung của bạn vào đây…" aria-label="Dịch câu ${i+1}">${esc(S.ans[i]||"")}</textarea>${res}</li>`}).join("");
    const left=L.s.filter((_,i)=>!norm(S.ans[i]).length).length;
    const box=sub?`<div class="sbox"><h2>Kết quả dịch câu</h2><div class="score"><div><b>${ok}/${L.s.length}</b><span>khớp đáp án</span></div><div><b>${near}</b><span>gần đúng</span></div></div>
      <p class="muted">Máy chấm bằng cách so từng chữ với đáp án. Câu "gần đúng" hoặc "chưa đúng" có thể vẫn là một cách dịch hợp lệ.</p><button class="btn" id="redoS">Làm lại phần này</button></div>`
      :`<div class="sbox"><h2>Nộp bài dịch</h2><p class="${warned.s?"warn":"muted"}">${warned.s?`Còn ${left} câu chưa làm. Nộp rồi sẽ không sửa được.`:"Đáp án và giải thích chỉ hiện ra sau khi nộp."}</p><button class="btn primary" id="subS">${warned.s?"Vẫn nộp bài":"Nộp bài và xem đáp án"}</button></div>`;
    return `<ol class="items">${items}</ol>${box}`}

  function dist(){const D=L.dist,sub=S.subM;let ok=0;
    const w=`<div class="dw">${D.w.map(x=>`<div><div class="w">${esc(x[0])}${sp(x[0])}</div><div class="y pyw muted">${esc(x[1])}</div><div>${esc(x[2])}</div></div>`).join("")}</div>`;
    const qs=D.q.map((q,qi)=>{const pick=S.mc[qi];let fb="";
      if(sub){const good=pick===q.a;if(good)ok++;
        fb=`<div class="fb ${good?"ok":"no"}"><b>${good?"Chính xác.":pick===undefined?"Chưa làm. Đáp án là "+esc(q.o[q.a])+".":"Chưa đúng, đáp án là "+esc(q.o[q.a])+"."}</b> ${esc(q.why)}<div class="full">${esc(q.zh)}${sp(q.zh)}</div><div class="mc-py">${esc(q.py)}</div><div>${esc(q.vi)}</div></div>`}
      const opts=q.o.map((o,oi)=>{let c="";if(sub){if(oi===q.a)c="right";else if(pick===oi)c="wrong"}
        return `<button class="opt ${c}" data-q="${qi}" data-o="${oi}" aria-pressed="${!sub&&pick===oi}" ${sub?"disabled":""}>${esc(o)}</button>`}).join("");
      return `<div class="mc">${q.ctx?`<div class="mc-ctx">${esc(q.ctx)}</div>`:""}<div class="mc-q"><span class="n">${qi+1}.</span>${esc(q.q).replace(/___/g,'<span class="blank"></span>')}</div><div class="opts">${opts}</div>${fb}</div>`}).join("");
    const left=D.q.length-Object.keys(S.mc).length;
    const box=sub?`<div class="sbox"><h2>Kết quả</h2><div class="score"><div><b>${ok}/${D.q.length}</b><span>câu đúng</span></div></div><button class="btn" id="redoM">Làm lại phần này</button></div>`
      :`<div class="sbox"><p class="${warned.m?"warn":"muted"}">${warned.m?`Còn ${left} câu chưa chọn. Nộp rồi sẽ không sửa được.`:"Chọn đáp án cho từng câu rồi nộp để xem giải thích."}</p><button class="btn primary" id="subM">${warned.m?"Vẫn nộp bài":"Nộp bài"}</button></div>`;
    return `<h2>${esc(D.pair)}</h2>${w}${qs}${box}`}

  function draw(keepScroll){
    app.innerHTML=head+(tab==="g"?gram():tab==="s"?sent():dist())+pn;
    document.title=`Bài ${L.no} – ${L.zhT} · HSK 3`;
    if(!keepScroll)window.scrollTo(0,0);
    app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
    app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
    app.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{S.ans[t.dataset.i]=t.value;store(KEY(no),S)});
    app.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{S.mc[b.dataset.q]=+b.dataset.o;store(KEY(no),S);
      b.parentNode.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",o===b))});
    const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
    on("#subS",()=>{const left=L.s.filter((_,i)=>!norm(S.ans[i]).length).length;if(left&&!warned.s){warned.s=true;draw(true);return}S.subS=true;store(KEY(no),S);draw()});
    on("#subM",()=>{const left=L.dist.q.length-Object.keys(S.mc).length;if(left&&!warned.m){warned.m=true;draw(true);return}S.subM=true;store(KEY(no),S);draw()});
    on("#redoS",()=>{S.subS=false;S.ans={};store(KEY(no),S);warned.s=false;draw()});
    on("#redoM",()=>{S.subM=false;S.mc={};store(KEY(no),S);warned.m=false;draw()});
  }
  draw()}

function route(){const m=location.hash.match(/^#\/bai\/(\d+)/);m?lesson(+m[1]):home()}
addEventListener("hashchange",route);route();
})();
</script>
</body>
</html>
